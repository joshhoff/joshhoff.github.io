<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Portfolio – Local Government</title>

  <!-- Optional: ArcGIS Maps SDK for when you add real maps
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.30/"></script>
  -->

  <style>
    :root {
      --brand: #1f5a8c;
      --brand-light: #e4f0fa;
      --text: #333;
      --muted: #666;
      --border: #d0d7df;
      --bg: #f7fafc;
      --radius: 8px;
      --maxw: 900px;
    }

    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--brand);
      color: white;
      padding: 1rem 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    main {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    .project {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .project h2 {
      font-size: 1.25rem;
      margin-top: 0;
      color: var(--brand);
    }

    .map-container {
      background: var(--brand-light);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0.75rem 0 1rem;
    }

    .desc textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 0.5rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .add-btn {
      display: inline-block;
      background: var(--brand);
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .add-btn:hover {
      background: #17456b;
    }

    @media print {
      header, .add-btn { display: none; }
      body { background: white; }
    }
  </style>
</head>
<body>
  <header>
    <h1>GIS Portfolio</h1>
    <p style="margin:0;font-size:0.9rem;">Examples of mapping work supporting local government decisions</p>
  </header>

  <main id="projects">
    <section class="project">
      <h2>Project Title</h2>
      <div class="map-container" id="map-1">
        [Map will go here – ArcGIS Web Map container]
      </div>
      <div class="desc">
        <textarea placeholder="Describe what this map shows, its purpose, and your role in creating it."></textarea>
      </div>
    </section>

    <section class="project">
      <h2>Project Title</h2>
      <div class="map-container" id="map-2">
        [Map will go here – ArcGIS Web Map container]
      </div>
      <div class="desc">
        <textarea placeholder="Describe what this map shows, its purpose, and your role in creating it."></textarea>
      </div>
    </section>

    <button class="add-btn" id="add">+ Add Another Project</button>
  </main>

  <script>
    // Add new project sections
    document.getElementById('add').addEventListener('click', () => {
      const projects = document.getElementById('projects');
      const idx = projects.querySelectorAll('.project').length + 1;
      const section = document.createElement('section');
      section.className = 'project';
      section.innerHTML = `
        <h2>Project Title</h2>
        <div class="map-container" id="map-${idx}">
          [Map will go here – ArcGIS Web Map container]
        </div>
        <div class="desc">
          <textarea placeholder="Describe what this map shows, its purpose, and your role in creating it."></textarea>
        </div>
      `;
      projects.insertBefore(section, document.getElementById('add'));
    });
  </script>
</body>
</html>
