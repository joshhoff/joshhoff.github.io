  <script>
    const writtenAnswers = {
      1: ["get over"],
      2: ["bring up"],
      3: ["get round to"],
      4: ["bring about"]
    };

    let selectedExpression = null;
    let selectedMeaning = null;
    const matchedKeys = new Set();

    function normalise(value) {
      return value.toLowerCase().trim().replace(/[.!?]/g, "").replace(/\s+/g, " ");
    }

    function updateProgress() {
      let writtenCorrect = 0;
      Object.keys(writtenAnswers).forEach((number) => {
        const input = document.getElementById("answer-" + number);
        if (input.classList.contains("is-correct")) writtenCorrect++;
      });

      const total = writtenCorrect + matchedKeys.size;
      document.getElementById("progress-number").textContent = total + " / 8";
      document.getElementById("progress-fill").style.width = (total / 8 * 100) + "%";
      document.getElementById("complete-message").classList.toggle("hidden", total !== 8);
    }

    function checkWrittenAnswers() {
      Object.keys(writtenAnswers).forEach((number) => {
        const input = document.getElementById("answer-" + number);
        const feedback = document.getElementById("feedback-" + number);
        const isCorrect = writtenAnswers[number].includes(normalise(input.value));

        input.classList.remove("is-correct", "is-wrong");
        if (!input.value.trim()) {
          feedback.textContent = "Add an answer first.";
          feedback.style.color = "#7b5c20";
          return;
        }
        input.classList.add(isCorrect ? "is-correct" : "is-wrong");
        feedback.textContent = isCorrect ? "Correct — nice use of the expression." : "Not quite — look at the context and try again.";
        feedback.style.color = isCorrect ? "#36745d" : "#b34737";
      });
      updateProgress();
    }

    function clearSelection() {
      document.querySelectorAll(".match-option.selected").forEach((button) => button.classList.remove("selected"));
      selectedExpression = null;
      selectedMeaning = null;
    }

    function testMatch() {
      if (!selectedExpression || !selectedMeaning) return;

      const feedback = document.getElementById("match-feedback");
      const expressionKey = selectedExpression.dataset.key;
      const meaningKey = selectedMeaning.dataset.key;

      if (expressionKey === meaningKey) {
        [selectedExpression, selectedMeaning].forEach((button) => {
          button.classList.remove("selected");
          button.classList.add("matched");
          button.disabled = true;
        });
        matchedKeys.add(expressionKey);
        feedback.textContent = "Matched! Keep going.";
        feedback.style.color = "#bce7d0";
        clearSelection();
        updateProgress();
      } else {
        [selectedExpression, selectedMeaning].forEach((button) => button.classList.add("shake"));
        feedback.textContent = "That pair does not match. Try another combination.";
        feedback.style.color = "#ffd2c8";
        setTimeout(() => {
          [selectedExpression, selectedMeaning].forEach((button) => button.classList.remove("shake"));
          clearSelection();
        }, 420);
      }
    }

    function chooseMatch(button) {
      if (button.disabled) return;
      const group = button.dataset.group;

      if (group === "expression") {
        if (selectedExpression) selectedExpression.classList.remove("selected");
        selectedExpression = button;
      } else {
        if (selectedMeaning) selectedMeaning.classList.remove("selected");
        selectedMeaning = button;
      }

      button.classList.add("selected");
      testMatch();
    }

    document.getElementById("check-answers").addEventListener("click", checkWrittenAnswers);

    document.getElementById("show-answers").addEventListener("click", () => {
      document.getElementById("written-cards").classList.add("answers-visible");
    });

    document.querySelectorAll(".match-option").forEach((button) => {
      button.addEventListener("click", () => chooseMatch(button));
    });

    document.getElementById("copy-prompts").addEventListener("click", async () => {
      const prompts = [
        "Tell a partner about a difficult situation you had to get over. What helped you?",
        "Have you ever brought up a sensitive topic at work or with friends? How did the conversation go?",
        "What changes could bring about a better work–life balance in your area?"
      ].join("\n\n");

      const status = document.getElementById("copy-status");
      try {
        await navigator.clipboard.writeText(prompts);
        status.textContent = "Conversation prompts copied.";
      } catch (error) {
        status.textContent = "Select the prompts above to copy them.";
      }
    });

    document.getElementById("restart").addEventListener("click", () => {
      document.querySelectorAll(".answer-input").forEach((input) => {
        input.value = "";
        input.classList.remove("is-correct", "is-wrong");
      });
      document.querySelectorAll('[id^="feedback-"]').forEach((feedback) => feedback.textContent = "");
      document.getElementById("written-cards").classList.remove("answers-visible");
      document.querySelectorAll(".match-option").forEach((button) => {
        button.disabled = false;
        button.classList.remove("selected", "matched", "shake");
      });
      matchedKeys.clear();
      clearSelection();
      document.getElementById("match-feedback").textContent = "";
      document.getElementById("copy-status").textContent = "";
      updateProgress();
    });

    lucide.createIcons();
  </script>
 </body>
</html>
