}

  // Update learn tab
  document.getElementById('learn-heading').innerHTML = t.learnHeading;
  document.getElementById('use-to-heading').textContent = t.useTo;
  document.getElementById('use-for-heading').textContent = t.useFor;
  document.getElementById('tricky-heading').textContent = t.trickyHeading;
  
  for (let i = 1; i <= 5; i++) {
    document.getElementById(`to-rule-${i}`).innerHTML = t[`toRule${i}`];
    document.getElementById(`for-rule-${i}`).innerHTML = t[`forRule${i}`];
  }
  
  document.getElementById('tricky-1-title').textContent = t.tricky1Title;
  document.getElementById('tricky-1-content').innerHTML = t.tricky1Content;
  document.getElementById('tricky-2-title').textContent = t.tricky2Title;
  document.getElementById('tricky-2-content').innerHTML = t.tricky2Content;
  document.getElementById('tricky-3-title').textContent = t.tricky3Title;
  document.getElementById('tricky-3-content').innerHTML = t.tricky3Content;
  
  // Update convo tab
  document.getElementById('convo-heading').textContent = t.convoHeading;
  document.getElementById('convo-subtext').textContent = t.convoSubtext;
  buildConversations();
  
  // Update practice tab
  document.getElementById('practice-heading').textContent = t.practiceHeading;
  document.getElementById('practice-subtext').innerHTML = t.practiceSubtext;
  document.getElementById('reset-btn').textContent = t.resetBtn;
  buildQuiz();
}

const conversationPrompts = [
  { keyPrompt: 'convoPrompt1', keyModel: 'convoModel1' },
  { keyPrompt: 'convoPrompt2', keyModel: 'convoModel2' },
  { keyPrompt: 'convoPrompt3', keyModel: 'convoModel3' },
  { keyPrompt: 'convoPrompt4', keyModel: 'convoModel4' },
  { keyPrompt: 'convoPrompt5', keyModel: 'convoModel5' }
];

const quizQuestions = [
  { before: 'quizItem1', gap: 'quizItem1Gap', after: 'quizItem1After' },
  { before: 'quizItem2', gap: 'quizItem2Gap', after: 'quizItem2After' },
  { before: 'quizItem3', gap: 'quizItem3Gap', after: 'quizItem3After' },
  { before: 'quizItem4', gap: 'quizItem4Gap', after: 'quizItem4After' },
  { before: 'quizItem5', gap: 'quizItem5Gap', after: 'quizItem5After' },
  { before: 'quizItem6', gap: 'quizItem6Gap', after: 'quizItem6After' },
  { before: 'quizItem7', gap: 'quizItem7Gap', after: 'quizItem7After' },
  { before: 'quizItem8', gap: 'quizItem8Gap', after: 'quizItem8After' },
  { before: 'quizItem9', gap: 'quizItem9Gap', after: 'quizItem9After' },
  { before: 'quizItem10', gap: 'quizItem10Gap', after: 'quizItem10After' },
  { before: 'quizItem11', gap: 'quizItem11Gap', after: 'quizItem11After' },
  { before: 'quizItem12', gap: 'quizItem12Gap', after: 'quizItem12After' }
];

let quizState = {};

function switchTab(tab) {
  ['learn','convo','practice'].forEach(t => {
    document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById('tab-' + t);
    btn.className = t === tab ? 'tab-active px-5 py-3 font-body font-600 text-sm tracking-wide uppercase transition-colors' : 'tab-inactive px-5 py-3 font-body font-600 text-sm tracking-wide uppercase transition-colors';
  });
}

function buildConversations() {
  const t = translations[currentLanguage];
  const container = document.getElementById('convo-list');
  container.innerHTML = conversationPrompts.map((c, i) => `
    <div class="rounded-xl overflow-hidden shadow-sm" style="background:#fff;">
      <button onclick="toggleConvo(${i})" class="w-full text-left p-4 flex items-start gap-3 hover:bg-gray-50 transition-colors">
        <span class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold" style="background:#e8efe6;color:#3b6b4f;">${i+1}</span>
        <span class="font-body text-sm" style="color:#2d2d2d;">${t[c.keyPrompt]}</span>
        <i data-lucide="chevron-down" id="chev-${i}" style="width:18px;height:18px;flex-shrink:0;margin-top:2px;color:#aaa;transition:transform 0.2s;"></i>
      </button>
      <div id="convo-answer-${i}" class="hidden px-4 pb-4">
        <div class="ml-11 prompt-bubble p-4 rounded-lg text-sm leading-relaxed" style="background:#e8efe6;color:#2d2d2d;">
          <p class="font-bold text-xs uppercase tracking-wide mb-2" style="color:#3b6b4f;">${t.modelResponse}</p>
          ${t[c.keyModel]}
        </div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

function toggleConvo(i) {
  const el = document.getElementById('convo-answer-' + i);
  const chev = document.getElementById('chev-' + i);
  const isHidden = el.classList.contains('hidden');
  el.classList.toggle('hidden');
  chev.style.transform = isHidden ? 'rotate(180deg)' : '';
}

function buildQuiz() {
  const t = translations[currentLanguage];
  quizState = {};
  const container = document.getElementById('quiz-list');
  container.innerHTML = quizQuestions.map((q, i) => `
    <div id="quiz-row-${i}" class="rounded-xl p-4 shadow-sm flex flex-wrap items-center gap-2 text-sm transition-colors" style="background:#fff;color:#2d2d2d;">
      <span class="font-bold mr-1" style="color:#6b7f74;">${i+1}.</span>
      <span>${t[q.before]}</span>
      <input id="quiz-input-${i}" type="text" maxlength="4" placeholder="___" class="w-16 text-center border-b-2 outline-none font-bold py-1 bg-transparent" style="border-color:#d4cfc5;color:#1a2f23;" onkeydown="if(event.key==='Enter')checkAnswer(${i})" aria-label="Fill in to or for for question ${i+1}">
      <span>${t[q.after]}</span>
      <button onclick="checkAnswer(${i})" class="ml-auto px-3 py-1 rounded-md text-xs font-600 transition-all hover:opacity-80" style="background:#1a2f23;color:#e8d5b0;">${t.check}</button>
      <span id="quiz-fb-${i}" class="text-xs font-bold ml-1"></span>
    </div>
  `).join('');
  updateScore();
}

function checkAnswer(i) {
  const t = translations[currentLanguage];
  const input = document.getElementById('quiz-input-' + i);
  const fb = document.getElementById('quiz-fb-' + i);
  const row = document.getElementById('quiz-row-' + i);
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  const correctAnswer = t[quizQuestions[i].gap];
  const correct = val === correctAnswer;
  quizState[i] = correct;
  fb.textContent = correct ? '✓ ' + (currentLanguage === 'en' ? 'Correct' : 'Correcto') : `✗ "${correctAnswer}"`;
  fb.style.color = correct ? '#16a34a' : '#dc2626';
  input.disabled = true;
  input.value = correctAnswer;
  input.style.borderColor = correct ? '#16a34a' : '#dc2626';
  row.classList.add(correct ? 'correct-flash' : 'incorrect-flash');
  updateScore();
}

function updateScore() {
  const answered = Object.keys(quizState).length;
  const correct = Object.values(quizState).filter(Boolean).length;
  document.getElementById('score-display').textContent = `${correct} / ${quizQuestions.length}`;
}

function resetQuiz() {
  buildQuiz();
}

// Init
updateUI();

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const c = { ...defaultConfig, ...config };
    const font = c.font_family || defaultConfig.font_family;
    const baseSize = c.font_size || defaultConfig.font_size;
    
    document.getElementById('main-title').style.fontFamily = `${font}, Georgia, serif`;
    document.getElementById('main-title').style.fontSize = `${baseSize * 2}px`;
    document.getElementById('subtitle').style.fontSize = `${baseSize * 1.1}px`;
    document.getElementById('app').style.backgroundColor = c.bg_color;
  },
  mapToCapabilities: (config) => {
    const c = { ...defaultConfig, ...config };
    return {
      recolorables: [
        { get: () => c.bg_color || defaultConfig.bg_color, set: (v) => { c.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
        { get: () => c.header_color || defaultConfig.header_color, set: (v) => { c.header_color = v; window.elementSdk.setConfig({ header_color: v }); } },
        { get: () => c.text_color || defaultConfig.text_color, set: (v) => { c.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
        { get: () => c.accent_color || defaultConfig.accent_color, set: (v) => { c.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
        { get: () => c.gold_color || defaultConfig.gold_color, set: (v) => { c.gold_color = v; window.elementSdk.setConfig({ gold_color: v }); } }
      ],
      borderables: [],
      fontEditable: {
        get: () => c.font_family || defaultConfig.font_family,
        set: (v) => { c.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
      },
      fontSizeable: {
        get: () => c.font_size || defaultConfig.font_size,
        set: (v) => { c.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
      }
    };
  },
  mapToEditPanelValues: (config) => {
    const c = { ...defaultConfig, ...config };
    return new Map([
      ["main_title", c.main_title],
      ["subtitle", c.subtitle]
    ]);
  }
});

lucide.createIcons();
