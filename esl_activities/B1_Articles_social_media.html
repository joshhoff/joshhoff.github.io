<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Galaxy: Social Media Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f9;
        }
        .social-card {
            transition: transform 0.3s ease;
        }
        .social-card:hover {
            transform: translateY(-5px);
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(.selected) {
            transform: scale(1.05);
        }
        .option-btn.selected {
            transform: scale(1.05);
        }
        .option-btn.correct {
            background-color: #4ade80;
            color: white;
        }
        .option-btn.incorrect {
            background-color: #f87171;
            color: white;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall 3s ease-in infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        @media (min-width: 1024px) {
            .smartboard-mode {
                font-size: 1.2rem;
            }
            .smartboard-mode .text-sm {
                font-size: 1rem;
            }
            .smartboard-mode .text-lg {
                font-size: 1.5rem;
            }
            .smartboard-mode .text-xl {
                font-size: 1.75rem;
            }
            .smartboard-mode .text-2xl {
                font-size: 2rem;
            }
        }
    </style>

<body class="min-h-screen" data-new-gr-c-s-check-loaded="8.931.0" data-gr-ext-installed="">
    <div id="app" class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700 mb-2">Grammar Galaxy</h1>
            <p class="text-lg text-gray-600">Practice articles and prepositions with fun social media posts!</p>
            
            <div class="flex flex-wrap justify-center gap-3 mt-4">
                <button id="articleBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition">Articles</button>
                <button id="prepositionBtn" class="px-4 py-2 bg-indigo-100 text-indigo-700 rounded-full hover:bg-indigo-200 transition">Prepositions</button>
                <button id="smartboardMode" class="px-4 py-2 bg-amber-500 text-white rounded-full hover:bg-amber-600 transition ml-2">
                    <span id="smartboardModeText">Smartboard Mode: Off</span>
                </button>
            </div>
        </header>

        <div class="flex flex-col items-center">
            <div class="stats-bar w-full max-w-md flex justify-between items-center mb-6 bg-white rounded-full px-6 py-3 shadow-md">
                <div>
                    <span class="font-semibold text-indigo-700">Score:</span>
                    <span id="score" class="text-indigo-700">0</span>
                </div>
                <div>
                    <span class="font-semibold text-indigo-700">Streak:</span>
                    <span id="streak" class="text-indigo-700">0</span>
                </div>
                <div>
                    <span class="font-semibold text-indigo-700">Question:</span>
                    <span id="questionNumber" class="text-indigo-700">1</span>/<span id="totalQuestions" class="text-indigo-700">10</span>
                </div>
            </div>

            <div id="socialPost" class="social-card w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden mb-6">
                <div class="p-4 border-b border-gray-200">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-indigo-600 flex items-center justify-center text-white text-xl font-bold">G</div>
                        <div class="ml-3">
                            <p class="font-semibold">GrammarGalaxy</p>
                            <p class="text-gray-500 text-sm">@grammargalaxy</p>
                        </div>
                    </div>
                </div>
                
                <div id="postContent" class="p-4"><p class="text-lg mb-4">I saw <span class="blank-0 px-1 py-0.5 bg-yellow-200 rounded">____</span> amazing sunset at <span class="blank-1 px-1 py-0.5 bg-yellow-200 rounded">____</span> beach yesterday.</p></div>
                
                <div id="postImage" class="w-full h-64 bg-gray-200 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" class="w-full h-full">

            </svg></div>

                            </svg>

                            </svg>
                            <span>7</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="options" class="w-full max-w-md grid grid-cols-2 gap-3 mb-6"><div class="mb-4 w-full">
                    <p class="text-sm font-medium text-gray-700 mb-2">Blank 1:</p>
                    <div class="grid grid-cols-2 gap-2 blank-options" data-blank="0"><button class="option-btn px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50" data-value="a" data-blank="0">a</button><button class="option-btn px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50" data-value="an" data-blank="0">an</button><button class="option-btn px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50" data-value="the" data-blank="0">the</button><button class="option-btn px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50" data-value="" data-blank="0">(none)</button></div>

                    <p class="text-sm font-medium text-gray-700 mb-2">Blank 2:</p>

            <button id="nextBtn" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition hidden">
                Next Question
            </button>
        </div>
    </div>

    <div id="confettiContainer" class="fixed inset-0 pointer-events-none z-50"></div>

        // DOM elements
        const elements = {
            app: document.getElementById('app'),
            articleBtn: document.getElementById('articleBtn'),
            prepositionBtn: document.getElementById('prepositionBtn'),
            smartboardMode: document.getElementById('smartboardMode'),
            smartboardModeText: document.getElementById('smartboardModeText'),
            score: document.getElementById('score'),
            streak: document.getElementById('streak'),
            questionNumber: document.getElementById('questionNumber'),
            totalQuestions: document.getElementById('totalQuestions'),
            postContent: document.getElementById('postContent'),
            postImage: document.getElementById('postImage'),
            options: document.getElementById('options'),
            feedback: document.getElementById('feedback'),
            nextBtn: document.getElementById('nextBtn'),
            confettiContainer: document.getElementById('confettiContainer')
        };

        // Initialize the game
        function initGame() {
            // Set up event listeners
            elements.articleBtn.addEventListener('click', () => switchMode('articles'));
            elements.prepositionBtn.addEventListener('click', () => switchMode('prepositions'));
            elements.smartboardMode.addEventListener('click', toggleSmartboardMode);
            elements.nextBtn.addEventListener('click', nextQuestion);

            // Set initial values
            elements.totalQuestions.textContent = state.totalQuestions;
            
            // Start the game
            loadQuestion();
        }

        // Switch between articles and prepositions mode
        function switchMode(mode) {
            state.mode = mode;
            state.currentQuestion = 0;
            state.score = 0;
            state.streak = 0;
            
            // Update UI
            elements.score.textContent = state.score;
            elements.streak.textContent = state.streak;
            elements.questionNumber.textContent = 1;
            
            if (mode === 'articles') {
                elements.articleBtn.classList.remove('bg-indigo-100', 'text-indigo-700');
                elements.articleBtn.classList.add('bg-indigo-600', 'text-white');
                elements.prepositionBtn.classList.remove('bg-indigo-600', 'text-white');
                elements.prepositionBtn.classList.add('bg-indigo-100', 'text-indigo-700');
            } else {
                elements.prepositionBtn.classList.remove('bg-indigo-100', 'text-indigo-700');
                elements.prepositionBtn.classList.add('bg-indigo-600', 'text-white');
                elements.articleBtn.classList.remove('bg-indigo-600', 'text-white');
                elements.articleBtn.classList.add('bg-indigo-100', 'text-indigo-700');
            }
            
            loadQuestion();
        }

        // Toggle smartboard mode
        function toggleSmartboardMode() {
            state.smartboardMode = !state.smartboardMode;
            elements.smartboardModeText.textContent = `Smartboard Mode: ${state.smartboardMode ? 'On' : 'Off'}`;
            
            if (state.smartboardMode) {
                document.body.classList.add('smartboard-mode');
            } else {
                document.body.classList.remove('smartboard-mode');
            }
        }

        // Load a question
        function loadQuestion() {
            // Hide feedback and next button
            elements.feedback.classList.add('hidden');
            elements.nextBtn.classList.add('hidden');
            
            // Get the current question
            const questions = state.questions[state.mode];
            const question = questions[state.currentQuestion];
            
            // Update question number
            elements.questionNumber.textContent = state.currentQuestion + 1;
            
            // Create the post content with blanks
            let text = question.text;
            const blanks = question.blanks;
            let blankIndex = 0;
            
            text = text.replace(/__+/g, () => {
                return `<span class="blank-${blankIndex++} px-1 py-0.5 bg-yellow-200 rounded">____</span>`;
            });
            
            elements.postContent.innerHTML = `<p class="text-lg mb-4">${text}</p>`;
            
            // Set the post image
            elements.postImage.innerHTML = svgImages[question.image] || '';
            
            // Create the options
            elements.options.innerHTML = '';
            
            // For each blank, create a set of options
            for (let i = 0; i < blanks.length; i++) {
                const optionContainer = document.createElement('div');
                optionContainer.className = 'mb-4 w-full';
                optionContainer.innerHTML = `
                    <p class="text-sm font-medium text-gray-700 mb-2">Blank ${i + 1}:</p>
                    <div class="grid grid-cols-2 gap-2 blank-options" data-blank="${i}"></div>
                `;
                
                const optionsGrid = optionContainer.querySelector('.blank-options');
                
                // Add options for this blank
                question.options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'option-btn px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50';
                    button.textContent = option || '(none)';
                    button.dataset.value = option;
                    button.dataset.blank = i;
                    button.addEventListener('click', () => selectOption(button, i, option, blanks[i]));
                    optionsGrid.appendChild(button);
                });
                
                elements.options.appendChild(optionContainer);
            }
        }

        // Handle option selection
        function selectOption(button, blankIndex, selectedOption, correctOption) {
            // Get all options for this blank
            const blankOptions = document.querySelectorAll(`.blank-options[data-blank="${blankIndex}"] .option-btn`);
            
            // Remove selected class from all options
            blankOptions.forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            
            // Add selected class to the clicked option
            button.classList.add('selected');
            
            // Check if the answer is correct
            const isCorrect = selectedOption === correctOption;
            
            if (isCorrect) {
                button.classList.add('correct');
                
                // Update the blank in the post
                const blank = document.querySelector(`.blank-${blankIndex}`);
                blank.textContent = selectedOption || '(none)';
                blank.classList.add('bg-green-200');
                blank.classList.remove('bg-yellow-200');
                
                // Check if all blanks are filled correctly
                const allBlanks = document.querySelectorAll('[class^="blank-"]');
                const allFilled = Array.from(allBlanks).every(blank => blank.classList.contains('bg-green-200'));
                
                if (allFilled) {
                    // Show success feedback
                    showFeedback(true);
                    
                    // Update score and streak
                    state.score++;
                    state.streak++;
                    elements.score.textContent = state.score;
                    elements.streak.textContent = state.streak;
                    
                    // Show confetti
                    createConfetti();
                }
            } else {
                button.classList.add('incorrect');
                
                // Reset streak
                state.streak = 0;
                elements.streak.textContent = state.streak;
                
                // Show error feedback
                showFeedback(false, correctOption);
            }
        }

        // Show feedback
        function showFeedback(isCorrect, correctOption = null) {
            elements.feedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (isCorrect) {
                elements.feedback.classList.add('bg-green-100', 'text-green-800');
                elements.feedback.innerHTML = `
                    <p class="font-medium">Great job! 🎉</p>
                    <p>That's correct!</p>
                `;
                
                // Show next button
                elements.nextBtn.classList.remove('hidden');
            } else {
                elements.feedback.classList.add('bg-red-100', 'text-red-800');
                elements.feedback.innerHTML = `
                    <p class="font-medium">Not quite right.</p>
                    <p>The correct answer is: "${correctOption || '(none)'}"</p>
                `;
            }
            
            elements.feedback.classList.remove('hidden');
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 10 + 5}px`;
                confetti.style.animationDuration = `${Math.random() * 2 + 2}s`;
                confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                
                elements.confettiContainer.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // Move to the next question
        function nextQuestion() {
            state.currentQuestion++;
            
            // Check if we've reached the end of the questions
            if (state.currentQuestion >= state.totalQuestions) {
                // Show end of game
                showEndOfGame();
            } else {
                // Load the next question
                loadQuestion();
            }
        }

        // Show end of game
        function showEndOfGame() {
            elements.postContent.innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-2xl font-bold text-indigo-700 mb-4">Great job!</h2>
                    <p class="text-lg mb-4">You scored ${state.score} out of ${state.totalQuestions}!</p>
                    <button id="playAgainBtn" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        Play Again
                    </button>
                </div>
            `;
            
            elements.postImage.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" class="w-full h-full">
                    <rect width="800" height="600" fill="#F5F5F5" />
                    <circle cx="400" cy="300" r="200" fill="#FFD700" />
                    <circle cx="320" cy="230" r="30" fill="#FFF" />
                    <circle cx="480" cy="230" r="30" fill="#FFF" />
                    <circle cx="320" cy="230" r="15" fill="#000" />
                    <circle cx="480" cy="230" r="15" fill="#000" />
                    <path d="M320,350 Q400,420 480,350" stroke="#000" stroke-width="15" fill="none" />
                </svg>
            `;
            
            elements.options.innerHTML = '';
            elements.feedback.classList.add('hidden');
            elements.nextBtn.classList.add('hidden');
            
            // Add event listener to play again button
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                state.currentQuestion = 0;
                state.score = 0;
                state.streak = 0;
                elements.score.textContent = state.score;
                elements.streak.textContent = state.streak;
                elements.questionNumber.textContent = 1;
                loadQuestion();
            });
        }

        // Initialize the game
        initGame();
    </script>
