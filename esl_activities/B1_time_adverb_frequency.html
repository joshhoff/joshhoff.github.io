<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Adverbs Learning App</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .language-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .language-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .header p {
            margin: 10px 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #4facfe;
            font-size: 1.8rem;
            margin-bottom: 20px;
            border-bottom: 3px solid #4facfe;
            padding-bottom: 10px;
        }
        
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .vocab-card {
            background: #f8f9ff;
            border: 2px solid #e1e8ff;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.2);
            border-color: #4facfe;
        }
        
        .vocab-term {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4facfe;
            margin-bottom: 8px;
        }
        
        .vocab-meaning {
            font-size: 1rem;
            color: #666;
            margin-bottom: 10px;
        }
        
        .vocab-example {
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }
        
        .activity-section {
            background: #f0f4ff;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }
        
        .question {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .day-header {
            background: #4facfe;
            color: white;
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .day-cell {
            background: #f8f9ff;
            border: 2px solid #e1e8ff;
            padding: 15px 8px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .day-cell:hover {
            background: #e8f0ff;
            border-color: #4facfe;
        }
        
        .day-cell.selected {
            background: #4facfe;
            color: white;
            border-color: #4facfe;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #4facfe;
            color: white;
        }
        
        .btn-primary:hover {
            background: #3d8bfe;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f1f3f4;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e8eaed;
        }
        
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
        }
        
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 20px;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .vocab-grid {
                grid-template-columns: 1fr;
            }
            
            .calendar {
                gap: 5px;
            }
            
            .day-header, .day-cell {
                padding: 10px 4px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <button class="language-toggle" onclick="toggleLanguage()">
                <span id="lang-toggle-text">🇪🇸 Español</span>
            </button>
            <h1 id="main-title">📅 Frequency Adverbs Master</h1>
            <p id="main-subtitle">Learn how often things happen and test your understanding!</p>
        </header>
        
        <div class="content">
            <section class="section">
                <h2 id="vocab-title">📚 Vocabulary Guide</h2>
                <div class="vocab-grid" id="vocab-grid">
                    <!-- Vocabulary cards will be generated by JavaScript -->
                </div>
            </section>
            
            <section class="activity-section">
                <h2 id="activity-title">🎯 Comprehension Test</h2>
                <p id="activity-instructions" style="font-size: 1.1rem; margin-bottom: 25px; color: #666;">
                    Read each sentence and click on the days of the week when the activity happens. 
                    Click the days that match the frequency adverb!
                </p>
                
                <div id="questions-container">
                    <!-- Questions will be generated here -->
                </div>
                
                <div class="buttons">
                    <button class="btn btn-secondary" onclick="resetQuiz()">
                        <span id="reset-btn">🔄 Start Over</span>
                    </button>
                    <button class="btn btn-primary" onclick="checkAllAnswers()">
                        <span id="check-btn">✅ Check My Answers</span>
                    </button>
                </div>
                
                <div id="final-score" class="score hidden">
                    <div id="score-text"></div>
                </div>
            </section>
        </div>
    </main>

    <script>
        let currentLanguage = 'en';
        
        const translations = {
            en: {
                title: "📅 Frequency Adverbs Master",
                subtitle: "Learn how often things happen and test your understanding!",
                langToggle: "🇪🇸 Español",
                vocabTitle: "📚 Vocabulary Guide",
                activityTitle: "🎯 Comprehension Test",
                activityInstructions: "Read each sentence and click on the days of the week when the activity happens. Click the days that match the frequency adverb!",
                resetBtn: "🔄 Start Over",
                checkBtn: "✅ Check My Answers",
                selectDays: "Select the days when this activity happens:",
                correct: "✅ Correct!",
                incorrect: "❌ Not quite.",
                shouldBe: "should be:",
                noDays: "No days",
                matches: "matches your selection.",
                scoreMessages: {
                    excellent: "🎉 Excellent! You're a frequency adverbs expert!",
                    great: "👏 Great job! You understand frequency adverbs well!",
                    good: "👍 Good effort! Review the vocabulary and try again!",
                    practice: "💪 Keep practicing! Review the examples above!"
                },
                score: "Score:",
                dayNames: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
            },
            es: {
                title: "📅 Maestro de Adverbios de Frecuencia",
                subtitle: "¡Aprende qué tan seguido pasan las cosas y pon a prueba tu comprensión!",
                langToggle: "🇺🇸 English",
                vocabTitle: "📚 Guía de Vocabulario",
                activityTitle: "🎯 Prueba de Comprensión",
                activityInstructions: "Lee cada oración y haz clic en los días de la semana cuando ocurre la actividad. ¡Haz clic en los días que coincidan con el adverbio de frecuencia!",
                resetBtn: "🔄 Empezar de Nuevo",
                checkBtn: "✅ Revisar Mis Respuestas",
                selectDays: "Selecciona los días cuando ocurre esta actividad:",
                correct: "✅ ¡Correcto!",
                incorrect: "❌ No del todo.",
                shouldBe: "debería ser:",
                noDays: "Ningún día",
                matches: "coincide con tu selección.",
                scoreMessages: {
                    excellent: "🎉 ¡Excelente! ¡Eres un experto en adverbios de frecuencia!",
                    great: "👏 ¡Buen trabajo! ¡Entiendes bien los adverbios de frecuencia!",
                    good: "👍 ¡Buen esfuerzo! ¡Repasa el vocabulario e inténtalo de nuevo!",
                    practice: "💪 ¡Sigue practicando! ¡Repasa los ejemplos de arriba!"
                },
                score: "Puntuación:",
                dayNames: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom']
            }
        };

        const vocabulary = {
            en: [
                {
                    term: "Every day",
                    meaning: "All 7 days of the week",
                    example: "\"I brush my teeth every day\""
                },
                {
                    term: "Often",
                    meaning: "Many times (5-6 days per week)",
                    example: "\"I often eat breakfast at home\""
                },
                {
                    term: "Sometimes",
                    meaning: "A few times (2-4 days per week)",
                    example: "\"I sometimes go to the gym\""
                },
                {
                    term: "Rarely",
                    meaning: "Very few times (1-2 days per week)",
                    example: "\"I rarely eat fast food\""
                },
                {
                    term: "Never",
                    meaning: "0 days - not at all",
                    example: "\"I never smoke cigarettes\""
                },
                {
                    term: "Once a week",
                    meaning: "Exactly 1 day per week",
                    example: "\"I go shopping once a week\""
                },
                {
                    term: "Twice a week",
                    meaning: "Exactly 2 days per week",
                    example: "\"I play tennis twice a week\""
                },
                {
                    term: "On weekends",
                    meaning: "Saturday and Sunday only",
                    example: "\"I sleep late on weekends\""
                }
            ],
            es: [
                {
                    term: "Todos los días",
                    meaning: "Los 7 días de la semana",
                    example: "\"Me lavo los dientes todos los días\""
                },
                {
                    term: "A menudo",
                    meaning: "Muchas veces (5-6 días por semana)",
                    example: "\"A menudo desayuno en casa\""
                },
                {
                    term: "A veces",
                    meaning: "Algunas veces (2-4 días por semana)",
                    example: "\"A veces voy al gimnasio\""
                },
                {
                    term: "Rara vez",
                    meaning: "Muy pocas veces (1-2 días por semana)",
                    example: "\"Rara vez como comida rápida\""
                },
                {
                    term: "Nunca",
                    meaning: "0 días - para nada",
                    example: "\"Nunca fumo cigarrillos\""
                },
                {
                    term: "Una vez por semana",
                    meaning: "Exactamente 1 día por semana",
                    example: "\"Voy de compras una vez por semana\""
                },
                {
                    term: "Dos veces por semana",
                    meaning: "Exactamente 2 días por semana",
                    example: "\"Juego tenis dos veces por semana\""
                },
                {
                    term: "Los fines de semana",
                    meaning: "Solo sábado y domingo",
                    example: "\"Duermo hasta tarde los fines de semana\""
                }
            ]
        };

        const questions = {
            en: [
                {
                    text: "Sarah exercises every day.",
                    frequency: "every day",
                    correctDays: [0, 1, 2, 3, 4, 5, 6]
                },
                {
                    text: "Mike goes to the movies once a week.",
                    frequency: "once a week",
                    correctDays: [5]
                },
                {
                    text: "Lisa studies French twice a week.",
                    frequency: "twice a week",
                    correctDays: [1, 4]
                },
                {
                    text: "Tom sleeps late on weekends.",
                    frequency: "on weekends",
                    correctDays: [5, 6]
                },
                {
                    text: "Anna often reads books before bed.",
                    frequency: "often",
                    correctDays: [0, 1, 2, 3, 4]
                },
                {
                    text: "David sometimes eats pizza for dinner.",
                    frequency: "sometimes",
                    correctDays: [2, 4, 6]
                },
                {
                    text: "Emma rarely drinks coffee.",
                    frequency: "rarely",
                    correctDays: [3]
                },
                {
                    text: "John never eats meat.",
                    frequency: "never",
                    correctDays: []
                }
            ],
            es: [
                {
                    text: "Sara hace ejercicio todos los días.",
                    frequency: "todos los días",
                    correctDays: [0, 1, 2, 3, 4, 5, 6]
                },
                {
                    text: "Miguel va al cine una vez por semana.",
                    frequency: "una vez por semana",
                    correctDays: [5]
                },
                {
                    text: "Lisa estudia francés dos veces por semana.",
                    frequency: "dos veces por semana",
                    correctDays: [1, 4]
                },
                {
                    text: "Tomás duerme hasta tarde los fines de semana.",
                    frequency: "los fines de semana",
                    correctDays: [5, 6]
                },
                {
                    text: "Ana a menudo lee libros antes de dormir.",
                    frequency: "a menudo",
                    correctDays: [0, 1, 2, 3, 4]
                },
                {
                    text: "David a veces come pizza para cenar.",
                    frequency: "a veces",
                    correctDays: [2, 4, 6]
                },
                {
                    text: "Emma rara vez toma café.",
                    frequency: "rara vez",
                    correctDays: [3]
                },
                {
                    text: "Juan nunca come carne.",
                    frequency: "nunca",
                    correctDays: []
                }
            ]
        };

        let userAnswers = [];

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'es' : 'en';
            updateLanguage();
            initializeQuiz();
        }

        function updateLanguage() {
            const t = translations[currentLanguage];
            
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('main-subtitle').textContent = t.subtitle;
            document.getElementById('lang-toggle-text').textContent = t.langToggle;
            document.getElementById('vocab-title').textContent = t.vocabTitle;
            document.getElementById('activity-title').textContent = t.activityTitle;
            document.getElementById('activity-instructions').textContent = t.activityInstructions;
            document.getElementById('reset-btn').textContent = t.resetBtn;
            document.getElementById('check-btn').textContent = t.checkBtn;
            
            updateVocabulary();
        }

        function updateVocabulary() {
            const vocabGrid = document.getElementById('vocab-grid');
            const vocabData = vocabulary[currentLanguage];
            
            vocabGrid.innerHTML = vocabData.map(item => `
                <div class="vocab-card">
                    <div class="vocab-term">${item.term}</div>
                    <div class="vocab-meaning">${item.meaning}</div>
                    <div class="vocab-example">${item.example}</div>
                </div>
            `).join('');
        }

        function initializeQuiz() {
            const container = document.getElementById('questions-container');
            const currentQuestions = questions[currentLanguage];
            const t = translations[currentLanguage];
            
            container.innerHTML = '';
            userAnswers = [];
            
            currentQuestions.forEach((question, index) => {
                userAnswers[index] = [];
                
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-text">
                        ${index + 1}. ${question.text}
                        <br><small style="color: #666; font-weight: normal;">${t.selectDays}</small>
                    </div>
                    <div class="calendar">
                        ${t.dayNames.map(day => `<div class="day-header">${day}</div>`).join('')}
                        ${t.dayNames.map((day, dayIndex) => 
                            `<div class="day-cell" onclick="toggleDay(${index}, ${dayIndex})" data-question="${index}" data-day="${dayIndex}">
                                ${dayIndex + 1}
                            </div>`
                        ).join('')}
                    </div>
                    <div id="feedback-${index}" class="feedback hidden"></div>
                `;
                
                container.appendChild(questionDiv);
            });
        }

        function toggleDay(questionIndex, dayIndex) {
            const cell = document.querySelector(`[data-question="${questionIndex}"][data-day="${dayIndex}"]`);
            
            if (userAnswers[questionIndex].includes(dayIndex)) {
                userAnswers[questionIndex] = userAnswers[questionIndex].filter(d => d !== dayIndex);
                cell.classList.remove('selected');
            } else {
                userAnswers[questionIndex].push(dayIndex);
                cell.classList.add('selected');
            }
        }

        function checkAllAnswers() {
            let correctCount = 0;
            const currentQuestions = questions[currentLanguage];
            const t = translations[currentLanguage];
            
            currentQuestions.forEach((question, index) => {
                const feedbackDiv = document.getElementById(`feedback-${index}`);
                const userDays = userAnswers[index].sort();
                const correctDays = question.correctDays.sort();
                
                const isCorrect = JSON.stringify(userDays) === JSON.stringify(correctDays);
                
                if (isCorrect) {
                    correctCount++;
                    feedbackDiv.className = 'feedback correct';
                    feedbackDiv.textContent = `${t.correct} "${question.frequency}" ${t.matches}`;
                } else {
                    feedbackDiv.className = 'feedback incorrect';
                    const correctDayNames = correctDays.map(d => t.dayNames[d]).join(', ') || t.noDays;
                    feedbackDiv.textContent = `${t.incorrect} "${question.frequency}" ${t.shouldBe} ${correctDayNames}`;
                }
                
                feedbackDiv.classList.remove('hidden');
            });
            
            const scoreDiv = document.getElementById('final-score');
            const scoreText = document.getElementById('score-text');
            const percentage = Math.round((correctCount / currentQuestions.length) * 100);
            
            let message = '';
            if (percentage >= 90) {
                message = t.scoreMessages.excellent;
            } else if (percentage >= 70) {
                message = t.scoreMessages.great;
            } else if (percentage >= 50) {
                message = t.scoreMessages.good;
            } else {
                message = t.scoreMessages.practice;
            }
            
            scoreText.innerHTML = `
                <div style="font-size: 1.4rem; margin-bottom: 10px;">${message}</div>
                <div>${t.score} ${correctCount}/${currentQuestions.length} (${percentage}%)</div>
            `;
            
            scoreDiv.classList.remove('hidden');
            scoreDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetQuiz() {
            document.querySelectorAll('.day-cell').forEach(cell => {
                cell.classList.remove('selected');
            });
            
            document.querySelectorAll('.feedback').forEach(feedback => {
                feedback.classList.add('hidden');
            });
            
            document.getElementById('final-score').classList.add('hidden');
            
            userAnswers = questions[currentLanguage].map(() => []);
            
            document.querySelector('.activity-section').scrollIntoView({ behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateLanguage();
            initializeQuiz();
        });
    </script>
