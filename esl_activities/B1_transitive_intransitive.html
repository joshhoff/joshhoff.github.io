html, body { height: 100%; margin: 0; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 12px 24px; border-radius: 12px; font-weight: 600; animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(16px); } }
</style>

 </head>

const content = {

        examples: [
          { sentence: 'She <u>reads</u> <strong>a book</strong>.', note: '"a book" is the object — what she reads' },
          { sentence: 'They <u>bought</u> <strong>a new car</strong>.', note: '"a new car" receives the action' },
          { sentence: 'He <u>sent</u> <strong>the email</strong>.', note: '"the email" is what he sent' }

      intransitive: {
        title: '🔄 Intransitive Verbs',

        explanation: 'An <strong>intransitive verb</strong> expresses a complete action by itself. You do NOT need an object after it.',
        examples: [
          { sentence: 'The baby <u>laughed</u>.', note: 'Complete! No object needed.' },
          { sentence: 'She <u>arrived</u> early.', note: '"early" is an adverb, not an object.' },

        { verb: 'sing', t: 'She <u>sang</u> <strong>a beautiful song</strong>.', i: 'She <u>sang</u> beautifully.', explain: '"Sing" works both ways. The adverb "beautifully" is NOT an object.' },

        sentences: [
          { s: 'The teacher explained _____.', hint: 'What did the teacher explain?', sample: 'the lesson / the rules / the problem' },

          { t: 'He <u>runs</u> <strong>a company</strong>.', i: 'He <u>runs</u> every day.' },

        ]

    },
    examples: {
      title: 'Más Ejemplos en Contexto',

        { verb: 'sing', t: 'She <u>sang</u> <strong>a beautiful song</strong>.', i: 'She <u>sang</u> beautifully.', explain: '"Sing" funciona de ambas formas. El adverbio "beautifully" NO es un objeto.' },
        { verb: 'grow', t: 'They <u>grow</u> <strong>tomatoes</strong>.', i: 'The children <u>grew</u> quickly.', explain: 'Transitivo: cultivan algo. Intransitivo: algo crece por sí solo.' },

        { verb: 'study', t: 'I <u>study</u> <strong>English</strong> every day.', i: 'I <u>study</u> at the library.', explain: 'Con "English" = transitivo. Con "at the library" (lugar, no objeto) = intransitivo.' },

          { v: 'move', tHint: 'move + objeto (¿qué?)', iHint: 'move + sin objeto', tEx: 'We moved the furniture.', iEx: 'The clouds moved slowly.' },

        { topic: '🎬 Entretenimiento', questions: ['What kind of movies do you watch?', 'Do you sing or play an instrument?', 'How often do you go out with friends?'], tip: '"Watch movies" (T) vs. "go out" (I)' },
        { topic: '🏠 Hogar y Familia', questions: ['Who cooks in your family? What do they cook?', 'Do you have pets? What do they do all day?', 'What did you buy last weekend?'], tip: '"Cook dinner" (T) vs. "The dog sleeps" (I)' },

// ---- Activity State ----
const quizAnswers = {};
const revealedHints = {};
const revealedExamples = {};
const writingInputs = {};
const writingInputs3 = {};
const expandedCards = {};

function toggleLang() {
  lang = lang === 'en' ? 'es' : 'en';
  document.getElementById('langLabel').textContent = lang === 'en' ? 'ES' : 'EN';
  renderTabs();
  renderContent();
}

function renderTabs() {
  const c = content[lang];
  const nav = document.getElementById('tabNav');
  nav.innerHTML = '';
  c.tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = `px-4 py-3 font-semibold text-sm whitespace-nowrap transition ${i === currentTab ? 'tab-active' : 'tab-inactive'}`;
    btn.textContent = t;
    btn.onclick = () => { currentTab = i; renderTabs(); renderContent(); };
    nav.appendChild(btn);
  });
}

function renderContent() {
  const c = content[lang];
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.className = 'max-w-3xl mx-auto px-4 py-6 fade-in';
  if (currentTab === 0) renderLearn(main, c);
  else if (currentTab === 1) renderExamples(main, c);
  else if (currentTab === 2) renderPractice(main, c);
  else renderConversation(main, c);
}

function renderLearn(main, c) {
  const d = c.learn;
  main.innerHTML = `
    <h2 class="font-heading text-2xl font-bold mb-6" style="color:var(--c-primary);">${d.title}</h2>
    ${renderVerbSection(d.transitive, 'var(--c-primary)')}
    ${renderVerbSection(d.intransitive, 'var(--c-secondary)')}
    <div class="rounded-2xl p-5 mb-6 border" style="background:var(--c-surface);border-color:rgba(0,0,0,0.06);">
      <h3 class="font-heading text-lg font-bold mb-2">${d.both.title}</h3>
      <p class="mb-4 text-sm leading-relaxed">${d.both.explanation}</p>
      <div class="space-y-3">
        ${d.both.examples.map(e => `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div class="rounded-xl p-3 text-sm" style="background:color-mix(in srgb, var(--c-primary) 8%, transparent);"><span class="font-semibold" style="color:var(--c-primary);">T:</span> ${e.t}</div>
            <div class="rounded-xl p-3 text-sm" style="background:color-mix(in srgb, var(--c-secondary) 8%, transparent);"><span class="font-semibold" style="color:var(--c-secondary);">I:</span> ${e.i}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderVerbSection(data, color) {
  return `
    <div class="rounded-2xl p-5 mb-6 border" style="background:var(--c-surface);border-color:rgba(0,0,0,0.06);">
      <h3 class="font-heading text-lg font-bold mb-1">${data.title}</h3>
      <p class="text-xs font-semibold mb-3 opacity-60">${data.subtitle}</p>
      <p class="text-sm leading-relaxed mb-4">${data.explanation}</p>
      <div class="space-y-2 mb-4">
        ${data.examples.map(e => `
          <div class="rounded-xl p-3" style="background:color-mix(in srgb, ${color} 6%, transparent);">
            <p class="text-sm font-medium mb-1">${e.sentence}</p>
            <p class="text-xs opacity-70">${e.note}</p>
          </div>
        `).join('')}
      </div>
      <div class="rounded-xl p-3 text-sm font-medium" style="background:color-mix(in srgb, ${color} 12%, transparent);color:${color};">${data.test}</div>
    </div>
  `;
}

function renderExamples(main, c) {
  const d = c.examples;
  main.innerHTML = `
    <h2 class="font-heading text-2xl font-bold mb-2" style="color:var(--c-primary);">${d.title}</h2>
    <p class="text-sm opacity-70 mb-6">${d.subtitle}</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      ${d.items.map((item, i) => `
        <div class="rounded-2xl border card-hover cursor-pointer overflow-hidden" style="background:var(--c-surface);border-color:rgba(0,0,0,0.06);" onclick="toggleCard(${i})">
          <div class="p-4">
            <div class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-3" style="background:var(--c-primary);color:var(--c-surface);">${item.verb}</div>
            <div class="space-y-2 mb-2">
              <p class="text-sm"><span class="font-bold" style="color:var(--c-primary);">T:</span> ${item.t}</p>
              <p class="text-sm"><span class="font-bold" style="color:var(--c-secondary);">I:</span> ${item.i}</p>
            </div>
          </div>
          <div id="card-${i}" class="px-4 pb-4 ${expandedCards[i] ? '' : 'hidden'}">
            <div class="rounded-xl p-3 text-xs leading-relaxed" style="background:color-mix(in srgb, var(--c-primary) 8%, transparent);">${item.explain}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function toggleCard(i) {
  expandedCards[i] = !expandedCards[i];
  const el = document.getElementById('card-' + i);
  if (el) el.classList.toggle('hidden');
}

function renderPractice(main, c) {
  const d = c.practice;
  main.innerHTML = `
    <h2 class="font-heading text-2xl font-bold mb-6" style="color:var(--c-primary);">${d.title}</h2>
    ${renderActivity1(d.activity1)}
    ${renderActivity2(d.activity2)}
    ${renderActivity3(d.activity3)}
  `;
}

function renderActivity1(a) {
  return `
    <div class="rounded-2xl border p-5 mb-6" style="background:var(--c-surface);border-color:rgba(0,0,0,0.06);">
      <h3 class="font-heading text-lg font-bold mb-1">${a.title}</h3>
      <p class="text-sm opacity-70 mb-4">${a.instruction}</p>
      <div class="space-y-4">
        ${a.questions.map((q, i) => {
          const answered = quizAnswers[i];
          const isCorrect = answered === q.a;
          return `
            <div class="rounded-xl p-4" style="background:color-mix(in srgb, var(--c-bg) 60%, transparent);">
              <p class="text-sm mb-3">${q.q}</p>
              <div class="flex gap-2">
                <button onclick="answerQuiz(${i},'T','${q.a}')" class="px-4 py-1.5 rounded-full text-sm font-bold transition" style="background:${answered === 'T' ? (isCorrect ? 'var(--c-primary)' : '#ef4444') : 'rgba(0,0,0,0.06)'};color:${answered === 'T' ? 'var(--c-surface)' : 'inherit'};">T</button>
                <button onclick="answerQuiz(${i},'I','${q.a}')" class="px-4 py-1.5 rounded-full text-sm font-bold transition" style="background:${answered === 'I' ? (isCorrect ? 'var(--c-primary)' : '#ef4444') : 'rgba(0,0,0,0.06)'};color:${answered === 'I' ? 'var(--c-surface)' : 'inherit'};">I</button>

              ${answered ? `<p class="text-xs mt-2 ${isCorrect ? '' : 'text-red-500'}">${isCorrect ? '✅' : '❌'} ${q.why}</p>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

  quizAnswers[i] = answer;
  renderContent();
}
