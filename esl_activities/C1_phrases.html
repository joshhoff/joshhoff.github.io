<!doctype html>
<html lang="en" class="h-full">
 <head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Flashcards</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    .card-flip { transition: transform 0.6s; transform-style: preserve-3d; }
    .card-flip.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; }
    .card-back { transform: rotateY(180deg); }
    .progress-dot { transition: all 0.3s; }
    .slide-in { animation: slideIn 0.4s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); font-family: 'Outfit', sans-serif;">
   <div class="flex flex-col items-center justify-center min-h-full px-4 py-8">
    <h1 id="title" class="text-3xl md:text-4xl font-bold mb-2 text-center" style="font-family: 'DM Serif Display', serif; color: #e94560;">Spanish Flashcards</h1>
    <p class="text-gray-400 mb-6 text-sm">C1 Level · Tap card to flip</p>
    <div id="progress" class="flex gap-2 mb-6 flex-wrap justify-center"></div>
    <div class="relative w-full max-w-md h-72 cursor-pointer" id="card-container" onclick="flipCard()">
     <div id="card" class="card-flip w-full h-full">
      <div class="card-front rounded-2xl p-8 flex flex-col items-center justify-center text-center shadow-2xl" style="background: linear-gradient(145deg, #1f2940, #253350); border: 1px solid #e9456030;"><span class="text-xs uppercase tracking-widest mb-3" style="color: #e94560;">Español</span>
       <p id="front-text" class="text-2xl md:text-3xl font-medium text-white leading-snug"></p>
      </div>
      <div class="card-back rounded-2xl p-8 flex flex-col items-center justify-center text-center shadow-2xl" style="background: linear-gradient(145deg, #0f3460, #1a1a2e); border: 1px solid #53d8a030;"><span class="text-xs uppercase tracking-widest mb-3" style="color: #53d8a0;">English</span>
       <p id="back-text" class="text-2xl md:text-3xl font-medium text-white leading-snug"></p>
      </div>
     </div>
    </div>
    <div class="flex items-center gap-4 mt-8"><button onclick="prevCard()" class="p-3 rounded-full transition hover:scale-110" style="background: #e9456020; color: #e94560;"><i data-lucide="chevron-left"></i></button> <span id="counter" class="text-gray-400 text-sm font-medium min-w-[60px] text-center"></span> <button onclick="nextCard()" class="p-3 rounded-full transition hover:scale-110" style="background: #e9456020; color: #e94560;"><i data-lucide="chevron-right"></i></button>
    </div><button onclick="shuffle()" class="mt-4 px-5 py-2 rounded-full text-sm font-medium transition hover:scale-105" style="background: #53d8a020; color: #53d8a0;"> <i data-lucide="shuffle" style="width:14px;height:14px;display:inline;vertical-align:middle;"></i> Shuffle </button>
   </div>
  </div>
  <script>
const phrases = [
  { es: "A decir verdad", en: "To tell the truth" },
  { es: "Para su asombro", en: "To her amazement" },
  { es: "Es muy amable de su parte", en: "That's very kind of you" },
  { es: "Me siento culpable", en: "I feel guilty" },
  { es: "Lo que quiero decir es que", en: "What I mean to say is..." },
  { es: "Sin lugar a dudas", en: "Without a doubt" },
  { es: "Dadas las circunstancias", en: "Given the circumstances" },
  { es: "De buenas a primeras", en: "Suddenly / Out of the blue" },
  { es: "Por lo general", en: "Generally" },
  { es: "Entre tanto", en: "Meanwhile" },
  { es: "Sacar de quicio", en: "To drive crazy" },
  { es: "Le dio un vuelco el corazón", en: "Heart skipped a beat" },
  { es: "Quedándose en blanco", en: "Drawing a blank" }
];

let deck = [...phrases];
let current = 0;

function render() {
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  document.getElementById('front-text').textContent = deck[current].es;
  document.getElementById('back-text').textContent = deck[current].en;
  document.getElementById('counter').textContent = `${current + 1} / ${deck.length}`;
  renderProgress();
}

function renderProgress() {
  const container = document.getElementById('progress');
  container.innerHTML = deck.map((_, i) =>
    `<div class="progress-dot w-2.5 h-2.5 rounded-full ${i === current ? 'scale-125' : 'opacity-40'}" style="background: ${i === current ? '#e94560' : '#ffffff'};"></div>`
  ).join('');
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  current = (current + 1) % deck.length;
  document.getElementById('card-container').classList.add('slide-in');
  setTimeout(() => document.getElementById('card-container').classList.remove('slide-in'), 400);
  render();
}

function prevCard() {
  current = (current - 1 + deck.length) % deck.length;
  render();
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = 0;
  render();
}

// Element SDK
const defaultConfig = {
  app_title: "Spanish Flashcards",
  primary_color: "#e94560",
  surface_color: "#1f2940",
  text_color: "#ffffff",
  accent_color: "#53d8a0",
  background_color: "#1a1a2e",
  font_family: "DM Serif Display",
  font_size: 28
};

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    document.getElementById('title').textContent = config.app_title || defaultConfig.app_title;
    const titleEl = document.getElementById('title');
    titleEl.style.color = config.primary_color || defaultConfig.primary_color;
    titleEl.style.fontFamily = `${config.font_family || defaultConfig.font_family}, serif`;
    const size = config.font_size || defaultConfig.font_size;
    titleEl.style.fontSize = `${size * 1.3}px`;
    document.getElementById('front-text').style.fontSize = `${size}px`;
    document.getElementById('back-text').style.fontSize = `${size}px`;
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
      { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["app_title", config.app_title || defaultConfig.app_title]
  ])
});

render();
lucide.createIcons();
</script>

</html>
