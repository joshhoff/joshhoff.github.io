    function renderQuiz() {
      const lang = content[currentLang];
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';
      
      lang.quiz.questions.forEach((q, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'mb-8 quiz-question';
        questionDiv.dataset.index = qIndex;
        
        questionDiv.innerHTML = `
          <p class="font-semibold mb-4 text-lg">${qIndex + 1}. ${q.question}</p>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${q.options.map((opt, oIndex) => `
              <button 
                class="quiz-option card-glass p-4 rounded-lg text-left transition-all border-2 border-transparent ${quizAnswered[qIndex] !== undefined ? (oIndex === q.correct ? 'correct' : (quizAnswered[qIndex] === oIndex ? 'incorrect' : '')) : ''}"
                data-question="${qIndex}" 
                data-option="${oIndex}"
                ${quizAnswered[qIndex] !== undefined ? 'disabled' : ''}
              >
                <span class="inline-block w-6 h-6 rounded-full border border-white/30 text-center text-sm mr-2">${String.fromCharCode(65 + oIndex)}</span>
                ${opt}
              </button>
            `).join('')}
          </div>
          ${quizAnswered[qIndex] !== undefined ? `
            <p class="mt-3 text-sm ${quizAnswered[qIndex] === q.correct ? 'text-green-400' : 'text-red-400'}">
              ${quizAnswered[qIndex] === q.correct ? '✓ ' + (currentLang === 'en' ? 'Correct!' : 'Правильно!') : '✗ ' + (currentLang === 'en' ? 'Incorrect. The correct answer is ' : 'Неправильно. Правильна відповідь: ') + q.options[q.correct]}
            </p>
          ` : ''}
        `;
        
        container.appendChild(questionDiv);
      });
      
      // Add event listeners
      container.querySelectorAll('.quiz-option:not([disabled])').forEach(btn => {
        btn.addEventListener('click', handleQuizAnswer);
      });
      
      // Check if quiz is complete
      if (quizAnswered.length === lang.quiz.questions.length && !quizAnswered.includes(undefined)) {
        document.getElementById('quizResults').classList.remove('hidden');
        document.getElementById('quizContainer').classList.add('hidden');
      }
    }

    function handleQuizAnswer(e) {
      const btn = e.currentTarget;
      const qIndex = parseInt(btn.dataset.question);
      const oIndex = parseInt(btn.dataset.option);
      const lang = content[currentLang];
      const correct = lang.quiz.questions[qIndex].correct;
      
      quizAnswered[qIndex] = oIndex;
      
      if (oIndex === correct) {
        score++;
        document.getElementById('scoreDisplay').textContent = `${score}/5`;
      }
      
      renderQuiz();
      
      // Check if all answered
      if (quizAnswered.filter(a => a !== undefined).length === lang.quiz.questions.length) {
        setTimeout(() => {
          document.getElementById('quizResults').classList.remove('hidden');
          document.getElementById('quizContainer').classList.add('hidden');
        }, 1000);
      }
    }

    function resetQuiz() {
      quizAnswered = [];
      score = 0;
      document.getElementById('scoreDisplay').textContent = '0/5';
      document.getElementById('quizResults').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      renderQuiz();
    }

      document.querySelectorAll('.nav-tab').forEach(tab => {

      });
      
      document.getElementById(`section-${sectionId}`).classList.remove('hidden');
      document.querySelector(`[data-section="${sectionId}"]`).classList.add('tab-active');
    }
