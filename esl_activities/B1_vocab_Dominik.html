<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detective Vocabulary Flip Cards</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    * {
      box-sizing: border-box;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      color: #f0f0f0;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 10px 0;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .subtitle {
      font-size: 20px;
      color: #ffd700;
      margin: 0 0 15px 0;
      font-style: italic;
    }

    .instructions {
      font-size: 16px;
      color: #b8b8b8;
      margin: 0;
    }

    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid #ffd700;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
      color: #ffd700;
      font-family: 'Georgia', serif;
    }

    .mode-btn:hover {
      background: rgba(255, 215, 0, 0.1);
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #1a1a2e;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .progress-bar {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      height: 12px;
      margin: 30px 0;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .progress-fill {
      background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
      height: 100%;
      border-radius: 20px;
      transition: width 0.3s ease;
      box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
    }

    .card-container {
      perspective: 1000px;
      margin: 0 auto 30px;
      max-width: 600px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 400px;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .card-front {
      background: linear-gradient(135deg, #2d3561 0%, #1f2544 100%);
      border: 3px solid #ffd700;
    }

    .card-back {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      border: 3px solid #4a90e2;
      transform: rotateY(180deg);
    }

    .word {
      font-size: 56px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .context {
      font-size: 22px;
      color: #e0e0e0;
      text-align: center;
      line-height: 1.6;
      font-style: italic;
      max-width: 500px;
    }

    .context .highlight {
      color: #4a90e2;
      font-weight: 700;
      text-decoration: underline;
    }

    .definition-label {
      font-size: 14px;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .definition {
      font-size: 20px;
      color: #e0e0e0;
      text-align: center;
      line-height: 1.6;
      max-width: 500px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 35px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-family: 'Georgia', serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #1a1a2e;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
      color: white;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .counter {
      text-align: center;
      color: #b8b8b8;
      font-size: 18px;
      margin-top: 20px;
    }

    .completion-message {
      text-align: center;
      padding: 30px;
      background: rgba(255, 215, 0, 0.1);
      border-radius: 20px;
      border: 2px solid #ffd700;
      margin-top: 20px;
    }

    .completion-message h2 {
      color: #ffd700;
      font-size: 36px;
      margin: 0 0 15px 0;
    }

    .completion-message p {
      color: #e0e0e0;
      font-size: 20px;
      margin: 0;
    }

    /* Test Section Styles */
    .test-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .test-header h2 {
      color: #ffd700;
      font-size: 36px;
      margin: 0 0 10px 0;
    }

    .test-header p {
      color: #b8b8b8;
      font-size: 18px;
      margin: 0;
    }

    .test-card {
      background: linear-gradient(135deg, #2d3561 0%, #1f2544 100%);
      border: 3px solid #4a90e2;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .test-word {
      font-size: 28px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .test-prompt {
      font-size: 18px;
      color: #e0e0e0;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .test-input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #4a90e2;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .test-input:focus {
      outline: none;
      border-color: #ffd700;
      background: rgba(255, 255, 255, 0.08);
    }

    .test-input::placeholder {
      color: #888;
    }

    .feedback {
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 16px;
      line-height: 1.5;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.success {
      background: rgba(76, 175, 80, 0.2);
      border: 2px solid #4caf50;
      color: #81c784;
    }

    .feedback.info {
      background: rgba(74, 144, 226, 0.2);
      border: 2px solid #4a90e2;
      color: #90caf9;
    }

    .check-btn {
      background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
      color: white;
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Georgia', serif;
      font-weight: 600;
    }

    .check-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
    }

    .check-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .test-score {
      text-align: center;
      padding: 25px;
      background: rgba(255, 215, 0, 0.1);
      border-radius: 15px;
      border: 2px solid #ffd700;
      margin-top: 30px;
    }

    .test-score h3 {
      color: #ffd700;
      font-size: 28px;
      margin: 0 0 10px 0;
    }

    .test-score p {
      color: #e0e0e0;
      font-size: 20px;
      margin: 0;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }

      .card {
        height: 350px;
      }

      .word {
        font-size: 42px;
      }

      .context {
        font-size: 18px;
      }

      .definition {
        font-size: 18px;
      }

      button {
        padding: 12px 28px;
        font-size: 16px;
      }

      .test-word {
        font-size: 24px;
      }

      .test-prompt {
        font-size: 16px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>

  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container">
   <header>
    <h1 id="app-title">Detective Vocabulary Flip Cards</h1>
    <p class="subtitle" id="subtitle">Master Mystery Words in Context</p>
    <p class="instructions" id="instructions">Choose a mode to begin learning</p>
   </header>
   <div class="mode-selector"><button class="mode-btn active" data-mode="study">📚 Study Mode</button> <button class="mode-btn" data-mode="test">✍️ Practice Test</button>
   </div><!-- Study Section -->
   <div class="section active" id="study-section">
    <div class="progress-bar">
     <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="card-container">
     <div class="card" id="flip-card">
      <div class="card-face card-front">
       <div class="word" id="word"></div>
       <div class="context" id="context"></div>
      </div>
      <div class="card-face card-back">
       <div class="definition-label">
        Definition
       </div>
       <div class="definition" id="definition"></div>
      </div>
     </div>
    </div>
    <div class="controls"><button class="btn-secondary" id="prev-btn" disabled>← Previous</button> <button class="btn-primary" id="next-btn">Next →</button>
    </div>
    <div class="counter" id="counter"></div>
    <div class="completion-message" id="completion-message" style="display: none;">
     <h2>🎉 Congratulations!</h2>
     <p>You've reviewed all the vocabulary words!</p>
    </div>
   </div><!-- Test Section -->
   <div class="section" id="test-section">
    <div class="test-header">
     <h2 id="test-title">Practice Test</h2>
     <p id="test-instructions">Write a sentence using each vocabulary word</p>
    </div>
    <div id="test-cards-container"></div>
    <div class="controls"><button class="btn-primary" id="submit-test-btn">Submit All Answers</button>
    </div>
    <div class="test-score" id="test-score" style="display: none;">
     <h3>Test Complete! 🎯</h3>
     <p id="score-text"></p>
    </div>
   </div>
  </div>
  <script>
    const vocabularyData = [
      {
        word: "clue",
        context: "The detective found a <span class='highlight'>clue</span> at the crime scene that pointed to the suspect.",
        definition: "A piece of information or evidence that helps solve a mystery or problem."
      },
      {
        word: "evidence",
        context: "The lawyer presented strong <span class='highlight'>evidence</span> to prove the defendant's innocence.",
        definition: "Facts or information that indicate whether something is true or valid."
      },
      {
        word: "mystery",
        context: "The disappearance of the ancient artifact remained a <span class='highlight'>mystery</span> for decades.",
        definition: "Something that is difficult or impossible to understand or explain; a puzzle."
      },
      {
        word: "case",
        context: "The detective worked tirelessly on the <span class='highlight'>case</span> until she finally solved it.",
        definition: "An instance of a particular situation; an investigation or legal matter."
      },
      {
        word: "question",
        context: "The investigator asked a crucial <span class='highlight'>question</span> that revealed the truth.",
        definition: "A sentence or phrase used to find out information; an inquiry."
      },
      {
        word: "answer",
        context: "After hours of searching, they finally found the <span class='highlight'>answer</span> to the riddle.",
        definition: "A response to a question; a solution to a problem."
      },
      {
        word: "notebook",
        context: "The reporter kept detailed notes in her <span class='highlight'>notebook</span> during the interview.",
        definition: "A book with blank or lined pages for writing notes and observations."
      },
      {
        word: "truth",
        context: "The witness promised to tell the <span class='highlight'>truth</span> and nothing but the truth.",
        definition: "That which is true or in accordance with fact or reality; honesty."
      },
      {
        word: "lie",
        context: "The suspect told a <span class='highlight'>lie</span> to cover up his involvement in the crime.",
        definition: "An intentionally false statement; something that is not true."
      },
      {
        word: "story",
        context: "Each witness told a different <span class='highlight'>story</span> about what happened that night.",
        definition: "An account of events or experiences; a narrative, whether true or fictional."
      },
      {
        word: "crime",
        context: "The police investigated the <span class='highlight'>crime</span> and arrested the perpetrator.",
        definition: "An action that is against the law and punishable by the legal system."
      },
      {
        word: "secret",
        context: "She kept the location of the treasure a <span class='highlight'>secret</span> from everyone.",
        definition: "Something kept hidden or unknown to others; confidential information."
      },
      {
        word: "detective",
        context: "The <span class='highlight'>detective</span> carefully examined all the evidence to solve the case.",
        definition: "A person, especially a police officer, whose job is to investigate crimes and find information."
      }
    ];

    let currentIndex = 0;
    let isFlipped = false;
    let currentMode = 'study';
    let testAnswers = {};

    const defaultConfig = {
      app_title: "Detective Vocabulary Flip Cards",
      subtitle: "Master Mystery Words in Context",
      instructions: "Choose a mode to begin learning",
      test_title: "Practice Test",
      test_instructions: "Write a sentence using each vocabulary word"
    };

    const config = {};

    // Study Mode Functions
    function updateCard() {
      const card = vocabularyData[currentIndex];
      document.getElementById('word').textContent = card.word;
      document.getElementById('context').innerHTML = card.context;
      document.getElementById('definition').textContent = card.definition;
      
      document.getElementById('flip-card').classList.remove('flipped');
      isFlipped = false;
      
      updateProgress();
      updateCounter();
      updateButtons();
      
      if (currentIndex === vocabularyData.length - 1) {
        document.getElementById('completion-message').style.display = 'block';
      } else {
        document.getElementById('completion-message').style.display = 'none';
      }
    }

    function updateProgress() {
      const progress = ((currentIndex + 1) / vocabularyData.length) * 100;
      document.getElementById('progress-fill').style.width = progress + '%';
    }

    function updateCounter() {
      document.getElementById('counter').textContent = `Card ${currentIndex + 1} of ${vocabularyData.length}`;
    }

    function updateButtons() {
      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').textContent = currentIndex === vocabularyData.length - 1 ? 'Restart' : 'Next →';
    }

    document.getElementById('flip-card').addEventListener('click', function() {
      this.classList.toggle('flipped');
      isFlipped = !isFlipped;
    });

    document.getElementById('next-btn').addEventListener('click', function() {
      if (currentIndex === vocabularyData.length - 1) {
        currentIndex = 0;
      } else {
        currentIndex++;
      }
      updateCard();
    });

    document.getElementById('prev-btn').addEventListener('click', function() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    // Test Mode Functions
    function initializeTest() {
      const container = document.getElementById('test-cards-container');
      container.innerHTML = '';
      testAnswers = {};
      
      vocabularyData.forEach((item, index) => {
        const testCard = document.createElement('div');
        testCard.className = 'test-card';
        testCard.innerHTML = `
          <div class="test-word">${index + 1}. ${item.word}</div>
          <div class="test-prompt">Write a sentence using the word "<strong>${item.word}</strong>":</div>
          <textarea 
            class="test-input" 
            id="test-input-${index}" 
            rows="3" 
            placeholder="Type your sentence here..."
          ></textarea>
          <button class="check-btn" data-index="${index}">Check Answer</button>
          <div class="feedback" id="feedback-${index}"></div>
        `;
        container.appendChild(testCard);
      });

      // Add event listeners to check buttons
      document.querySelectorAll('.check-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const index = parseInt(this.getAttribute('data-index'));
          checkAnswer(index);
        });
      });

      document.getElementById('test-score').style.display = 'none';
    }

    function checkAnswer(index) {
      const input = document.getElementById(`test-input-${index}`);
      const feedback = document.getElementById(`feedback-${index}`);
      const answer = input.value.trim();
      const word = vocabularyData[index].word;

      if (answer.length === 0) {
        feedback.className = 'feedback info show';
        feedback.textContent = 'Please write a sentence before checking.';
        return;
      }

      const wordRegex = new RegExp(`\\b${word}\\b`, 'i');
      const containsWord = wordRegex.test(answer);

      if (containsWord) {
        feedback.className = 'feedback success show';
        feedback.innerHTML = `✓ Great! You used "<strong>${word}</strong>" in your sentence. Your sentence shows understanding of the word's meaning.`;
        testAnswers[index] = true;
      } else {
        feedback.className = 'feedback info show';
        feedback.innerHTML = `Make sure to include the word "<strong>${word}</strong>" in your sentence.`;
        testAnswers[index] = false;
      }
    }

    document.getElementById('submit-test-btn').addEventListener('click', function() {
      let allAnswered = true;
      let correctCount = 0;

      vocabularyData.forEach((item, index) => {
        const input = document.getElementById(`test-input-${index}`);
        const feedback = document.getElementById(`feedback-${index}`);
        
        if (input.value.trim().length === 0) {
          allAnswered = false;
          feedback.className = 'feedback info show';
          feedback.textContent = 'Please complete this sentence.';
        } else if (testAnswers[index] === undefined) {
          checkAnswer(index);
        }
        
        if (testAnswers[index] === true) {
          correctCount++;
        }
      });

      if (allAnswered) {
        const scoreDiv = document.getElementById('test-score');
        const scoreText = document.getElementById('score-text');
        scoreDiv.style.display = 'block';
        scoreText.textContent = `You completed ${correctCount} out of ${vocabularyData.length} sentences correctly!`;
        scoreDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });

    // Mode Switching
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const mode = this.getAttribute('data-mode');
        
        // Update active button
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        // Switch sections
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        if (mode === 'study') {
          document.getElementById('study-section').classList.add('active');
          currentMode = 'study';
        } else if (mode === 'test') {
          document.getElementById('test-section').classList.add('active');
          currentMode = 'test';
          initializeTest();
        }
      });
    });

    // Element SDK Integration
    async function onConfigChange(config) {
      document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('instructions').textContent = config.instructions || defaultConfig.instructions;
      document.getElementById('test-title').textContent = config.test_title || defaultConfig.test_title;
      document.getElementById('test-instructions').textContent = config.test_instructions || defaultConfig.test_instructions;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["app_title", config.app_title || defaultConfig.app_title],
          ["subtitle", config.subtitle || defaultConfig.subtitle],
          ["instructions", config.instructions || defaultConfig.instructions],
          ["test_title", config.test_title || defaultConfig.test_title],
          ["test_instructions", config.test_instructions || defaultConfig.test_instructions]
        ])
      });
    }

    updateCard();
  </script>
