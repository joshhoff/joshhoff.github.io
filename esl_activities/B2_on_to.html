<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preposition Pairs</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&amp;display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    * { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Fraunces', serif; }
    .card-enter { animation: cardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .pulse-correct { animation: pulseGreen 0.5s ease; }
    @keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); } 100% { box-shadow: 0 0 0 16px rgba(34,197,94,0); } }
    .shake-wrong { animation: shakeRed 0.4s ease; }
    @keyframes shakeRed { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
    .tab-active { border-bottom: 3px solid; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full overflow-auto" style="background: #0f1729;">
  <div id="app" class="h-full w-full" style="background: linear-gradient(160deg, #0f1729 0%, #1a2744 50%, #0f1729 100%);"><!-- Header -->
   <header class="pt-8 pb-4 px-6 text-center">
    <h1 id="app-title" class="font-display text-3xl md:text-4xl font-semibold" style="color: #f0c864;">Preposition Pairs</h1>
    <p id="app-subtitle" class="mt-2 text-base" style="color: #8b9fc1;">Master <strong>TO</strong> &amp; <strong>ON</strong> with verbs</p>
   </header><!-- Tabs -->
   <nav class="flex justify-center gap-1 px-4 mb-6" role="tablist"><button onclick="switchTab('learn')" id="tab-learn" role="tab" class="tab-btn tab-active px-5 py-2.5 rounded-t-lg text-sm font-medium transition-all" style="color: #f0c864; border-color: #f0c864; background: rgba(240,200,100,0.08);"> <i data-lucide="book-open" style="width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px;"></i> Learn </button> <button onclick="switchTab('practice')" id="tab-practice" role="tab" class="tab-btn px-5 py-2.5 rounded-t-lg text-sm font-medium transition-all" style="color: #8b9fc1; border-color: transparent; background: transparent;"> <i data-lucide="pen-tool" style="width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px;"></i> Practice </button> <button onclick="switchTab('quiz')" id="tab-quiz" role="tab" class="tab-btn px-5 py-2.5 rounded-t-lg text-sm font-medium transition-all" style="color: #8b9fc1; border-color: transparent; background: transparent;"> <i data-lucide="trophy" style="width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px;"></i> Quiz </button>
   </nav><!-- LEARN TAB -->
   <main id="panel-learn" class="px-4 md:px-8 pb-12 max-w-3xl mx-auto">
    <div class="space-y-5" id="learn-cards"></div>
   </main><!-- PRACTICE TAB -->
   <main id="panel-practice" class="px-4 md:px-8 pb-12 max-w-2xl mx-auto hidden">
    <div id="practice-area"></div>
   </main><!-- QUIZ TAB -->
   <main id="panel-quiz" class="px-4 md:px-8 pb-12 max-w-2xl mx-auto hidden">
    <div id="quiz-area"></div>
   </main>
  </div>
  <script>
// ─── DATA ───
const verbPairs = [
  {
    verb: "depend",
    correct: "on",
    definition: "To rely on someone or something for support or help.",
    exampleCorrect: "You can always <b>depend on</b> Maria to finish the report on time.",
    exampleWrong: "❌ \"depend to\" is not used in English.",
    tip: "Think: you lean ON someone → depend ON.",
    level: "common"
  },
  {
    verb: "look forward",
    correct: "to",
    definition: "To feel excited and pleased about something that is going to happen.",
    exampleCorrect: "I'm <b>looking forward to</b> meeting you next week.",
    exampleWrong: "❌ \"look forward on\" doesn't exist.",
    tip: "You're moving toward a future event → forward TO.",
    level: "common"
  },
  {
    verb: "concentrate",
    correct: "on",
    definition: "To direct your attention or effort at something specific.",
    exampleCorrect: "Please <b>concentrate on</b> the instructions before starting.",
    exampleWrong: "❌ \"concentrate to\" is incorrect.",
    tip: "Your focus sits ON a target → concentrate ON.",
    level: "common"
  },
  {
    verb: "object",
    correct: "to",
    definition: "To express disagreement or disapproval of something.",
    exampleCorrect: "Several residents <b>objected to</b> the new construction plan.",
    exampleWrong: "❌ \"object on\" is not standard English.",
    tip: "You push back TO-ward something → object TO.",
    level: "intermediate"
  },
  {
    verb: "insist",
    correct: "on",
    definition: "To demand something firmly and refuse to accept alternatives.",
    exampleCorrect: "She <b>insisted on</b> paying for everyone's dinner.",
    exampleWrong: "❌ \"insist to\" is incorrect (but \"insist that…\" is fine).",
    tip: "You stand firm ON your position → insist ON.",
    level: "intermediate"
  },
  {
    verb: "contribute",
    correct: "to",
    definition: "To give something (money, time, ideas) to help achieve a goal.",
    exampleCorrect: "Exercise <b>contributes to</b> better mental health.",
    exampleWrong: "❌ \"contribute on\" is not used.",
    tip: "You add something TO a larger cause → contribute TO.",
    level: "common"
  },
  {
    verb: "rely",
    correct: "on",
    definition: "To trust and depend on someone or something.",
    exampleCorrect: "We <b>rely on</b> public transport to get to work.",
    exampleWrong: "❌ \"rely to\" is incorrect.",
    tip: "Similar to depend — you lean ON support → rely ON.",
    level: "common"
  },
  {
    verb: "respond",
    correct: "to",
    definition: "To say or do something as a reaction to something.",
    exampleCorrect: "The company <b>responded to</b> customer complaints quickly.",
    exampleWrong: "❌ \"respond on\" is not correct.",
    tip: "A response goes back TO the source → respond TO.",
    level: "common"
  },
  {
    verb: "comment",
    correct: "on",
    definition: "To express an opinion or remark about something.",
    exampleCorrect: "The professor <b>commented on</b> each student's progress.",
    exampleWrong: "❌ \"comment to\" is not the standard form (but \"comment to someone\" is different).",
    tip: "Your words land ON a topic → comment ON.",
    level: "intermediate"
  },
  {
    verb: "refer",
    correct: "to",
    definition: "To mention or direct attention to something.",
    exampleCorrect: "The speaker <b>referred to</b> several recent studies.",
    exampleWrong: "❌ \"refer on\" is not used.",
    tip: "You point TO something → refer TO.",
    level: "common"
  }
];

// ─── STATE ───
let currentTab = 'learn';
let practiceIndex = 0;
let practiceScore = 0;
let practiceAnswered = false;
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizFinished = false;

// ─── TAB SWITCHING ───
function switchTab(tab) {
  currentTab = tab;
  ['learn','practice','quiz'].forEach(t => {
    const panel = document.getElementById('panel-' + t);
    const btn = document.getElementById('tab-' + t);
    if (t === tab) {
      panel.classList.remove('hidden');
      btn.style.color = '#f0c864';
      btn.style.borderColor = '#f0c864';
      btn.style.background = 'rgba(240,200,100,0.08)';
      btn.classList.add('tab-active');
    } else {
      panel.classList.add('hidden');
      btn.style.color = '#8b9fc1';
      btn.style.borderColor = 'transparent';
      btn.style.background = 'transparent';
      btn.classList.remove('tab-active');
    }
  });
  if (tab === 'practice') renderPractice();
  if (tab === 'quiz' && !quizFinished) initQuiz();
}

// ─── LEARN TAB ───
function renderLearn() {
  const container = document.getElementById('learn-cards');
  container.innerHTML = '';
  verbPairs.forEach((vp, i) => {
    const card = document.createElement('div');
    card.className = 'card-enter rounded-xl p-5 md:p-6';
    card.style.cssText = `background: rgba(255,255,255,0.04); border: 1px solid rgba(240,200,100,0.12); animation-delay: ${i * 0.06}s; opacity: 0;`;
    const badge = vp.correct === 'to'
      ? '<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold" style="background:rgba(99,179,237,0.15);color:#63b3ed;">TO</span>'
      : '<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold" style="background:rgba(237,137,54,0.15);color:#ed8936;">ON</span>';
    card.innerHTML = `
      <div class="flex items-center gap-3 mb-3">
        <span class="font-display text-xl font-semibold" style="color:#e8dcc8;">${vp.verb} ${badge}</span>
      </div>
      <p class="text-sm mb-3" style="color:#8b9fc1;">${vp.definition}</p>
      <div class="rounded-lg p-3 mb-2" style="background:rgba(240,200,100,0.06);">
        <p class="text-sm" style="color:#c9b97a;">✓ ${vp.exampleCorrect}</p>
      </div>
      <p class="text-xs mb-2" style="color:#6b7a94;">${vp.exampleWrong}</p>
      <div class="flex items-start gap-2 mt-3 pt-3" style="border-top:1px solid rgba(255,255,255,0.05);">
        <i data-lucide="lightbulb" style="width:14px;height:14px;color:#f0c864;flex-shrink:0;margin-top:2px;"></i>
        <p class="text-xs" style="color:#a89860;">${vp.tip}</p>
      </div>
    `;
    container.appendChild(card);
  });
  lucide.createIcons();
}

// ─── PRACTICE TAB ───
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderPractice() {
  if (practiceIndex >= verbPairs.length) {
    document.getElementById('practice-area').innerHTML = `
      <div class="text-center card-enter rounded-xl p-8" style="background:rgba(255,255,255,0.04);border:1px solid rgba(240,200,100,0.12);">
        <div class="text-5xl mb-4">🎉</div>
        <h2 class="font-display text-2xl font-semibold mb-2" style="color:#f0c864;">Practice Complete!</h2>
        <p class="text-lg mb-6" style="color:#8b9fc1;">You scored <strong style="color:#e8dcc8;">${practiceScore}</strong> out of <strong style="color:#e8dcc8;">${verbPairs.length}</strong></p>
        <button onclick="resetPractice()" class="px-6 py-2.5 rounded-lg font-medium text-sm transition-all hover:brightness-110" style="background:#f0c864;color:#0f1729;">Try Again</button>
      </div>`;
    return;
  }
  practiceAnswered = false;
  const vp = verbPairs[practiceIndex];
  const area = document.getElementById('practice-area');
  area.innerHTML = `
    <div class="mb-4 flex justify-between items-center">
      <span class="text-xs font-medium px-3 py-1 rounded-full" style="background:rgba(240,200,100,0.1);color:#c9b97a;">${practiceIndex + 1} / ${verbPairs.length}</span>
      <span class="text-xs" style="color:#8b9fc1;">Score: ${practiceScore}</span>
    </div>
    <div class="card-enter rounded-xl p-6 md:p-8 text-center" style="background:rgba(255,255,255,0.04);border:1px solid rgba(240,200,100,0.12);" id="practice-card">
      <p class="text-sm mb-2" style="color:#6b7a94;">Choose the correct preposition:</p>
      <h2 class="font-display text-2xl md:text-3xl font-semibold mb-6" style="color:#e8dcc8;">${vp.verb} ___</h2>
      <div class="flex justify-center gap-4 mb-6">
        <button onclick="answerPractice('to')" id="btn-to" class="px-8 py-3 rounded-lg font-bold text-lg transition-all hover:scale-105" style="background:rgba(99,179,237,0.15);color:#63b3ed;border:2px solid rgba(99,179,237,0.3);">TO</button>
        <button onclick="answerPractice('on')" id="btn-on" class="px-8 py-3 rounded-lg font-bold text-lg transition-all hover:scale-105" style="background:rgba(237,137,54,0.15);color:#ed8936;border:2px solid rgba(237,137,54,0.3);">ON</button>
      </div>
      <div id="practice-feedback" class="hidden fade-in"></div>
    </div>`;
  lucide.createIcons();
}

function answerPractice(choice) {
  if (practiceAnswered) return;
  practiceAnswered = true;
  const vp = verbPairs[practiceIndex];
  const correct = choice === vp.correct;
  if (correct) practiceScore++;

  const card = document.getElementById('practice-card');
  card.classList.add(correct ? 'pulse-correct' : 'shake-wrong');

  const btnTo = document.getElementById('btn-to');
  const btnOn = document.getElementById('btn-on');
  if (vp.correct === 'to') { btnTo.style.background = 'rgba(34,197,94,0.2)'; btnTo.style.borderColor = '#22c55e'; btnTo.style.color = '#22c55e'; }
  else { btnOn.style.background = 'rgba(34,197,94,0.2)'; btnOn.style.borderColor = '#22c55e'; btnOn.style.color = '#22c55e'; }
  if (!correct) {
    const wrong = choice === 'to' ? btnTo : btnOn;
    wrong.style.background = 'rgba(239,68,68,0.2)'; wrong.style.borderColor = '#ef4444'; wrong.style.color = '#ef4444';
  }

  const fb = document.getElementById('practice-feedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `
    <div class="rounded-lg p-4 mt-2" style="background:${correct ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)'};">
      <p class="font-medium text-sm mb-1" style="color:${correct ? '#22c55e' : '#ef4444'};">${correct ? '✓ Correct!' : '✗ Not quite.'}</p>
      <p class="text-sm" style="color:#8b9fc1;">${vp.tip}</p>
    </div>
    <button onclick="practiceIndex++;renderPractice();" class="mt-4 px-5 py-2 rounded-lg text-sm font-medium transition-all hover:brightness-110" style="background:#f0c864;color:#0f1729;">
      ${practiceIndex < verbPairs.length - 1 ? 'Next →' : 'See Results'}
    </button>`;
}

function resetPractice() { practiceIndex = 0; practiceScore = 0; renderPractice(); }

// ─── QUIZ TAB ───
function initQuiz() {
  quizFinished = false;
  quizIndex = 0;
  quizScore = 0;
  quizQuestions = shuffleArray(verbPairs).slice(0, 7).map(vp => {
    const options = shuffleArray([
      { text: `${vp.verb} to`, isCorrect: vp.correct === 'to' },
      { text: `${vp.verb} on`, isCorrect: vp.correct === 'on' },
    ]);
    return { ...vp, options };
  });
  renderQuiz();
}

function renderQuiz() {
  if (quizIndex >= quizQuestions.length) {
    quizFinished = true;
    const pct = Math.round((quizScore / quizQuestions.length) * 100);
    const emoji = pct >= 85 ? '🏆' : pct >= 60 ? '👏' : '💪';
    document.getElementById('quiz-area').innerHTML = `
      <div class="text-center card-enter rounded-xl p-8" style="background:rgba(255,255,255,0.04);border:1px solid rgba(240,200,100,0.12);">
        <div class="text-5xl mb-4">${emoji}</div>
        <h2 class="font-display text-2xl font-semibold mb-2" style="color:#f0c864;">Quiz Results</h2>
        <p class="text-4xl font-bold mb-1" style="color:#e8dcc8;">${pct}%</p>
        <p class="text-sm mb-6" style="color:#8b9fc1;">${quizScore} of ${quizQuestions.length} correct</p>
        <p class="text-sm mb-6" style="color:#6b7a94;">${pct >= 85 ? 'Excellent! You really understand these prepositions.' : pct >= 60 ? 'Good work! Review the Learn tab for the ones you missed.' : 'Keep practicing! Check the Learn tab and try again.'}</p>
        <button onclick="initQuiz()" class="px-6 py-2.5 rounded-lg font-medium text-sm transition-all hover:brightness-110" style="background:#f0c864;color:#0f1729;">Retake Quiz</button>
      </div>`;
    return;
  }
  quizAnswered = false;
  const q = quizQuestions[quizIndex];
  const area = document.getElementById('quiz-area');
  area.innerHTML = `
    <div class="mb-4 flex justify-between items-center">
      <span class="text-xs font-medium px-3 py-1 rounded-full" style="background:rgba(240,200,100,0.1);color:#c9b97a;">Question ${quizIndex + 1} / ${quizQuestions.length}</span>
      <span class="text-xs" style="color:#8b9fc1;">Score: ${quizScore}</span>
    </div>
    <!-- Progress bar -->
    <div class="w-full h-1.5 rounded-full mb-6" style="background:rgba(255,255,255,0.06);">
      <div class="h-1.5 rounded-full transition-all duration-500" style="background:#f0c864;width:${((quizIndex) / quizQuestions.length) * 100}%;"></div>
    </div>
    <div class="card-enter rounded-xl p-6 md:p-8" style="background:rgba(255,255,255,0.04);border:1px solid rgba(240,200,100,0.12);" id="quiz-card">
      <p class="text-sm mb-1" style="color:#6b7a94;">${q.definition}</p>
      <p class="text-xs mb-5" style="color:#4a5568;">Which is correct?</p>
      <div class="space-y-3" id="quiz-options">
        ${q.options.map((o, i) => `
          <button onclick="answerQuiz(${i})" id="qopt-${i}" class="w-full text-left px-5 py-3.5 rounded-lg font-medium text-sm transition-all hover:brightness-110" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#e8dcc8;">
            ${o.text}
          </button>
        `).join('')}
      </div>
      <div id="quiz-feedback" class="hidden fade-in mt-4"></div>
    </div>`;
  lucide.createIcons();
}

function answerQuiz(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizQuestions[quizIndex];
  const correct = q.options[idx].isCorrect;
  if (correct) quizScore++;

  q.options.forEach((o, i) => {
    const btn = document.getElementById('qopt-' + i);
    if (o.isCorrect) { btn.style.background = 'rgba(34,197,94,0.15)'; btn.style.borderColor = '#22c55e'; btn.style.color = '#22c55e'; }
    else if (i === idx) { btn.style.background = 'rgba(239,68,68,0.15)'; btn.style.borderColor = '#ef4444'; btn.style.color = '#ef4444'; }
  });

  const fb = document.getElementById('quiz-feedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `
    <p class="text-sm mb-1" style="color:${correct ? '#22c55e' : '#ef4444'};">${correct ? '✓ Correct!' : '✗ Incorrect.'}</p>
    <p class="text-xs mb-3" style="color:#8b9fc1;">${q.tip}</p>
    <button onclick="quizIndex++;renderQuiz();" class="px-5 py-2 rounded-lg text-sm font-medium transition-all hover:brightness-110" style="background:#f0c864;color:#0f1729;">
      ${quizIndex < quizQuestions.length - 1 ? 'Next Question →' : 'See Results'}
    </button>`;
}

// ─── ELEMENT SDK ───
const defaultConfig = {
  app_title: 'Preposition Pairs',
  subtitle: 'Master TO & ON with verbs',
  background_color: '#0f1729',
  surface_color: '#1a2744',
  text_color: '#e8dcc8',
  accent_color: '#f0c864',
  muted_color: '#8b9fc1',
  font_family: 'Fraunces',
  font_size: 16
};

function applyConfig(config) {
  const t = (k) => config[k] || defaultConfig[k];

  document.getElementById('app-title').textContent = t('app_title');
  document.getElementById('app-subtitle').innerHTML = `${t('subtitle')}`;

  const bg = t('background_color');
  const surface = t('surface_color');
  const accent = t('accent_color');
  const text = t('text_color');
  const muted = t('muted_color');

  document.getElementById('app').style.background = `linear-gradient(160deg, ${bg} 0%, ${surface} 50%, ${bg} 100%)`;
  document.getElementById('app-title').style.color = accent;
  document.getElementById('app-subtitle').style.color = muted;

  const font = t('font_family');
  const baseSize = t('font_size');
  document.querySelectorAll('.font-display').forEach(el => el.style.fontFamily = `${font}, Fraunces, serif`);
  document.getElementById('app-title').style.fontSize = `${baseSize * 2}px`;
  document.getElementById('app-subtitle').style.fontSize = `${baseSize}px`;
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => {
    const c = (key) => ({
      get: () => config[key] || defaultConfig[key],
      set: (v) => { config[key] = v; window.elementSdk.setConfig({ [key]: v }); }
    });
    return {
      recolorables: [c('background_color'), c('surface_color'), c('text_color'), c('accent_color'), c('muted_color')],
      borderables: [],
      fontEditable: c('font_family'),
      fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
    };
  },
  mapToEditPanelValues: (config) => new Map([
    ['app_title', config.app_title || defaultConfig.app_title],
    ['subtitle', config.subtitle || defaultConfig.subtitle]
  ])
});

// ─── INIT ───
renderLearn();
lucide.createIcons();
</script>
