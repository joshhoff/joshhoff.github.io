  <script>
    const exercises = [
      { sentence: "The journalist ___ article exposed the scandal received an award.", answer: "whose" },
      { sentence: "I can't remember ___ responsible for the budget this quarter.", answer: "who's" },
      { sentence: "The organisation ___ funding was cut had to close two branches.", answer: "whose" },
      { sentence: "She's the colleague ___ always late to meetings.", answer: "who's" },
      { sentence: "They demolished the building ___ foundations had become unstable.", answer: "whose" },
      { sentence: "The novelist, ___ latest book became a bestseller, is giving a talk tonight.", answer: "whose" },
      { sentence: "Do you know ___ coming to the conference next week?", answer: "who's" },
      { sentence: "The candidate ___ qualifications best match the role will be contacted.", answer: "whose" }
    ];

    const container = document.getElementById('activities');
    exercises.forEach((ex, i) => {
      const parts = ex.sentence.split('___');
      const div = document.createElement('div');
      div.className = 'flex items-center flex-wrap gap-1 text-gray-800';
      div.innerHTML = `<span class="font-medium text-gray-500 mr-2">${i+1}.</span><span>${parts[0]}</span><input type="text" class="activity-input" data-index="${i}" aria-label="Fill in the blank ${i+1}"><span>${parts[1]}</span>`;
      container.appendChild(div);
    });

    function checkAnswers() {
      let score = 0;
      document.querySelectorAll('.activity-input').forEach((input, i) => {
        const val = input.value.trim().toLowerCase();
        if (val === exercises[i].answer) {
          input.classList.add('correct');
          input.classList.remove('incorrect');
          score++;
        } else {
          input.classList.add('incorrect');
          input.classList.remove('correct');
        }
      });
      const msg = document.getElementById('result-msg');
      msg.classList.remove('hidden');
      msg.textContent = `You got ${score}/${exercises.length} correct!`;
      msg.style.color = score === exercises.length ? '#16a34a' : '#6366f1';
    }
  </script>
