            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .wrong-answer {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .progress-bar {
            transition: width 0.5s ease;
        }
        
        .fade-in {
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-purple-700 text-white py-4 px-6 shadow-md">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl md:text-3xl font-bold">Fashion Grammar</h1>
                <div class="flex items-center space-x-4">
                    <span id="score-display" class="bg-white text-purple-700 px-3 py-1 rounded-full font-semibold">Score: 0</span>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-8">
            <!-- Navigation Tabs -->
            <div class="mb-8">
                <div class="flex flex-wrap border-b border-gray-200">
                    <button class="tab-button px-6 py-3 text-purple-700 font-medium border-b-2 border-purple-700" data-tab="adjectives">Adjectives</button>
                    <button class="tab-button px-6 py-3 text-gray-500 font-medium" data-tab="adverbs">Adverbs</button>
                    <button class="tab-button px-6 py-3 text-gray-500 font-medium" data-tab="pronouns">Pronouns</button>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="progress-bar bg-purple-600 h-2.5 rounded-full" style="width: 33.3333%;"></div>
            </div>
            
            <!-- Exercise Container -->
            <div id="exercise-container" class="bg-white rounded-lg shadow-lg p-6 mb-8"><div class="mb-6">
                <h2 class="text-xl font-semibold mb-2">Exercise 1 of 3</h2>
                <p class="text-gray-600">Focus: Adjectives</p>
            </div><div class="mb-6"><p class="text-lg font-medium">Coco Chanel created _______ (elegant) designs that revolutionized women's fashion.</p></div><div class="space-y-4"><div class="grid grid-cols-2 gap-3"><button class="p-3 border rounded-lg hover:bg-purple-50 transition">elegant</button><button class="p-3 border rounded-lg hover:bg-purple-50 transition">elegantly</button><button class="p-3 border rounded-lg hover:bg-purple-50 transition">elegance</button><button class="p-3 border rounded-lg hover:bg-purple-50 transition">more elegant</button></div></div></div>
            
            <!-- Buttons -->
            <div class="flex justify-between">
                <button id="prev-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-6 rounded-lg shadow transition duration-300 disabled:opacity-50" disabled="">Previous</button>
                <button id="check-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-6 rounded-lg shadow transition duration-300">Check Answer</button>
                <button id="next-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-6 rounded-lg shadow transition duration-300">Next</button>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="bg-gray-800 text-white py-4 px-6">
            <div class="container mx-auto text-center">
                <p>ESL Fashion Grammar Practice | B1 Level</p>
            </div>
        </footer>
    </div>
    
    <!-- Feedback Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <h2 id="feedback-title" class="text-2xl font-bold mb-4">Feedback</h2>
            <p id="feedback-message" class="mb-6">Your answer is correct!</p>
            <div class="flex justify-end">
                <button id="close-modal" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-6 rounded-lg shadow transition duration-300">Continue</button>
            </div>
        </div>
    </div>
    
    <script>
        // Data for exercises
        const exercises = {
            adjectives: [
                {
                    type: "fill-in",
                    question: "Coco Chanel created _______ (elegant) designs that revolutionized women's fashion.",
                    options: ["elegant", "elegantly", "elegance", "more elegant"],
                    answer: "elegant",
                    explanation: "'Elegant' is the correct adjective to describe Chanel's designs."
                },
                {
                    type: "multiple-choice",
                    question: "Which sentence uses the adjective correctly?",
                    options: [
                        "The Versace dress was beautifully.",
                        "She walked down the runway quick.",
                        "The colorful scarf matched her outfit perfectly.",
                        "The model looked happily in the photoshoot."
                    ],
                    answer: "The colorful scarf matched her outfit perfectly.",
                    explanation: "'Colorful' is an adjective correctly describing the scarf."
                },
                {
                    type: "matching",
                    question: "Match the adjectives to the appropriate nouns:",
                    pairs: [
                        { item: "vintage", match: "jeans" },
                        { item: "luxurious", match: "silk" },
                        { item: "trendy", match: "accessories" },
                        { item: "comfortable", match: "shoes" }
                    ],
                    explanation: "Adjectives describe nouns. 'Vintage' describes 'jeans', 'luxurious' describes 'silk', etc."
                }
            ],
            adverbs: [
                {
                    type: "fill-in",
                    question: "The model walked _______ (graceful) down the runway.",
                    options: ["graceful", "gracefully", "grace", "gracefulness"],
                    answer: "gracefully",
                    explanation: "'Gracefully' is the adverb form that describes how the model walked."
                },
                {
                    type: "multiple-choice",
                    question: "Which sentence uses the adverb correctly?",
                    options: [
                        "The designer created a quick outfit.",
                        "The fashion show started prompt at 8 PM.",
                        "The seamstress sewed the dress careful.",
                        "The audience applauded enthusiastically after the show."
                    ],
                    answer: "The audience applauded enthusiastically after the show.",
                    explanation: "'Enthusiastically' is an adverb correctly modifying the verb 'applauded'."
                },
                {
                    type: "reorder",
                    question: "Arrange the words to form a sentence with a correctly used adverb:",
                    words: ["The", "designer", "skillfully", "created", "the", "dress", "for", "the", "event"],
                    answer: "The designer skillfully created the dress for the event",
                    explanation: "'Skillfully' is an adverb that correctly modifies the verb 'created'."
                }
            ],
            pronouns: [
                {
                    type: "fill-in",
                    question: "Gucci is famous for _______ (they) distinctive patterns and high-quality materials.",
                    options: ["they", "their", "them", "theirs"],
                    answer: "their",
                    explanation: "'Their' is the correct possessive pronoun to show ownership."
                },
                {
                    type: "multiple-choice",
                    question: "Which sentence uses pronouns correctly?",
                    options: [
                        "Me designed this collection for the spring season.",
                        "The customers loved the new designs and bought them immediately.",
                        "Her and him are the top designers at the company.",
                        "Myself will present the new collection next week."
                    ],
                    answer: "The customers loved the new designs and bought them immediately.",
                    explanation: "'Them' is the correct object pronoun referring to 'the new designs'."
                },
                {
                    type: "drag-drop",
                    question: "Complete the text with the correct pronouns:",
                    text: "Ralph Lauren started [1] company in 1967. [2] is known for [3] classic American designs. Many celebrities wear [4] clothes because [5] love the elegant style.",
                    options: ["his", "He", "his", "his", "they"],
                    slots: 5,
                    explanation: "1: 'his' (possessive), 2: 'He' (subject), 3: 'his' (possessive), 4: 'his' (possessive), 5: 'they' (subject)"
                }
            ]
        };
        
        // Application state
        let currentTab = "adjectives";
        let currentExerciseIndex = 0;
        let score = 0;
        let userAnswers = {};
        
        // DOM elements
        const exerciseContainer = document.getElementById("exercise-container");
        const progressBar = document.getElementById("progress-bar");
        const scoreDisplay = document.getElementById("score-display");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const checkBtn = document.getElementById("check-btn");
        const tabButtons = document.querySelectorAll(".tab-button");
        const feedbackModal = document.getElementById("feedback-modal");
        const feedbackTitle = document.getElementById("feedback-title");
        const feedbackMessage = document.getElementById("feedback-message");
        const closeModalBtn = document.getElementById("close-modal");
        
        // Initialize the application
        function init() {
            loadExercise();
            updateProgressBar();
            updateScore();
            
            // Event listeners
            tabButtons.forEach(button => {
                button.addEventListener("click", () => {
                    setActiveTab(button.dataset.tab);
                });
            });
            
            prevBtn.addEventListener("click", goToPreviousExercise);
            nextBtn.addEventListener("click", goToNextExercise);
            checkBtn.addEventListener("click", checkAnswer);
            closeModalBtn.addEventListener("click", closeModal);
        }
        
        // Set active tab
        function setActiveTab(tab) {
            currentTab = tab;
            currentExerciseIndex = 0;
            userAnswers = {};
            
            // Update tab styling
            tabButtons.forEach(button => {
                if (button.dataset.tab === tab) {
                    button.classList.add("text-purple-700", "border-b-2", "border-purple-700");
                    button.classList.remove("text-gray-500");
                } else {
                    button.classList.remove("text-purple-700", "border-b-2", "border-purple-700");
                    button.classList.add("text-gray-500");
                }
            });
            
            loadExercise();
            updateProgressBar();
        }
        
        // Load current exercise
        function loadExercise() {
            const currentExercises = exercises[currentTab];
            const exercise = currentExercises[currentExerciseIndex];
            
            // Update navigation buttons
            prevBtn.disabled = currentExerciseIndex === 0;
            nextBtn.textContent = currentExerciseIndex === currentExercises.length - 1 ? "Finish" : "Next";
            
            // Clear previous content
            exerciseContainer.innerHTML = "";
            exerciseContainer.classList.add("fade-in");
            
            // Create exercise content based on type
            const exerciseHeader = document.createElement("div");
            exerciseHeader.className = "mb-6";
            exerciseHeader.innerHTML = `
                <h2 class="text-xl font-semibold mb-2">Exercise ${currentExerciseIndex + 1} of ${currentExercises.length}</h2>
                <p class="text-gray-600">Focus: ${currentTab.charAt(0).toUpperCase() + currentTab.slice(1)}</p>
            `;
            exerciseContainer.appendChild(exerciseHeader);
            
            const questionElement = document.createElement("div");
            questionElement.className = "mb-6";
            questionElement.innerHTML = `<p class="text-lg font-medium">${exercise.question}</p>`;
            exerciseContainer.appendChild(questionElement);
            
            const answerContainer = document.createElement("div");
            answerContainer.className = "space-y-4";
            
            switch (exercise.type) {
                case "fill-in":
                    createFillInExercise(exercise, answerContainer);
                    break;
                case "multiple-choice":
                    createMultipleChoiceExercise(exercise, answerContainer);
                    break;
                case "matching":
                    createMatchingExercise(exercise, answerContainer);
                    break;
                case "reorder":
                    createReorderExercise(exercise, answerContainer);
                    break;
                case "drag-drop":
                    createDragDropExercise(exercise, answerContainer);
                    break;
            }
            
            exerciseContainer.appendChild(answerContainer);
            
            // Reset animation
            setTimeout(() => {
                exerciseContainer.classList.remove("fade-in");
            }, 500);
        }
        
        // Create fill-in exercise
        function createFillInExercise(exercise, container) {
            const optionsContainer = document.createElement("div");
            optionsContainer.className = "grid grid-cols-2 gap-3";
            
            exercise.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "p-3 border rounded-lg hover:bg-purple-50 transition";
                button.textContent = option;
                
                // Check if this option was previously selected
                if (userAnswers[`${currentTab}-${currentExerciseIndex}`] === option) {
                    button.classList.add("bg-purple-100", "border-purple-300");
                }
                
                button.addEventListener("click", () => {
                    // Remove selection from all options
                    optionsContainer.querySelectorAll("button").forEach(btn => {
                        btn.classList.remove("bg-purple-100", "border-purple-300");
                    });
                    
                    // Add selection to clicked option
                    button.classList.add("bg-purple-100", "border-purple-300");
                    
                    // Save user's answer
                    userAnswers[`${currentTab}-${currentExerciseIndex}`] = option;
                });
                
                optionsContainer.appendChild(button);
            });
            
            container.appendChild(optionsContainer);
        }
        
        // Create multiple-choice exercise
        function createMultipleChoiceExercise(exercise, container) {
            const optionsContainer = document.createElement("div");
            optionsContainer.className = "space-y-3";
            
            exercise.options.forEach((option, index) => {
                const optionDiv = document.createElement("div");
                optionDiv.className = "flex items-start p-3 border rounded-lg hover:bg-purple-50 transition cursor-pointer";
                
                // Check if this option was previously selected
                if (userAnswers[`${currentTab}-${currentExerciseIndex}`] === option) {
                    optionDiv.classList.add("bg-purple-100", "border-purple-300");
                }
                
                optionDiv.innerHTML = `
                    <div class="flex-shrink-0 mr-3">
                        <div class="w-6 h-6 border-2 border-purple-500 rounded-full flex items-center justify-center">
                            <div class="w-3 h-3 bg-purple-500 rounded-full ${userAnswers[`${currentTab}-${currentExerciseIndex}`] === option ? '' : 'hidden'}"></div>
                        </div>
                    </div>
                    <div>
                        <p>${option}</p>
                    </div>
                `;
                
                optionDiv.addEventListener("click", () => {
                    // Remove selection from all options
                    optionsContainer.querySelectorAll(".flex").forEach(div => {
                        div.classList.remove("bg-purple-100", "border-purple-300");
                        div.querySelector(".w-3").classList.add("hidden");
                    });
                    
                    // Add selection to clicked option
                    optionDiv.classList.add("bg-purple-100", "border-purple-300");
                    optionDiv.querySelector(".w-3").classList.remove("hidden");
                    
                    // Save user's answer
                    userAnswers[`${currentTab}-${currentExerciseIndex}`] = option;
                });
                
                optionsContainer.appendChild(optionDiv);
            });
            
            container.appendChild(optionsContainer);
        }
        
        // Create matching exercise
        function createMatchingExercise(exercise, container) {
            const matchingContainer = document.createElement("div");
            matchingContainer.className = "grid grid-cols-2 gap-6";
            
            const leftColumn = document.createElement("div");
            leftColumn.className = "space-y-3";
            
            const rightColumn = document.createElement("div");
            rightColumn.className = "space-y-3";
            
            // Shuffle the pairs for the right column
            const shuffledMatches = [...exercise.pairs].map(p => p.match).sort(() => Math.random() - 0.5);
            
            // Create left column items (items to match)
            exercise.pairs.forEach((pair, index) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "p-3 bg-purple-100 rounded-lg border border-purple-200";
                itemDiv.textContent = pair.item;
                itemDiv.dataset.index = index;
                leftColumn.appendChild(itemDiv);
            });
            
            // Create right column items (matches)
            shuffledMatches.forEach((match, index) => {
                const matchDiv = document.createElement("div");
                matchDiv.className = "p-3 bg-gray-100 rounded-lg border border-gray-200 cursor-pointer";
                matchDiv.textContent = match;
                matchDiv.dataset.match = match;
                
                // Check if this match was previously selected
                const savedAnswer = userAnswers[`${currentTab}-${currentExerciseIndex}-${index}`];
                if (savedAnswer) {
                    matchDiv.dataset.selected = savedAnswer;
                    matchDiv.classList.add("bg-blue-100", "border-blue-300");
                }
                
                matchDiv.addEventListener("click", () => {
                    // If already selected, deselect
                    if (matchDiv.dataset.selected) {
                        delete matchDiv.dataset.selected;
                        matchDiv.classList.remove("bg-blue-100", "border-blue-300");
                        delete userAnswers[`${currentTab}-${currentExerciseIndex}-${index}`];
                        return;
                    }
                    
                    // Get the currently selected item from the left column
                    const selectedItem = document.querySelector(".selected-item");
                    if (selectedItem) {
                        // Mark as matched
                        matchDiv.dataset.selected = selectedItem.dataset.index;
                        matchDiv.classList.add("bg-blue-100", "border-blue-300");
                        
                        // Save the match
                        userAnswers[`${currentTab}-${currentExerciseIndex}-${selectedItem.dataset.index}`] = match;
                        
                        // Deselect the item
                        selectedItem.classList.remove("selected-item", "bg-purple-300", "border-purple-400");
                    }
                });
                
                rightColumn.appendChild(matchDiv);
            });
            
            // Add event listeners to left column items
            leftColumn.querySelectorAll("div").forEach(itemDiv => {
                itemDiv.addEventListener("click", () => {
                    // Deselect any previously selected item
                    const prevSelected = document.querySelector(".selected-item");
                    if (prevSelected) {
                        prevSelected.classList.remove("selected-item", "bg-purple-300", "border-purple-400");
                    }
                    
                    // Select this item
                    itemDiv.classList.add("selected-item", "bg-purple-300", "border-purple-400");
                });
            });
            
            matchingContainer.appendChild(leftColumn);
            matchingContainer.appendChild(rightColumn);
            container.appendChild(matchingContainer);
        }
        
        // Create reorder exercise
        function createReorderExercise(exercise, container) {
            const instructionText = document.createElement("p");
            instructionText.className = "text-gray-600 mb-4";
            instructionText.textContent = "Click on words to arrange them in the correct order:";
            container.appendChild(instructionText);
            
            const wordsContainer = document.createElement("div");
            wordsContainer.className = "flex flex-wrap gap-2 mb-4";
            
            // Shuffle the words
            const shuffledWords = [...exercise.words].sort(() => Math.random() - 0.5);
            
            // Create word buttons
            shuffledWords.forEach(word => {
                const wordBtn = document.createElement("button");
                wordBtn.className = "px-3 py-2 bg-gray-100 rounded-lg border border-gray-200 hover:bg-gray-200 transition";
                wordBtn.textContent = word;
                wordsContainer.appendChild(wordBtn);
            });
            
            container.appendChild(wordsContainer);
            
            const answerContainer = document.createElement("div");
            answerContainer.className = "min-h-[60px] p-4 border-2 border-dashed border-gray-300 rounded-lg flex flex-wrap gap-2";
            container.appendChild(answerContainer);
            
            // Load previous answer if exists
            const savedAnswer = userAnswers[`${currentTab}-${currentExerciseIndex}`];
            if (savedAnswer) {
                const savedWords = savedAnswer.split(" ");
                savedWords.forEach(word => {
                    // Find and move the word button
                    const wordBtn = Array.from(wordsContainer.children).find(btn => btn.textContent === word);
                    if (wordBtn) {
                        answerContainer.appendChild(wordBtn);
                    }
                });
            }
            
            // Add click event to word buttons
            wordsContainer.querySelectorAll("button").forEach(btn => {
                btn.addEventListener("click", () => {
                    answerContainer.appendChild(btn);
                    updateReorderAnswer(answerContainer);
                });
            });
            
            answerContainer.addEventListener("click", event => {
                if (event.target.tagName === "BUTTON") {
                    wordsContainer.appendChild(event.target);
                    updateReorderAnswer(answerContainer);
                }
            });
        }
        
        // Update reorder exercise answer
        function updateReorderAnswer(answerContainer) {
            const words = Array.from(answerContainer.children).map(btn => btn.textContent);
            userAnswers[`${currentTab}-${currentExerciseIndex}`] = words.join(" ");
        }
        
        // Create drag-drop exercise
        function createDragDropExercise(exercise, container) {
            const textParts = exercise.text.split(/\[(\d+)\]/g);
            
            const textContainer = document.createElement("div");
            textContainer.className = "text-lg mb-6 leading-relaxed";
            
            let slotIndex = 0;
            textParts.forEach(part => {
                if (!isNaN(parseInt(part))) {
                    // This is a slot number
                    const slot = document.createElement("span");
                    slot.className = "inline-block min-w-[80px] px-2 py-1 mx-1 border-b-2 border-purple-500 text-center";
                    slot.dataset.slot = parseInt(part) - 1;
                    
                    // Check if there's a saved answer for this slot
                    const savedAnswer = userAnswers[`${currentTab}-${currentExerciseIndex}-${slotIndex}`];
                    if (savedAnswer) {
                        slot.textContent = savedAnswer;
                        slot.classList.add("bg-purple-100");
                    }
                    
                    textContainer.appendChild(slot);
                    slotIndex++;
                } else {
                    // This is regular text
                    const text = document.createTextNode(part);
                    textContainer.appendChild(text);
                }
            });
            
            container.appendChild(textContainer);
            
            const optionsContainer = document.createElement("div");
            optionsContainer.className = "flex flex-wrap gap-2 mt-4";
            
            // Shuffle the options
            const shuffledOptions = [...exercise.options].sort(() => Math.random() - 0.5);
            
            // Create option buttons
            shuffledOptions.forEach(option => {
                const optionBtn = document.createElement("button");
                optionBtn.className = "px-3 py-2 bg-gray-100 rounded-lg border border-gray-200 hover:bg-gray-200 transition";
                optionBtn.textContent = option;
                
                // Check if this option is already used
                const isUsed = Object.values(userAnswers).includes(option) && 
                              Object.keys(userAnswers).some(key => key.startsWith(`${currentTab}-${currentExerciseIndex}-`));
                
                if (isUsed) {
                    optionBtn.disabled = true;
                    optionBtn.classList.add("opacity-50");
                }
                
                optionBtn.addEventListener("click", () => {
                    const slots = textContainer.querySelectorAll("span[data-slot]");
                    const emptySlot = Array.from(slots).find(slot => !slot.textContent);
                    
                    if (emptySlot) {
                        emptySlot.textContent = option;
                        emptySlot.classList.add("bg-purple-100");
                        optionBtn.disabled = true;
                        optionBtn.classList.add("opacity-50");
                        
                        // Save the answer
                        userAnswers[`${currentTab}-${currentExerciseIndex}-${Array.from(slots).indexOf(emptySlot)}`] = option;
                    }
                });
                
                optionsContainer.appendChild(optionBtn);
            });
            
            // Add clear button
            const clearBtn = document.createElement("button");
            clearBtn.className = "px-3 py-2 bg-red-100 text-red-700 rounded-lg border border-red-200 hover:bg-red-200 transition ml-auto";
            clearBtn.textContent = "Clear All";
            clearBtn.addEventListener("click", () => {
                // Clear all slots
                textContainer.querySelectorAll("span[data-slot]").forEach(slot => {
                    slot.textContent = "";
                    slot.classList.remove("bg-purple-100");
                });
                
                // Enable all option buttons
                optionsContainer.querySelectorAll("button").forEach(btn => {
                    if (btn !== clearBtn) {
                        btn.disabled = false;
                        btn.classList.remove("opacity-50");
                    }
                });
                
                // Clear saved answers for this exercise
                Object.keys(userAnswers).forEach(key => {
                    if (key.startsWith(`${currentTab}-${currentExerciseIndex}-`)) {
                        delete userAnswers[key];
                    }
                });
            });
            
            optionsContainer.appendChild(clearBtn);
            container.appendChild(optionsContainer);
        }
        
        // Go to previous exercise
        function goToPreviousExercise() {
            if (currentExerciseIndex > 0) {
                currentExerciseIndex--;
                loadExercise();
                updateProgressBar();
            }
        }
        
        // Go to next exercise
        function goToNextExercise() {
            const currentExercises = exercises[currentTab];
            
            if (currentExerciseIndex < currentExercises.length - 1) {
                currentExerciseIndex++;
                loadExercise();
                updateProgressBar();
            } else {
                // Show completion message
                showFeedback("Section Complete!", `You've completed the ${currentTab} section. Try another section or review your answers.`, "success");
                
                // Reset to first exercise of next tab
                const tabsArray = ["adjectives", "adverbs", "pronouns"];
                const currentTabIndex = tabsArray.indexOf(currentTab);
                
                if (currentTabIndex < tabsArray.length - 1) {
                    setActiveTab(tabsArray[currentTabIndex + 1]);
                } else {
                    setActiveTab("adjectives");
                }
            }
        }
        
        // Check the current answer
        function checkAnswer() {
            const currentExercises = exercises[currentTab];
            const exercise = currentExercises[currentExerciseIndex];
            let isCorrect = false;
            let explanation = exercise.explanation;
            
            switch (exercise.type) {
                case "fill-in":
                case "multiple-choice":
                case "reorder":
                    const userAnswer = userAnswers[`${currentTab}-${currentExerciseIndex}`];
                    isCorrect = userAnswer === exercise.answer;
                    break;
                    
                case "matching":
                    isCorrect = true;
                    for (let i = 0; i < exercise.pairs.length; i++) {
                        const userMatch = userAnswers[`${currentTab}-${currentExerciseIndex}-${i}`];
                        if (!userMatch || userMatch !== exercise.pairs[i].match) {
                            isCorrect = false;
                            break;
                        }
                    }
                    break;
                    
                case "drag-drop":
                    isCorrect = true;
                    for (let i = 0; i < exercise.options.length; i++) {
                        const userOption = userAnswers[`${currentTab}-${currentExerciseIndex}-${i}`];
                        if (!userOption || userOption !== exercise.options[i]) {
                            isCorrect = false;
                            break;
                        }
                    }
                    break;
            }
            
            if (isCorrect) {
                // Increment score if not already answered correctly
                if (!userAnswers[`${currentTab}-${currentExerciseIndex}-correct`]) {
                    score++;
                    userAnswers[`${currentTab}-${currentExerciseIndex}-correct`] = true;
                    updateScore();
                }
                
                showFeedback("Correct!", explanation, "success");
            } else {
                showFeedback("Try Again", explanation, "error");
            }
        }
        
        // Show feedback modal
        function showFeedback(title, message, type) {
            feedbackTitle.textContent = title;
            feedbackMessage.textContent = message;
            
            if (type === "success") {
                feedbackTitle.className = "text-2xl font-bold mb-4 text-green-600";
            } else {
                feedbackTitle.className = "text-2xl font-bold mb-4 text-red-600";
            }
            
            feedbackModal.classList.remove("hidden");
        }
        
        // Close feedback modal
        function closeModal() {
            feedbackModal.classList.add("hidden");
        }
        
        // Update progress bar
        function updateProgressBar() {
            const currentExercises = exercises[currentTab];
            const progress = ((currentExerciseIndex + 1) / currentExercises.length) * 100;
            progressBar.style.width = `${progress}%`;
        }
        
        // Update score display
        function updateScore() {
            scoreDisplay.textContent = `Score: ${score}`;
        }
        
        // Initialize the application
        init();
    </script>
