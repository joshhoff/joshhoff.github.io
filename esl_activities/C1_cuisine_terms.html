function toggleLang() {
  lang = lang === 'en' ? 'es' : 'en';
  document.getElementById('langLabel').textContent = lang === 'en' ? 'ES' : 'EN';
  renderTabs();
  renderContent();
}

function renderTabs() {
  const c = content[lang];
  const nav = document.getElementById('tabNav');
  nav.innerHTML = '';
  c.tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = `px-4 py-3 font-semibold text-sm whitespace-nowrap transition ${i === currentTab ? 'tab-active' : 'tab-inactive'}`;
    btn.textContent = t;
    btn.onclick = () => { currentTab = i; renderTabs(); renderContent(); };
    nav.appendChild(btn);
  });
}

function renderContent() {
  const c = content[lang];
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.className = 'fade-in';
  if (currentTab === 0) renderVocabulary(main, c);
  else if (currentTab === 1) renderPhrases(main, c);
  else if (currentTab === 2) renderMatch(main, c);
  else if (currentTab === 3) renderWrite(main, c);
  else renderSpeak(main, c);
}

function renderVocabulary(main, c) {

    <p class="text-sm opacity-70 mb-6">${d.subtitle}</p>`;
  d.categories.forEach((cat, ci) => {
    html += `<div class="rounded-2xl border p-5 mb-5" style="background:var(--c-surface);border-color:rgba(0,0,0,0.06);">
      <h3 class="font-heading text-xl font-bold mb-4">${cat.name}</h3>
      <div class="space-y-3">`;
    cat.items.forEach((item, ii) => {
      const revKey = `v_${ci}_${ii}`;
      html += `<div class="rounded-lg p-4" style="background:color-mix(in srgb, var(--c-primary) 6%, transparent);">
        <div class="flex justify-between items-start cursor-pointer" onclick="revealedDefinitions['${revKey}'] = !revealedDefinitions['${revKey}']; renderContent();">
          <p class="font-bold text-sm" style="color:var(--c-primary);">${item.term}</p>
          <i data-lucide="${revealedDefinitions[revKey] ? 'chevron-up' : 'chevron-down'}" style="width:18px;height:18px;opacity:0.6;"></i>
        </div>

function toggleLang() {

}

function renderTabs() {
  const c = content[lang];

  nav.innerHTML = '';
  c.tabs.forEach((t, i) => {

    btn.textContent = t;

    nav.appendChild(btn);
  });
}

function renderContent() {
  const c = content[lang];

  main.innerHTML = '';

  if (currentTab === 0) renderLearn(main, c);
