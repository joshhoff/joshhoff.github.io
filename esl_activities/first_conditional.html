  <script>
        const exercises = [
            { prompt: 'If it ______ (rain), I ______ (take) an umbrella.', answers: ['rains', 'will take'] },
            { prompt: 'She ______ (miss) the bus if she ______ (not hurry).', answers: ['will miss', "doesn't hurry"] },
            { prompt: 'If you ______ (study) hard, you ______ (pass) the exam.', answers: ['study', 'will pass'] },
            { prompt: 'We ______ (go) to the beach if the weather ______ (be) nice.', answers: ['will go', 'is'] },
            { prompt: 'If he ______ (not call), I ______ (not wait).', answers: ["doesn't call", "won't wait"] },
        ];

        let score = 0;
        let checked = false;

        function buildExercises() {
            const container = document.getElementById('exercises');
            exercises.forEach((ex, i) => {
                const parts = ex.prompt.split('______');
                const div = document.createElement('div');
                div.className = 'fade-in';
                div.innerHTML = `
                    <p class="text-sm font-medium text-gray-500 mb-1">Question ${i + 1}</p>
                    <div class="flex flex-wrap items-center gap-1 leading-loose">
                        <span>${parts[0]}</span>
                        <input type="text" data-ex="${i}" data-slot="0" class="exercise-input border-2 border-gray-200 rounded px-2 py-1 w-32 text-center outline-none" autocomplete="off">
                        <span>${parts[1]}</span>
                        <input type="text" data-ex="${i}" data-slot="1" class="exercise-input border-2 border-gray-200 rounded px-2 py-1 w-32 text-center outline-none" autocomplete="off">
                        <span>${parts[2] || ''}</span>
                    </div>
                    <p id="fb-${i}" class="text-sm mt-1 hidden"></p>
                `;
                container.appendChild(div);
            });
        }

        function normalize(s) {
            return s.trim().toLowerCase().replace(/['']/g, "'");
        }

        function checkAnswers() {
            if (checked) { resetExercises(); return; }
            score = 0;
            exercises.forEach((ex, i) => {
                const inputs = document.querySelectorAll(`[data-ex="${i}"]`);
                const fb = document.getElementById(`fb-${i}`);
                let allCorrect = true;
                inputs.forEach((inp, s) => {
                    const correct = normalize(inp.value) === normalize(ex.answers[s]);
                    inp.classList.remove('correct', 'incorrect');
                    inp.classList.add(correct ? 'correct' : 'incorrect');
                    inp.readOnly = true;
                    if (!correct) allCorrect = false;
                });
                fb.classList.remove('hidden', 'text-green-600', 'text-red-500');
                if (allCorrect) {
                    fb.textContent = 'Correct! ✓';
                    fb.classList.add('text-green-600');
                    score++;
                } else {
                    fb.textContent = `Answer: ${ex.answers.join(' / ')}`;
                    fb.classList.add('text-red-500');
                }
            });
            document.getElementById('score-display').textContent = `${score} / ${exercises.length}`;
            checked = true;
            document.querySelector('[data-template-id="check-btn"]').textContent = 'Try Again';
        }

        function resetExercises() {
            exercises.forEach((_, i) => {
                const inputs = document.querySelectorAll(`[data-ex="${i}"]`);
                inputs.forEach(inp => {
                    inp.value = '';
                    inp.readOnly = false;
                    inp.classList.remove('correct', 'incorrect');
                });
                const fb = document.getElementById(`fb-${i}`);
                fb.classList.add('hidden');
            });
            score = 0;
            document.getElementById('score-display').textContent = `0 / ${exercises.length}`;
            checked = false;
            document.querySelector('[data-template-id="check-btn"]').textContent = 'Check Answers';
        }

        document.addEventListener('DOMContentLoaded', () => {
            buildExercises();
            lucide.createIcons();
        });
    </script>
