        let currentCards = [...phrasalVerbs];

        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update UI text
            document.getElementById('main-title').textContent = translations[lang].title;
            document.getElementById('subtitle').textContent = translations[lang].subtitle;
            document.getElementById('search-input').placeholder = translations[lang].searchPlaceholder;
            document.getElementById('btn-all').textContent = translations[lang].showAll;
            document.getElementById('btn-random').textContent = translations[lang].randomCard;
            document.getElementById('btn-reset').textContent = translations[lang].resetAll;
            document.getElementById('btn-shuffle').textContent = translations[lang].shuffle;
            
            // Re-render cards with new language
            renderCards();
        }

        function createCard(verbData, index) {
            const lang = currentLanguage;
            return `
                <div class="card-container">
                    <div class="card" onclick="flipCard(${index})">
                        <div class="card-face card-front">
                            <div class="visual-icon">${verbData.icon}</div>
                            <div class="phrasal-verb">${verbData.verb}</div>
                            <p style="opacity: 0.8; font-size: 0.9rem;">${translations[lang].clickToReveal}</p>
                        </div>
                        <div class="card-face card-back">
                            <div class="definition">${verbData.definition[lang]}</div>
                            <div class="example">"${verbData.example[lang]}"</div>
                            <div class="conversation-prompt">
                                <div class="prompt-label">${translations[lang].promptLabel}</div>
                                ${verbData.prompt[lang]}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = currentCards.map((verb, index) => createCard(verb, index)).join('');
            updateProgress();
        }

        function flipCard(index) {
            const card = document.querySelectorAll('.card')[index];
            const wasFlipped = card.classList.contains('flipped');
            
            card.classList.toggle('flipped');
            
            if (!wasFlipped) {
                flippedCount++;
            } else {
                flippedCount--;
            }
            
            updateProgress();
        }

        function updateProgress() {
            const progressText = document.getElementById('progress-text');
            const total = currentCards.length;
            const lang = currentLanguage;
            
            if (flippedCount === 0) {
                progressText.textContent = translations[lang].clickPrompt;
            } else if (flippedCount === total) {
                progressText.textContent = translations[lang].completedText.replace('{total}', total);
            } else {
                progressText.textContent = translations[lang].progressText
                    .replace('{current}', flippedCount)
                    .replace('{total}', total);
            }
        }

        function searchCards() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            if (searchTerm === '') {
                filteredCards = [...phrasalVerbs];
            } else {
                filteredCards = phrasalVerbs.filter(verb => 
                    verb.verb.toLowerCase().includes(searchTerm) ||
                    verb.definition[currentLanguage].toLowerCase().includes(searchTerm)
                );
            }
            
            currentCards = [...filteredCards];
            renderCards();
        }

        function showAll() {
            currentCards = [...filteredCards];
            renderCards();
            setActiveButton(0);
        }

        function showRandom() {
            const randomCard = filteredCards[Math.floor(Math.random() * filteredCards.length)];
            currentCards = [randomCard];
            renderCards();
            setActiveButton(1);
        }

        function resetCards() {
            flippedCount = 0;
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.remove('flipped'));
            updateProgress();
        }

        function shuffleCards() {
            currentCards = [...filteredCards].sort(() => Math.random() - 0.5);
            renderCards();
            setActiveButton(3);
        }

        function setActiveButton(index) {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttons[index].classList.add('active');
        }

        renderCards();
