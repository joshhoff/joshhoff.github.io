<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Perfect Practice - ESL Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .pulse-green { animation: pulseGreen 0.6s ease-in-out; }
        @keyframes pulseGreen { 0% { background-color: rgb(34, 197, 94); } 50% { background-color: rgb(22, 163, 74); } 100% { background-color: rgb(34, 197, 94); } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <!-- Language Switcher -->
            <div class="mb-4">
                <div class="inline-flex bg-white rounded-lg p-1 shadow-sm">
                    <button class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white" id="lang-en" onclick="switchLanguage('en')">
                        🇺🇸 English
                    </button>
                    <button class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-gray-800" id="lang-uk" onclick="switchLanguage('uk')">
                        🇺🇦 Українська
                    </button>
                </div>
            </div>
            
            <h1 class="text-4xl font-bold text-gray-800 mb-2" id="main-title">Past Perfect Practice</h1>
            <p class="text-lg text-gray-600" id="main-subtitle">Master the past perfect tense with interactive exercises</p>
            <div class="mt-4 bg-white rounded-lg p-4 shadow-sm">
                <p class="text-sm text-gray-700" id="grammar-tip"><strong>Remember:</strong> Past Perfect = had + past participle (used for actions completed before another past action)</p>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700" id="progress-label">Progress</span>
                <span class="text-sm font-medium text-gray-700" id="progress-text">0/10</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div class="bg-blue-600 h-3 rounded-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Score Display -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white rounded-lg p-4 shadow-sm text-center">
                <div class="text-2xl font-bold text-green-600" id="correct-score">0</div>
                <div class="text-sm text-gray-600" id="correct-label">Correct</div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm text-center">
                <div class="text-2xl font-bold text-red-500" id="incorrect-score">0</div>
                <div class="text-sm text-gray-600" id="incorrect-label">Incorrect</div>
            </div>
        </div>

        <!-- Exercise Container -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-6" id="exercise-container">
            <div class="mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4" id="exercise-title">Complete the sentence:</h2>
                <div class="bg-gray-50 rounded-lg p-6 mb-6">
                    <p class="text-lg text-gray-800 leading-relaxed" id="sentence-text"></p>
                </div>
            </div>

            <div class="space-y-3" id="options-container">
                <!-- Options will be inserted here -->
            </div>

            <div class="mt-6 hidden" id="feedback-container">
                <div class="p-4 rounded-lg" id="feedback-box">
                    <p class="font-medium" id="feedback-text"></p>
                    <p class="text-sm mt-2" id="explanation-text"></p>
                </div>
            </div>

            <div class="mt-6 flex justify-between">
                <button class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors hidden" id="prev-btn" onclick="previousQuestion()">
                    <span id="prev-btn-text">Previous</span>
                </button>
                <button class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors hidden ml-auto" id="next-btn" onclick="nextQuestion()">
                    <span id="next-btn-text">Next Question</span>
                </button>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="bg-white rounded-xl shadow-lg p-8 hidden" id="results-container">
            <div class="text-center">
                <div class="text-6xl mb-4" id="results-emoji">🎉</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-4" id="results-title">Exercise Complete!</h2>
                <div class="text-xl text-gray-600 mb-6">
                    <span id="score-label">Your Score:</span> <span class="font-bold text-blue-600" id="final-score"></span>
                </div>
                <div class="mb-6" id="performance-message"></div>
                <button class="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-lg font-medium" onclick="restartExercise()">
                    <span id="restart-btn-text">Practice Again</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentLanguage = 'en';
        
        const translations = {
            en: {
                mainTitle: "Past Perfect Practice",
                mainSubtitle: "Master the past perfect tense with interactive exercises",
                grammarTip: "<strong>Remember:</strong> Past Perfect = had + past participle (used for actions completed before another past action)",
                progressLabel: "Progress",
                correctLabel: "Correct",
                incorrectLabel: "Incorrect",
                exerciseTitle: "Complete the sentence:",
                prevBtnText: "Previous",
                nextBtnText: "Next Question",
                resultsTitle: "Exercise Complete!",
                scoreLabel: "Your Score:",
                restartBtnText: "Practice Again",
                correctFeedback: "✅ Correct!",
                incorrectFeedback: "❌ Incorrect",
                performanceMessages: {
                    excellent: '<p class="text-green-600 font-medium">Excellent work! You have mastered the past perfect tense!</p>',
                    good: '<p class="text-blue-600 font-medium">Good job! You have a solid understanding of the past perfect.</p>',
                    fair: '<p class="text-yellow-600 font-medium">Not bad! Keep practicing to improve your past perfect skills.</p>',
                    poor: '<p class="text-red-600 font-medium">Keep studying! Review the past perfect rules and try again.</p>'
                }
            },
            uk: {
                mainTitle: "Практика Past Perfect",
                mainSubtitle: "Опануйте минулий доконаний час за допомогою інтерактивних вправ",
                grammarTip: "<strong>Пам'ятайте:</strong> Past Perfect = had + дієприкметник минулого часу (використовується для дій, завершених до іншої минулої дії)",
                progressLabel: "Прогрес",
                correctLabel: "Правильно",
                incorrectLabel: "Неправильно",
                exerciseTitle: "Доповніть речення:",
                prevBtnText: "Попереднє",
                nextBtnText: "Наступне питання",
                resultsTitle: "Вправу завершено!",
                scoreLabel: "Ваш результат:",
                restartBtnText: "Практикувати знову",
                correctFeedback: "✅ Правильно!",
                incorrectFeedback: "❌ Неправильно",
                performanceMessages: {
                    excellent: '<p class="text-green-600 font-medium">Відмінна робота! Ви опанували минулий доконаний час!</p>',
                    good: '<p class="text-blue-600 font-medium">Гарна робота! У вас є міцне розуміння минулого доконаного часу.</p>',
                    fair: '<p class="text-yellow-600 font-medium">Непогано! Продовжуйте практикуватися, щоб покращити свої навички.</p>',
                    poor: '<p class="text-red-600 font-medium">Продовжуйте вивчати! Повторіть правила минулого доконаного часу та спробуйте знову.</p>'
                }
            }
        };

        const exercises = [
            {
                sentence: {
                    en: "By the time I arrived at the party, everyone _____ already _____.",
                    uk: "До того часу, як я прийшов на вечірку, всі вже _____."
                },
                options: {
                    en: ["had / left", "have / left", "has / left", "had / leave"],
                    uk: ["had / left", "have / left", "has / left", "had / leave"]
                },
                correct: 0,
                explanation: {
                    en: "Use 'had + past participle' because leaving happened before arriving (both past actions).",
                    uk: "Використовуйте 'had + дієприкметник минулого часу', оскільки відхід відбувся до приходу (обидві минулі дії)."
                }
            },
            {
                sentence: {
                    en: "She realized she _____ _____ her keys at home.",
                    uk: "Вона зрозуміла, що _____ _____ ключі вдома."
                },
                options: {
                    en: ["had / forgotten", "has / forgotten", "have / forgot", "had / forgot"],
                    uk: ["had / forgotten", "has / forgotten", "have / forgot", "had / forgot"]
                },
                correct: 0,
                explanation: {
                    en: "Past perfect 'had forgotten' shows the forgetting happened before the realizing.",
                    uk: "Минулий доконаний час 'had forgotten' показує, що забування відбулося до усвідомлення."
                }
            },
            {
                sentence: {
                    en: "The movie _____ already _____ when we got to the theater.",
                    uk: "Фільм вже _____ _____, коли ми прийшли до кінотеатру."
                },
                options: {
                    en: ["had / started", "has / started", "have / start", "had / start"],
                    uk: ["had / started", "has / started", "have / start", "had / start"]
                },
                correct: 0,
                explanation: {
                    en: "The movie starting occurred before getting to the theater, so we use past perfect.",
                    uk: "Початок фільму відбувся до приходу в кінотеатр, тому використовуємо минулий доконаний час."
                }
            },
            {
                sentence: {
                    en: "I was tired because I _____ _____ all night.",
                    uk: "Я був втомлений, тому що _____ _____ всю ніч."
                },
                options: {
                    en: ["had / worked", "have / worked", "has / work", "had / work"],
                    uk: ["had / worked", "have / worked", "has / work", "had / work"]
                },
                correct: 0,
                explanation: {
                    en: "Working all night happened before being tired, requiring past perfect tense.",
                    uk: "Робота всю ніч відбулася до втоми, що вимагає минулого доконаного часу."
                }
            },
            {
                sentence: {
                    en: "They couldn't find the restaurant they _____ _____ online.",
                    uk: "Вони не могли знайти ресторан, який _____ _____ в інтернеті."
                },
                options: {
                    en: ["had / seen", "have / seen", "has / saw", "had / saw"],
                    uk: ["had / seen", "have / seen", "has / saw", "had / saw"]
                },
                correct: 0,
                explanation: {
                    en: "Seeing online happened before trying to find it, so past perfect 'had seen' is correct.",
                    uk: "Перегляд в інтернеті відбувся до спроби знайти, тому правильно 'had seen'."
                }
            },
            {
                sentence: {
                    en: "After she _____ _____ her homework, she watched TV.",
                    uk: "Після того, як вона _____ _____ домашнє завдання, вона дивилася телевізор."
                },
                options: {
                    en: ["had / finished", "has / finished", "have / finish", "had / finish"],
                    uk: ["had / finished", "has / finished", "have / finish", "had / finish"]
                },
                correct: 0,
                explanation: {
                    en: "Finishing homework happened before watching TV, requiring past perfect.",
                    uk: "Завершення домашнього завдання відбулося до перегляду телевізора, що вимагає минулого доконаного часу."
                }
            },
            {
                sentence: {
                    en: "He was upset because his team _____ _____ the game.",
                    uk: "Він був засмучений, тому що його команда _____ _____ гру."
                },
                options: {
                    en: ["had / lost", "have / lost", "has / lose", "had / lose"],
                    uk: ["had / lost", "have / lost", "has / lose", "had / lose"]
                },
                correct: 0,
                explanation: {
                    en: "Losing the game happened before being upset, so we use past perfect 'had lost'.",
                    uk: "Програш гри відбувся до засмучення, тому використовуємо минулий доконаний час 'had lost'."
                }
            },
            {
                sentence: {
                    en: "We _____ never _____ such a beautiful sunset before that day.",
                    uk: "Ми ніколи не _____ _____ такого красивого заходу сонця до того дня."
                },
                options: {
                    en: ["had / seen", "have / seen", "has / saw", "had / saw"],
                    uk: ["had / seen", "have / seen", "has / saw", "had / saw"]
                },
                correct: 0,
                explanation: {
                    en: "Past perfect 'had seen' is used because the experience happened before that specific day.",
                    uk: "Минулий доконаний час 'had seen' використовується, оскільки досвід відбувся до того конкретного дня."
                }
            },
            {
                sentence: {
                    en: "The train _____ already _____ by the time we reached the station.",
                    uk: "Поїзд вже _____ _____ до того часу, як ми дісталися станції."
                },
                options: {
                    en: ["had / departed", "has / departed", "have / depart", "had / depart"],
                    uk: ["had / departed", "has / departed", "have / depart", "had / depart"]
                },
                correct: 0,
                explanation: {
                    en: "The departure happened before reaching the station, requiring past perfect tense.",
                    uk: "Відправлення відбулося до прибуття на станцію, що вимагає минулого доконаного часу."
                }
            },
            {
                sentence: {
                    en: "She felt confident because she _____ _____ hard for the exam.",
                    uk: "Вона почувалася впевнено, тому що _____ _____ наполегливо до іспиту."
                },
                options: {
                    en: ["had / studied", "has / studied", "have / study", "had / study"],
                    uk: ["had / studied", "has / studied", "have / study", "had / study"]
                },
                correct: 0,
                explanation: {
                    en: "Studying happened before feeling confident, so past perfect 'had studied' is correct.",
                    uk: "Навчання відбулося до відчуття впевненості, тому правильно 'had studied'."
                }
            }
        ];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let selectedAnswer = null;

        function switchLanguage(lang) {
            currentLanguage = lang;
            
            // Update language buttons
            document.getElementById('lang-en').className = lang === 'en' 
                ? 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white'
                : 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-gray-800';
            document.getElementById('lang-uk').className = lang === 'uk' 
                ? 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white'
                : 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-gray-800';
            
            updateLanguageContent();
            loadQuestion();
        }

        function updateLanguageContent() {
            const t = translations[currentLanguage];
            
            document.getElementById('main-title').textContent = t.mainTitle;
            document.getElementById('main-subtitle').textContent = t.mainSubtitle;
            document.getElementById('grammar-tip').innerHTML = t.grammarTip;
            document.getElementById('progress-label').textContent = t.progressLabel;
            document.getElementById('correct-label').textContent = t.correctLabel;
            document.getElementById('incorrect-label').textContent = t.incorrectLabel;
            document.getElementById('exercise-title').textContent = t.exerciseTitle;
            document.getElementById('prev-btn-text').textContent = t.prevBtnText;
            document.getElementById('next-btn-text').textContent = t.nextBtnText;
            document.getElementById('results-title').textContent = t.resultsTitle;
            document.getElementById('score-label').textContent = t.scoreLabel;
            document.getElementById('restart-btn-text').textContent = t.restartBtnText;
        }

        function loadQuestion() {
            const exercise = exercises[currentQuestion];
            document.getElementById('sentence-text').textContent = exercise.sentence[currentLanguage];
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            exercise.options[currentLanguage].forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'w-full p-4 text-left border-2 border-gray-200 rounded-lg hover:border-blue-300 hover:bg-blue-50 transition-all duration-200';
                button.textContent = option;
                button.onclick = () => selectAnswer(index, button);
                optionsContainer.appendChild(button);
            });

            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            
            updateProgress();
            selectedAnswer = null;
        }

        function selectAnswer(answerIndex, buttonElement) {
            if (selectedAnswer !== null) return;
            
            selectedAnswer = answerIndex;
            const exercise = exercises[currentQuestion];
            const isCorrect = answerIndex === exercise.correct;
            
            // Update scores
            if (isCorrect) {
                correctAnswers++;
                document.getElementById('correct-score').textContent = correctAnswers;
            } else {
                incorrectAnswers++;
                document.getElementById('incorrect-score').textContent = incorrectAnswers;
            }
            
            // Style the selected button
            const allButtons = document.querySelectorAll('#options-container button');
            allButtons.forEach(btn => btn.classList.add('pointer-events-none'));
            
            if (isCorrect) {
                buttonElement.className = 'w-full p-4 text-left border-2 border-green-500 bg-green-100 text-green-800 rounded-lg pulse-green';
            } else {
                buttonElement.className = 'w-full p-4 text-left border-2 border-red-500 bg-red-100 text-red-800 rounded-lg shake';
                // Show correct answer
                allButtons[exercise.correct].className = 'w-full p-4 text-left border-2 border-green-500 bg-green-100 text-green-800 rounded-lg';
            }
            
            // Show feedback
            showFeedback(isCorrect, exercise.explanation[currentLanguage]);
        }

        function showFeedback(isCorrect, explanation) {
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackText = document.getElementById('feedback-text');
            const explanationText = document.getElementById('explanation-text');
            const t = translations[currentLanguage];
            
            feedbackContainer.classList.remove('hidden');
            feedbackContainer.classList.add('fade-in');
            
            if (isCorrect) {
                feedbackBox.className = 'p-4 rounded-lg bg-green-100 border border-green-300';
                feedbackText.textContent = t.correctFeedback;
                feedbackText.className = 'font-medium text-green-800';
            } else {
                feedbackBox.className = 'p-4 rounded-lg bg-red-100 border border-red-300';
                feedbackText.textContent = t.incorrectFeedback;
                feedbackText.className = 'font-medium text-red-800';
            }
            
            explanationText.textContent = explanation;
            explanationText.className = 'text-sm mt-2 text-gray-700';
            
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / exercises.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `${currentQuestion}/${exercises.length}`;
        }

        function showResults() {
            document.getElementById('exercise-container').classList.add('hidden');
            document.getElementById('results-container').classList.remove('hidden');
            
            const percentage = Math.round((correctAnswers / exercises.length) * 100);
            document.getElementById('final-score').textContent = `${correctAnswers}/${exercises.length} (${percentage}%)`;
            
            const messageElement = document.getElementById('performance-message');
            const emojiElement = document.getElementById('results-emoji');
            const t = translations[currentLanguage];
            
            if (percentage >= 90) {
                messageElement.innerHTML = t.performanceMessages.excellent;
                emojiElement.textContent = '🏆';
            } else if (percentage >= 70) {
                messageElement.innerHTML = t.performanceMessages.good;
                emojiElement.textContent = '👏';
            } else if (percentage >= 50) {
                messageElement.innerHTML = t.performanceMessages.fair;
                emojiElement.textContent = '📚';
            } else {
                messageElement.innerHTML = t.performanceMessages.poor;
                emojiElement.textContent = '💪';
            }
            
            // Update final progress
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('progress-text').textContent = `${exercises.length}/${exercises.length}`;
        }

        function restartExercise() {
            currentQuestion = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            selectedAnswer = null;
            
            document.getElementById('correct-score').textContent = '0';
            document.getElementById('incorrect-score').textContent = '0';
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('exercise-container').classList.remove('hidden');
            
            loadQuestion();
        }

        // Initialize the application
        updateLanguageContent();
        loadQuestion();
    </script>

</html>
