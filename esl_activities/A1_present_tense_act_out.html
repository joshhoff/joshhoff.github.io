<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Act Out the Verb Game</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100%;
            color: #2d3748;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 2.8rem;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .language-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .lang-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .lang-btn.active {
            background: #e53e3e;
            color: white;
            transform: translateY(-2px);
        }

        .lang-btn:not(.active) {
            background: #f7fafc;
            color: #4a5568;
        }

        .lang-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .score-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .score {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .instructions {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 600;
            color: #744210;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .action-section {
            text-align: center;
            background: #f8f9fa;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 3px dashed #e2e8f0;
        }

        .action-display {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .verb-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .action-instruction {
            font-size: 1.4rem;
            color: #e53e3e;
            font-weight: bold;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
            100% {
                opacity: 1;
            }
        }

        .timer {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 20px;
        }

        .start-acting-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.3);
        }

        .start-acting-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(72, 187, 120, 0.4);
        }

        .conjugation-section {
            display: none;
        }

        .conjugation-section.active {
            display: block;
        }

        .question-text {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: #2d3748;
        }

        .conjugation-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 25px 20px;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .option-btn:hover {
            border-color: #4299e1;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border-color: #48bb78;
            transform: scale(1.05);
        }

        .option-btn.incorrect {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
            border-color: #f56565;
        }

        .feedback {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 25px 0;
            min-height: 35px;
            text-align: center;
        }

        .feedback.correct {
            color: #48bb78;
        }

        .feedback.incorrect {
            color: #f56565;
        }

        .next-btn {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 25px rgba(66, 153, 225, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(66, 153, 225, 0.4);
        }

        .next-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .celebration {
            text-align: center;
            font-size: 3rem;
            margin: 20px 0;
            animation: celebrate 1s ease-in-out;
        }

        @keyframes celebrate {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }
            
            .game-title {
                font-size: 2.2rem;
            }
            
            .action-display {
                font-size: 4rem;
            }
            
            .verb-text {
                font-size: 2rem;
            }
            
            .conjugation-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>

  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <main class="game-container">
   <header class="header">
    <h1 class="game-title" id="gameTitle">Act Out the Verb!</h1>
    <div class="language-toggle"><button class="lang-btn active" id="englishBtn" onclick="switchLanguage('en')">English</button> <button class="lang-btn" id="spanishBtn" onclick="switchLanguage('es')">Español</button>
    </div>
   </header>
   <div class="instructions" id="instructions">
    Act out the verb shown below, then choose the correct sentence!
   </div>
   <div class="score-section">
    <div class="score" id="scoreDisplay">
     Score: 0/0
    </div>
    <div class="score" id="streakDisplay">
     Streak: 0
    </div>
   </div>
   <div class="action-section" id="actionSection">
    <div class="action-display" id="actionDisplay">
     🏃
    </div>
    <div class="verb-text" id="verbText">
     RUN
    </div>
    <div class="action-instruction" id="actionInstruction">
     Act it out!
    </div>
    <div class="timer" id="timer"></div><button class="start-acting-btn" id="startActingBtn" onclick="startActing()">Start Acting!</button>
   </div>
   <div class="conjugation-section" id="conjugationSection">
    <div class="question-text" id="questionText">
     Great acting! Now choose the correct sentence:
    </div>
    <div class="conjugation-options" id="conjugationOptions"><!-- Options will be populated by JavaScript -->
    </div>
    <div class="feedback" id="feedback"></div><button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Verb</button>
   </div>
  </main>
  <script>
        const defaultConfig = {
            game_title: "Act Out the Verb!",
            instruction_text: "Act out the verb shown below, then choose the correct sentence!",
            score_label: "Score"
        };

        let currentLanguage = 'en';
        let currentQuestion = 0;
        let score = 0;
        let streak = 0;
        let totalQuestions = 0;
        let selectedAnswer = null;
        let actingTimer = null;
        let currentVerb = null;

        const verbs = [
            { emoji: '🏃', verb: 'run', spanish: 'correr' },
            { emoji: '🚶', verb: 'walk', spanish: 'caminar' },
            { emoji: '🏊', verb: 'swim', spanish: 'nadar' },
            { emoji: '🍽️', verb: 'eat', spanish: 'comer' },
            { emoji: '💤', verb: 'sleep', spanish: 'dormir' },
            { emoji: '📚', verb: 'read', spanish: 'leer' },
            { emoji: '✍️', verb: 'write', spanish: 'escribir' },
            { emoji: '🎵', verb: 'sing', spanish: 'cantar' },
            { emoji: '💃', verb: 'dance', spanish: 'bailar' },
            { emoji: '🏀', verb: 'play', spanish: 'jugar' },
            { emoji: '🚗', verb: 'drive', spanish: 'conducir' },
            { emoji: '🍳', verb: 'cook', spanish: 'cocinar' },
            { emoji: '🧹', verb: 'clean', spanish: 'limpiar' },
            { emoji: '📺', verb: 'watch', spanish: 'mirar' },
            { emoji: '🎧', verb: 'listen', spanish: 'escuchar' },
            { emoji: '💻', verb: 'work', spanish: 'trabajar' },
            { emoji: '🛒', verb: 'shop', spanish: 'comprar' },
            { emoji: '🎨', verb: 'paint', spanish: 'pintar' },
            { emoji: '🎸', verb: 'play guitar', spanish: 'tocar guitarra' },
            { emoji: '🧘', verb: 'meditate', spanish: 'meditar' },
            { emoji: '☕', verb: 'drink', spanish: 'beber' },
            { emoji: '📞', verb: 'talk', spanish: 'hablar' },
            { emoji: '🚴', verb: 'ride', spanish: 'montar' },
            { emoji: '🌱', verb: 'garden', spanish: 'jardinear' },
            { emoji: '🎯', verb: 'practice', spanish: 'practicar' },
            { emoji: '📖', verb: 'study', spanish: 'estudiar' },
            { emoji: '🎪', verb: 'perform', spanish: 'actuar' },
            { emoji: '🧽', verb: 'wash', spanish: 'lavar' },
            { emoji: '🎭', verb: 'act', spanish: 'actuar' },
            { emoji: '🏃‍♀️', verb: 'jog', spanish: 'trotar' },
            { emoji: '🎲', verb: 'play games', spanish: 'jugar juegos' },
            { emoji: '🛏️', verb: 'rest', spanish: 'descansar' }
        ];

        const subjects = ['I', 'You', 'He', 'She', 'We', 'They'];
        const spanishSubjects = ['Yo', 'Tú', 'Él', 'Ella', 'Nosotros', 'Ellos'];

        const translations = {
            en: {
                title: "Act Out the Verb!",
                instructions: "Act out the verb shown below, then choose the correct sentence!",
                score: "Score",
                streak: "Streak",
                actItOut: "Act it out!",
                startActing: "Start Acting!",
                getReady: "Get ready...",
                go: "GO! Act it out!",
                timeUp: "Time's up!",
                greatActing: "Great acting! Now choose the correct sentence:",
                correct: "Excellent! Perfect grammar!",
                incorrect: "Not quite right. The correct answer is highlighted.",
                nextVerb: "Next Verb"
            },
            es: {
                title: "¡Actúa el Verbo!",
                instructions: "¡Actúa el verbo que se muestra abajo, luego elige la oración correcta!",
                score: "Puntuación",
                streak: "Racha",
                actItOut: "¡Actúalo!",
                startActing: "¡Empezar a Actuar!",
                getReady: "Prepárate...",
                go: "¡VAMOS! ¡Actúalo!",
                timeUp: "¡Se acabó el tiempo!",
                greatActing: "¡Excelente actuación! Ahora elige la oración correcta:",
                correct: "¡Excelente! ¡Gramática perfecta!",
                incorrect: "No es correcto. La respuesta correcta está resaltada.",
                nextVerb: "Siguiente Verbo"
            }
        };

        function conjugateVerb(verb, subject, language = 'en') {
            if (language === 'es') {
                const conjugations = {
                    'correr': { 'Yo': 'corro', 'Tú': 'corres', 'Él': 'corre', 'Ella': 'corre', 'Nosotros': 'corremos', 'Ellos': 'corren' },
                    'caminar': { 'Yo': 'camino', 'Tú': 'caminas', 'Él': 'camina', 'Ella': 'camina', 'Nosotros': 'caminamos', 'Ellos': 'caminan' },
                    'nadar': { 'Yo': 'nado', 'Tú': 'nadas', 'Él': 'nada', 'Ella': 'nada', 'Nosotros': 'nadamos', 'Ellos': 'nadan' },
                    'comer': { 'Yo': 'como', 'Tú': 'comes', 'Él': 'come', 'Ella': 'come', 'Nosotros': 'comemos', 'Ellos': 'comen' },
                    'dormir': { 'Yo': 'duermo', 'Tú': 'duermes', 'Él': 'duerme', 'Ella': 'duerme', 'Nosotros': 'dormimos', 'Ellos': 'duermen' },
                    'leer': { 'Yo': 'leo', 'Tú': 'lees', 'Él': 'lee', 'Ella': 'lee', 'Nosotros': 'leemos', 'Ellos': 'leen' },
                    'escribir': { 'Yo': 'escribo', 'Tú': 'escribes', 'Él': 'escribe', 'Ella': 'escribe', 'Nosotros': 'escribimos', 'Ellos': 'escriben' },
                    'cantar': { 'Yo': 'canto', 'Tú': 'cantas', 'Él': 'canta', 'Ella': 'canta', 'Nosotros': 'cantamos', 'Ellos': 'cantan' },
                    'bailar': { 'Yo': 'bailo', 'Tú': 'bailas', 'Él': 'baila', 'Ella': 'baila', 'Nosotros': 'bailamos', 'Ellos': 'bailan' },
                    'jugar': { 'Yo': 'juego', 'Tú': 'juegas', 'Él': 'juega', 'Ella': 'juega', 'Nosotros': 'jugamos', 'Ellos': 'juegan' }
                };
                
                const conjugation = conjugations[verb] || { [subject]: verb };
                return `${subject} ${conjugation[subject] || verb}.`;
            }
            
            // English conjugation
            if (subject === 'I' || subject === 'You' || subject === 'We' || subject === 'They') {
                return `${subject} ${verb}.`;
            } else {
                // He/She - add 's' to most verbs
                let conjugatedVerb = verb;
                if (verb.endsWith('y')) {
                    conjugatedVerb = verb.slice(0, -1) + 'ies';
                } else if (verb.endsWith('s') || verb.endsWith('sh') || verb.endsWith('ch') || verb.endsWith('x') || verb.endsWith('z')) {
                    conjugatedVerb = verb + 'es';
                } else if (verb === 'have') {
                    conjugatedVerb = 'has';
                } else if (verb === 'do') {
                    conjugatedVerb = 'does';
                } else if (verb === 'go') {
                    conjugatedVerb = 'goes';
                } else if (!verb.includes(' ')) {
                    conjugatedVerb = verb + 's';
                }
                return `${subject} ${conjugatedVerb}.`;
            }
        }

        function generateQuestion() {
            currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
            const verbToUse = currentLanguage === 'es' ? currentVerb.spanish : currentVerb.verb;
            const subjectsToUse = currentLanguage === 'es' ? spanishSubjects : subjects;
            
            // Pick a random correct subject
            const correctSubject = subjectsToUse[Math.floor(Math.random() * subjectsToUse.length)];
            const correctSentence = conjugateVerb(verbToUse, correctSubject, currentLanguage);
            
            // Generate 3 incorrect options
            const incorrectOptions = [];
            const usedSentences = new Set([correctSentence]);
            
            while (incorrectOptions.length < 3) {
                const randomSubject = subjectsToUse[Math.floor(Math.random() * subjectsToUse.length)];
                let incorrectSentence;
                
                // Sometimes use wrong conjugation, sometimes use different verb
                if (Math.random() > 0.5) {
                    // Wrong conjugation of same verb
                    if (currentLanguage === 'en') {
                        if (randomSubject === 'He' || randomSubject === 'She') {
                            incorrectSentence = `${randomSubject} ${verbToUse}.`; // Missing 's'
                        } else {
                            incorrectSentence = `${randomSubject} ${verbToUse}s.`; // Extra 's'
                        }
                    } else {
                        // For Spanish, just use a different subject with potentially wrong conjugation
                        incorrectSentence = conjugateVerb(verbToUse, randomSubject, currentLanguage);
                    }
                } else {
                    // Different verb entirely
                    const randomVerb = verbs[Math.floor(Math.random() * verbs.length)];
                    const randomVerbToUse = currentLanguage === 'es' ? randomVerb.spanish : randomVerb.verb;
                    incorrectSentence = conjugateVerb(randomVerbToUse, randomSubject, currentLanguage);
                }
                
                if (!usedSentences.has(incorrectSentence)) {
                    incorrectOptions.push(incorrectSentence);
                    usedSentences.add(incorrectSentence);
                }
            }
            
            const allOptions = [correctSentence, ...incorrectOptions];
            
            // Shuffle options
            for (let i = allOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allOptions[i], allOptions[j]] = [allOptions[j], allOptions[i]];
            }
            
            return {
                verb: currentVerb,
                correctAnswer: correctSentence,
                options: allOptions
            };
        }

        function displayVerb() {
            const question = generateQuestion();
            const verbToDisplay = currentLanguage === 'es' ? question.verb.spanish : question.verb.verb;
            
            document.getElementById('actionDisplay').textContent = question.verb.emoji;
            document.getElementById('verbText').textContent = verbToDisplay.toUpperCase();
            
            // Reset sections
            document.getElementById('actionSection').style.display = 'block';
            document.getElementById('conjugationSection').classList.remove('active');
            document.getElementById('startActingBtn').style.display = 'block';
            document.getElementById('timer').textContent = '';
            
            // Store question for later use
            window.currentQuestion = question;
        }

        function startActing() {
            const t = translations[currentLanguage];
            document.getElementById('startActingBtn').style.display = 'none';
            document.getElementById('actionInstruction').textContent = t.getReady;
            
            let countdown = 3;
            const countdownInterval = setInterval(() => {
                document.getElementById('timer').textContent = countdown;
                countdown--;
                
                if (countdown < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('actionInstruction').textContent = t.go;
                    document.getElementById('timer').textContent = '';
                    
                    // Start acting timer (10 seconds)
                    let actingTime = 10;
                    actingTimer = setInterval(() => {
                        document.getElementById('timer').textContent = `${actingTime}s`;
                        actingTime--;
                        
                        if (actingTime < 0) {
                            clearInterval(actingTimer);
                            showConjugationSection();
                        }
                    }, 1000);
                }
            }, 1000);
        }

        function showConjugationSection() {
            const t = translations[currentLanguage];
            document.getElementById('actionSection').style.display = 'none';
            document.getElementById('conjugationSection').classList.add('active');
            document.getElementById('questionText').textContent = t.greatActing;
            
            // Add celebration
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = '🎉 👏 🎭';
            document.getElementById('conjugationSection').insertBefore(celebration, document.getElementById('questionText'));
            
            setTimeout(() => {
                celebration.remove();
            }, 2000);
            
            displayConjugationOptions();
        }

        function displayConjugationOptions() {
            const question = window.currentQuestion;
            const optionsContainer = document.getElementById('conjugationOptions');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => selectAnswer(option, question.correctAnswer, button);
                optionsContainer.appendChild(button);
            });
            
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            selectedAnswer = null;
            
            currentQuestion++;
            totalQuestions++;
        }

        function selectAnswer(selected, correct, buttonElement) {
            if (selectedAnswer !== null) return;
            
            selectedAnswer = selected;
            const isCorrect = selected === correct;
            
            // Disable all buttons and show results
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(btn => {
                btn.style.pointerEvents = 'none';
                if (btn.textContent === correct) {
                    btn.classList.add('correct');
                } else if (btn === buttonElement && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });
            
            const feedback = document.getElementById('feedback');
            const t = translations[currentLanguage];
            
            if (isCorrect) {
                feedback.textContent = t.correct;
                feedback.className = 'feedback correct';
                score++;
                streak++;
            } else {
                feedback.textContent = t.incorrect;
                feedback.className = 'feedback incorrect';
                streak = 0;
            }
            
            updateScore();
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            displayVerb();
        }

        function updateScore() {
            const t = translations[currentLanguage];
            document.getElementById('scoreDisplay').textContent = `${t.score}: ${score}/${totalQuestions}`;
            document.getElementById('streakDisplay').textContent = `${t.streak}: ${streak}`;
        }

        function switchLanguage(lang) {
            currentLanguage = lang;
            
            // Update button states
            document.getElementById('englishBtn').classList.toggle('active', lang === 'en');
            document.getElementById('spanishBtn').classList.toggle('active', lang === 'es');
            
            // Update UI text
            updateUIText();
            
            // Generate new verb in the selected language
            displayVerb();
        }

        function updateUIText() {
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
            const t = translations[currentLanguage];
            
            document.getElementById('gameTitle').textContent = config.game_title || t.title;
            document.getElementById('instructions').textContent = config.instruction_text || t.instructions;
            document.getElementById('actionInstruction').textContent = t.actItOut;
            document.getElementById('startActingBtn').textContent = t.startActing;
            document.getElementById('nextBtn').textContent = t.nextVerb;
            
            updateScore();
        }

        // Element SDK implementation
        async function onConfigChange(config) {
            const t = translations[currentLanguage];
            document.getElementById('gameTitle').textContent = config.game_title || defaultConfig.game_title;
            document.getElementById('instructions').textContent = config.instruction_text || defaultConfig.instruction_text;
            updateScore();
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [
                    {
