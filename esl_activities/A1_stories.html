    text: `María necesita ropa nueva para trabajar. Va a una tienda de ropa el sábado. Una asistente dice "¡Hola, puedo ayudarte?" María dice que necesita una blusa y una falda. La asistente le muestra algunas blusas. María se prueba una blusa blanca y una blusa azul. Le gusta más la azul. Cuesta treinta dólares. Luego mira las faldas. Encuentra una falda negra en su talla. Se la prueba en el probador. Le queda perfectamente. La falda cuesta cuarenta dólares. María también ve un bonito pañuelo en oferta. Está al cincuenta por ciento de descuento, así que cuesta solo diez dólares. Decide comprarlo también. Va a la caja y paga. El total es ochenta dólares. La asistente pone todo en una bolsa y dice "¡Gracias, que tengas un buen día!" María está feliz con su ropa nueva.`,
    questions: [
      { q: "¿Por qué María necesita ropa nueva?", options: ["Para una fiesta", "Para trabajar", "Para vacaciones"], answer: 1 },
      { q: "¿Cuándo va de compras?", options: ["Viernes", "Sábado", "Domingo"], answer: 1 },
      { q: "¿Qué color de blusa elige María?", options: ["Blanco", "Azul", "Rojo"], answer: 1 },
      { q: "¿Cuánto cuesta la blusa?", options: ["Veinte dólares", "Treinta dólares", "Cuarenta dólares"], answer: 1 },

      { q: "¿Dónde se prueba la falda?", options: ["En casa", "En el probador", "En la caja"], answer: 1 },

let stories = storiesEnglish;

const colorMap = {
  teal: { bg: "bg-teal-50", border: "border-teal-300", btn: "bg-teal-600 hover:bg-teal-700", header: "bg-teal-100 text-teal-800" },
  orange: { bg: "bg-orange-50", border: "border-orange-300", btn: "bg-orange-600 hover:bg-orange-700", header: "bg-orange-100 text-orange-800" },
  blue: { bg: "bg-blue-50", border: "border-blue-300", btn: "bg-blue-600 hover:bg-blue-700", header: "bg-blue-100 text-blue-800" },
  yellow: { bg: "bg-yellow-50", border: "border-yellow-300", btn: "bg-yellow-600 hover:bg-yellow-700", header: "bg-yellow-100 text-yellow-800" },
  red: { bg: "bg-red-50", border: "border-red-300", btn: "bg-red-600 hover:bg-red-700", header: "bg-red-100 text-red-800" },
  purple: { bg: "bg-purple-50", border: "border-purple-300", btn: "bg-purple-600 hover:bg-purple-700", header: "bg-purple-100 text-purple-800" }
};

function renderStories() {
  const container = document.getElementById('stories-container');
  container.innerHTML = stories.map((story, si) => {
    const c = colorMap[story.color];
    return `
      <article id="story-${si}" class="rounded-2xl border-2 ${c.border} ${c.bg} overflow-hidden shadow-lg">
        <div class="${c.header} px-6 py-4">
          <h2 class="story-title text-2xl font-bold">${story.emoji} ${story.title}</h2>
        </div>
        <div class="px-6 py-5">
          <p class="text-gray-800 text-lg leading-relaxed mb-6">${story.text}</p>
          <div class="border-t border-gray-200 pt-5">
            <h3 class="font-bold text-lg text-gray-700 mb-4">${currentLanguage === 'en' ? '📝 Comprehension Questions' : '📝 Preguntas de Comprensión'}</h3>
            <div class="space-y-4" id="questions-${si}">
              ${story.questions.map((q, qi) => `
                <div class="p-4 bg-white rounded-xl shadow-sm" id="q-${si}-${qi}">
                  <p class="font-semibold text-gray-800 mb-2">${qi + 1}. ${q.q}</p>
                  <div class="flex flex-col gap-2">
                    ${q.options.map((opt, oi) => `
                      <button onclick="checkAnswer(${si},${qi},${oi})" class="answer-btn-${si}-${qi} text-left px-4 py-2 rounded-lg border border-gray-200 hover:border-gray-400 hover:bg-gray-50 transition text-gray-700">${String.fromCharCode(65 + oi)}. ${opt}</button>
                    `).join('')}
                  </div>
                  <p class="mt-2 text-sm font-semibold hidden" id="feedback-${si}-${qi}"></p>
                </div>
              `).join('')}
            </div>
            <div class="mt-4 p-3 bg-white rounded-xl text-center hidden" id="score-${si}">
              <p class="font-bold text-lg" id="score-text-${si}"></p>
            </div>
          </div>
        </div>
      </article>`;
  }).join('');
}

const answers = {};
function checkAnswer(si, qi, oi) {
  const key = `${si}-${qi}`;
  if (answers[key] !== undefined) return;
  answers[key] = oi;
  const correct = stories[si].questions[qi].answer;
  const btns = document.querySelectorAll(`.answer-btn-${si}-${qi}`);
  btns.forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('hover:border-gray-400', 'hover:bg-gray-50');
    if (i === correct) { btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800'); }
    else if (i === oi && oi !== correct) { btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800'); }
  });
  const fb = document.getElementById(`feedback-${si}-${qi}`);
  fb.classList.remove('hidden');
  fb.textContent = oi === correct ? "✅ Correct!" : "❌ Not quite. The correct answer is highlighted.";
  fb.className = fb.className.replace('hidden', '') + (oi === correct ? ' text-green-600' : ' text-red-600');

  // Check if all questions answered
  const total = stories[si].questions.length;
  let answered = 0, correctCount = 0;
  for (let i = 0; i < total; i++) {
    if (answers[`${si}-${i}`] !== undefined) { answered++; if (answers[`${si}-${i}`] === stories[si].questions[i].answer) correctCount++; }
  }
  if (answered === total) {
    const scoreDiv = document.getElementById(`score-${si}`);
    scoreDiv.classList.remove('hidden');
    document.getElementById(`score-text-${si}`).textContent = `🎉 You got ${correctCount} out of ${total} correct!`;
  }
}

function scrollToStory(i) { document.getElementById(`story-${i}`).scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function toggleLanguage() {
  currentLanguage = currentLanguage === 'en' ? 'es' : 'en';
  stories = currentLanguage === 'en' ? storiesEnglish : storiesSpanish;
  answers = {}; // Reset answers when switching languages
  const toggle = document.getElementById('lang-toggle');
  const dot = document.getElementById('toggle-dot');
  
  if (currentLanguage === 'es') {
    toggle.style.backgroundColor = '#2563eb';
    dot.style.marginLeft = '1.25rem';
  } else {
    toggle.style.backgroundColor = '#d1d5db';
    dot.style.marginLeft = '0.125rem';
  }
  
  renderStories();
  lucide.createIcons();
}

renderStories();

// Element SDK
const defaultConfig = {
  page_title: "ESL Reading Practice",
  background_color: "#fffbeb",
  header_color: "#0f766e",
  text_color: "#1f2937",
  primary_action_color: "#0d9488",
  surface_color: "#ffffff",
  font_family: "Source Sans 3",
  font_size: 16
};

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const title = config.page_title || defaultConfig.page_title;
    document.getElementById('page-title').textContent = title;
    document.querySelector('header').style.backgroundColor = config.header_color || defaultConfig.header_color;
    document.querySelector('footer').style.backgroundColor = config.header_color || defaultConfig.header_color;
    document.getElementById('app').style.backgroundColor = config.background_color || defaultConfig.background_color;
    const font = config.font_family || defaultConfig.font_family;
    document.body.style.fontFamily = `${font}, Source Sans 3, sans-serif`;
    const size = config.font_size || defaultConfig.font_size;
    document.querySelectorAll('article p').forEach(p => p.style.fontSize = `${size}px`);
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.header_color || defaultConfig.header_color, set: (v) => { config.header_color = v; window.elementSdk.setConfig({ header_color: v }); } },
      { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["page_title", config.page_title || defaultConfig.page_title]
  ])
});

lucide.createIcons();
</script>
