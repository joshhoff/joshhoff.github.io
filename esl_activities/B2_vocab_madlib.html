  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100%;
      width: 100%;
    }

    * {
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      min-height: 100%;
      padding: 3% 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 3%;
    }

    .header h1 {
      font-size: 2.5em;
      margin: 0 0 0.3em 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.2em;
      margin: 0;
      opacity: 0.95;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 4%;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .story-select {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5%;
      margin-top: 3%;
    }

    .story-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 4% 3%;
      border-radius: 12px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Georgia', serif;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .story-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .story-button:active {
      transform: translateY(0);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .story-title {
      color: #667eea;
      font-size: 1.8em;
      margin: 0 0 1.5em 0;
      text-align: center;
    }

    .input-group {
      margin-bottom: 4%;
    }

    .input-group label {
      display: block;
      color: #333;
      font-weight: bold;
      margin-bottom: 2%;
      font-size: 1.1em;
    }

    .word-hint {
      display: block;
      color: #666;
      font-size: 0.9em;
      font-style: italic;
      margin-top: 1%;
    }

    .input-group input {
      width: 100%;
      padding: 3%;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      font-family: 'Georgia', serif;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 3%;
      margin-top: 5%;
    }

    .btn {
      flex: 1;
      padding: 4%;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      font-family: 'Georgia', serif;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .result-section {
      display: none;
    }

    .result-section.active {
      display: block;
    }

    .story-result {
      background: #f9f9f9;
      padding: 5%;
      border-radius: 12px;
      line-height: 1.8;
      font-size: 1.15em;
      color: #333;
      margin-bottom: 5%;
    }

    .user-word {
      color: #667eea;
      font-weight: bold;
      text-decoration: underline;
    }

    .home-section {
      display: none;
    }

    .home-section.active {
      display: block;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2em;
      }

      .header p {
        font-size: 1em;
      }

      .story-select {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>

        container.appendChild(button);
      });

      form.innerHTML = '';

        hint.className = 'word-hint';

        }

      }
      return true;
