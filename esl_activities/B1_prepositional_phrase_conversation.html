      { speaker: "Customer", text: "How much does it come to?", phrase: "come to" },
      { speaker: "Staff", text: "That comes to £35.99. Come back next week for a special pet care offer!", phrase: "come back" }
    ]
  }
};

let currentScenario = 'restaurant';
let shuffledLines = [];
let draggedIdx = null;
let attempts = 0;
let solved = 0;

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  // Ensure it's not already in order
  if (JSON.stringify(a.map(x=>x.text)) === JSON.stringify(scenarios[currentScenario].lines.map(x=>x.text))) return shuffle(arr);
  return a;
}

function loadScenario(name) {
  currentScenario = name;
  document.querySelectorAll('.scenario-btn').forEach(b => {
    b.classList.toggle('bg-orange-500', b.dataset.scenario === name);
    b.classList.toggle('text-white', b.dataset.scenario === name);
    b.classList.toggle('bg-white', b.dataset.scenario !== name);
    b.classList.toggle('text-orange-800', b.dataset.scenario !== name);
    b.classList.toggle('border', b.dataset.scenario !== name);
    b.classList.toggle('border-orange-300', b.dataset.scenario !== name);
  });
  shuffledLines = shuffle(scenarios[name].lines);
  renderLines();
  document.getElementById('feedback').classList.add('hidden');
}

function renderLines() {
  const zone = document.getElementById('drop-zone');
  zone.innerHTML = '';
  shuffledLines.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'bg-white border-2 border-orange-200 rounded-xl p-4 cursor-grab active:cursor-grabbing shadow-sm hover:shadow-md transition-all flex items-start gap-3 pop';
    div.draggable = true;
    div.dataset.index = i;
    div.innerHTML = `
      <span class="flex-shrink-0 w-8 h-8 rounded-full bg-orange-100 text-orange-700 font-800 flex items-center justify-center text-sm">${i+1}</span>
      <div class="flex-1">
        <span class="text-xs font-700 text-orange-500 uppercase tracking-wide">${line.speaker}</span>
        <p class="text-orange-950 font-600 text-sm md:text-base mt-0.5">"${line.text}"</p>
        <span class="phrase-tag mt-1 inline-block" onclick="showDefinition('${line.phrase}')">${line.phrase}</span>
      </div>
      <span class="flex-shrink-0 text-orange-300"><i data-lucide="grip-vertical" style="width:20px;height:20px"></i></span>
    `;
    div.addEventListener('dragstart', e => { draggedIdx = i; div.style.opacity = '0.5'; });
    div.addEventListener('dragend', e => { div.style.opacity = '1'; });
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', e => { div.classList.remove('drag-over'); });
    div.addEventListener('drop', e => {
      e.preventDefault(); div.classList.remove('drag-over');
      if (draggedIdx !== null && draggedIdx !== i) {
        const item = shuffledLines.splice(draggedIdx, 1)[0];
        shuffledLines.splice(i, 0, item);
        renderLines();
      }
    });
    // Touch support
    div.addEventListener('touchstart', e => { draggedIdx = i; div.style.opacity = '0.7'; });
    div.addEventListener('touchend', e => { div.style.opacity = '1'; });
    zone.appendChild(div);
  });
  lucide.createIcons();
}

function checkOrder() {
  const correct = scenarios[currentScenario].lines;
  const cards = document.getElementById('drop-zone').children;
  let allCorrect = true;
  for (let i = 0; i < shuffledLines.length; i++) {
    if (shuffledLines[i].text === correct[i].text) {
      cards[i].classList.add('correct');
      cards[i].classList.remove('incorrect');
    } else {
      cards[i].classList.add('incorrect');
      cards[i].classList.remove('correct');
      allCorrect = false;
    }
  }
  attempts++;
  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  if (allCorrect) {
    solved++;
    fb.textContent = '🎉 Perfect! You got it right!';
    fb.className = 'text-center mt-4 font-700 text-lg text-emerald-600';
  } else {
    fb.textContent = 'Almost! The red ones are in the wrong place. Try again!';
    fb.className = 'text-center mt-4 font-700 text-lg text-rose-600';
  }
  document.getElementById('score').textContent = `Score: ${solved}/${attempts} correct`;
}

function resetCurrent() {
  shuffledLines = shuffle(scenarios[currentScenario].lines);
  renderLines();
  document.getElementById('feedback').classList.add('hidden');
}

function showDefinition(phrase) {
  const def = phraseDefinitions[phrase];
  if (!def) return;
  document.getElementById('def-phrase').textContent = phrase;
  document.getElementById('def-en').textContent = def.en;
  document.getElementById('def-es').textContent = def.es;
  document.getElementById('def-de').textContent = def.de;
  document.getElementById('definition-modal').classList.add('active');
}

function closeDefinition() {
  document.getElementById('definition-modal').classList.remove('active');
}

      { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: v => { config.primary_action_color = v; window.elementSdk.setConfig({primary_action_color: v}); }},

  }),

    ["main_title", config.main_title || defaultConfig.main_title],
    ["instructions_text", config.instructions_text || defaultConfig.instructions_text]
  ])
});

loadScenario('restaurant');
lucide.createIcons();
