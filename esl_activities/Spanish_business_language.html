<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Business Language Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
    }
    header {
      background: #003366;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      padding: 1.5rem;
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }
    h2 {
      margin-top: 0;
    }
    button {
      padding: 0.5rem 1rem;
      background: #0055aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #003f7d;
    }
    .prompt-box {
      margin-top: 1rem;
      font-size: 1.1rem;
    }
    .term {
      font-weight: bold;
      color: #0055aa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Spanish Business Language Practice</h1>
  </header>

  <main>
    <div class="card">
      <h2>Practice Vocabulary</h2>
      <p>Click below to practice common business verbs, terms, and phrases in Spanish.</p>
      <button onclick="generateTerm()">Generate Term</button>
      <div id="termDisplay" class="prompt-box"></div>
    </div>

    <div class="card">
      <h2>Conversation Prompts</h2>
      <p>Use these prompts to practice speaking or writing in mock business situations.</p>
      <button onclick="generatePrompt()">Generate Prompt</button>
      <div id="promptDisplay" class="prompt-box"></div>
    </div>
  </main>

  <script>
    const terms = [
      { es: "Negociar", en: "To negotiate" },
      { es: "Enviar una propuesta", en: "To send a proposal" },
      { es: "Cerrar un trato", en: "To close a deal" },
      { es: "Hacer seguimiento", en: "To follow up" },
      { es: "Revisar el informe", en: "To review the report" },
      { es: "Aumentar el presupuesto", en: "To increase the budget" },
      { es: "Reducir costos", en: "To reduce costs" },
      { es: "Programar una reunión", en: "To schedule a meeting" },
      { es: "Firmar el contrato", en: "To sign the contract" },
      { es: "Analizar los datos", en: "To analyze the data" }
    ];

    const prompts = [
      "Describe una situación en la que tuviste que negociar con un cliente difícil.",
      "Explica cómo presentarías una propuesta importante a tu equipo o a tus superiores.",
      "Imagina que necesitas programar una reunión urgente. ¿Qué dirías en un correo?",
      "Cuenta cómo analizarías los datos financieros de un trimestre.",
      "Da un ejemplo de cómo harías seguimiento después de una reunión de ventas.",
      "Explica cómo comunicarías la necesidad de reducir costos en tu departamento.",
      "Imagina que acabas de firmar un contrato grande. ¿Cómo se lo comunicarías a tu equipo?",
      "Describe cómo manejarías un conflicto entre dos miembros de tu equipo.",
      "Explica cómo presentarías los resultados de un informe anual.",
      "Cuenta cómo prepararías una estrategia para cerrar un trato importante."
    ];

    function generateTerm() {
      const t = terms[Math.floor(Math.random() * terms.length)];
      document.getElementById('termDisplay').innerHTML = `
        <span class="term">${t.es}</span> — ${t.en}
      `;
    }

    function generatePrompt() {
      const p = prompts[Math.floor(Math.random() * prompts.length)];
      document.getElementById('promptDisplay').textContent = p;
    }
  </script>
</body>
</html>
