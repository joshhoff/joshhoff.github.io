  <script>
        const questions = [
            { q: "How much does Himeji Castle now charge non-residents for admission?", options: ["1,000 yen", "2,500 yen", "3,000 yen", "5,000 yen"], correct: 1 },
            { q: "By how much did ticket revenue change in the first month of two-tier pricing at Himeji?", options: ["Dropped 17%", "Stayed the same", "More than doubled", "Tripled"], correct: 2 },
            { q: "What is Japan's target for overseas visitors by the end of the decade?", options: ["42 million", "50 million", "60 million", "80 million"], correct: 2 },
            { q: "How much is Japan tripling the departure tax to?", options: ["1,000 yen", "2,000 yen", "3,000 yen", "5,000 yen"], correct: 2 },
            { q: "Which city is described as the 'overtourism poster child'?", options: ["Tokyo", "Osaka", "Kyoto", "Himeji"], correct: 2 },
            { q: "By how much did the Japan Tourism Agency increase its budget?", options: ["100%", "300%", "500%", "More than 700%"], correct: 3 }
        ];

        let current = 0, score = 0, answered = false;

        function renderQuestion() {
            answered = false;
            const q = questions[current];
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="fade-in">
                    <p class="text-sm text-gray-500 mb-2">Question ${current + 1} of ${questions.length}</p>
                    <h2 class="text-xl font-bold text-gray-900 mb-6">${q.q}</h2>
                    <div class="space-y-3">
                        ${q.options.map((opt, i) => `<button class="answer-btn w-full text-left p-4 border-2 border-gray-200 rounded-lg font-medium text-gray-800 bg-white" onclick="selectAnswer(${i})">${opt}</button>`).join('')}
                    </div>
                </div>
            `;
            document.getElementById('progress-fill').style.width = `${(current / questions.length) * 100}%`;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;
            const buttons = document.querySelectorAll('.answer-btn');
            const q = questions[current];
            if (idx === q.correct) score++;
            buttons[q.correct].classList.add('correct');
            if (idx !== q.correct) buttons[idx].classList.add('incorrect');
            setTimeout(() => {
                current++;
                if (current < questions.length) renderQuestion();
                else showResults();
            }, 1000);
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('score-text').textContent = `You scored ${score} out of ${questions.length}`;
            document.getElementById('result-screen').classList.remove('hidden');
        }

        function restartQuiz() {
            current = 0; score = 0;
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            renderQuestion();
        }

        renderQuestion();
    </script>
