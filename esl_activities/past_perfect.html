<script>
  function updateSentence() {
    const subject = document.getElementById('subject').value;
    const connector = document.getElementById('connector').value;
    const reasonLeft = parseFloat(document.getElementById('reason-marker').style.left);
    const eventLeft = parseFloat(document.getElementById('event-marker').style.left);

    let subjectLower = subject === "I" ? "I" : subject.toLowerCase();
    let sentence;

    // Determine which event happens first based on their positions
    const reasonFirst = reasonLeft < eventLeft;

    if (connector === "before" || connector === "because" || connector === "as soon as") {
      if (reasonFirst) {
        sentence = `${subject} ${currentReason} ${connector} ${subjectLower} had ${currentEvent}.`;
      } else {
        sentence = `${subject} ${currentEvent} ${connector} ${subjectLower} had ${currentReason}.`;
      }
    } else {
      if (reasonFirst) {
        sentence = `${subject} had ${currentReason} ${connector} ${subjectLower} ${currentEvent}.`;
      } else {
        sentence = `${subject} had ${currentEvent} ${connector} ${subjectLower} ${currentReason}.`;
      }
    }

    document.getElementById('final-sentence').textContent = sentence;
  }
</script>
