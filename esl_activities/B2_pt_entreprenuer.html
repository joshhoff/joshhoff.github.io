 <body data-template-id="__page-root" class="min-h-screen w-full">
  <header class="w-full border-b border-teal-200">
   <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
    <h1 data-template-id="app-title" class="canva-text text-2xl font-bold"></h1><button id="lang-toggle" class="flex items-center gap-2 px-4 py-2 rounded-full bg-teal-700 text-white font-medium text-sm hover:bg-teal-800 transition"> <i data-lucide="languages" style="width:18px;height:18px"></i> <span id="lang-label">Switch to PT</span> </button>
   </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-6">
   <nav class="flex gap-6 border-b border-gray-200 mb-6" role="tablist"><button class="tab-btn tab-active pb-2 font-medium" data-tab="vocab">Vocabulary</button> <button class="tab-btn pb-2 font-medium text-gray-500" data-tab="written">Written Practice</button> <button class="tab-btn pb-2 font-medium text-gray-500" data-tab="convo">Conversation</button>
   </nav><!-- Vocabulary Tab -->
   <section id="tab-vocab" class="tab-panel">
    <p data-template-id="vocab-subtitle" class="canva-text text-gray-600 mb-4"></p>
    <div id="vocab-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
   </section><!-- Written Practice Tab -->
   <section id="tab-written" class="tab-panel hidden">
    <p data-template-id="written-subtitle" class="canva-text text-gray-600 mb-4"></p>
    <div id="exercise-area" class="space-y-4"></div>
    <div class="mt-4 flex items-center gap-4"><button id="check-btn" class="px-5 py-2 bg-teal-700 text-white rounded-lg font-medium hover:bg-teal-800 transition">Check Answers</button> <button id="new-exercise-btn" class="px-5 py-2 border border-teal-700 text-teal-700 rounded-lg font-medium hover:bg-teal-50 transition">New Set</button> <span id="score-display" class="text-sm text-gray-600"></span>
    </div>
   </section><!-- Conversation Tab -->
   <section id="tab-convo" class="tab-panel hidden">
    <p data-template-id="convo-subtitle" class="canva-text text-gray-600 mb-4"></p>
    <div id="prompt-card" class="bg-white border border-teal-200 rounded-xl p-6 shadow-sm card-enter">
     <p id="prompt-text" class="text-lg leading-relaxed text-gray-800"></p>
    </div><button id="next-prompt-btn" class="mt-4 px-5 py-2 bg-teal-700 text-white rounded-lg font-medium hover:bg-teal-800 transition flex items-center gap-2"> <i data-lucide="shuffle" style="width:16px;height:16px"></i> Next Prompt </button>
   </section>
  </main>
  <script src="/_sdk/571d88ca352bbccf.editing_sdk.js" integrity="sha512-jpVzCgOJfgU8ETK2cVi9ukdjrZIqXjCspYqy9afx1TyeJ4jZxisBmh2SIlonXgbaxCv9M5yrk3WY4wZKWDC3Ig=="></script>
  <script>
        const vocab = [
            { en: "to scale up", pt: "escalar", def_en: "To increase the size or scope of a business", def_pt: "Aumentar o tamanho ou alcance de um negócio" },
            { en: "to break even", pt: "atingir o ponto de equilíbrio", def_en: "When revenue equals costs", def_pt: "Quando a receita iguala os custos" },
            { en: "cash flow", pt: "fluxo de caixa", def_en: "The movement of money in and out of a business", def_pt: "O movimento de dinheiro dentro e fora de um negócio" },
            { en: "to pitch", pt: "apresentar uma proposta", def_en: "To present a business idea to investors", def_pt: "Apresentar uma ideia de negócio a investidores" },
            { en: "startup", pt: "empresa iniciante", def_en: "A newly established business", def_pt: "Um negócio recém-estabelecido" },
            { en: "to take off", pt: "decolar", def_en: "When a business starts to succeed rapidly", def_pt: "Quando um negócio começa a ter sucesso rapidamente" },
            { en: "venture capital", pt: "capital de risco", def_en: "Money invested in high-risk startups", def_pt: "Dinheiro investido em startups de alto risco" },
            { en: "to set up", pt: "estabelecer/montar", def_en: "To establish or start a business", def_pt: "Estabelecer ou iniciar um negócio" },
            { en: "profit margin", pt: "margem de lucro", def_en: "The percentage of revenue that is profit", def_pt: "A porcentagem da receita que é lucro" },
            { en: "to go under", pt: "falir", def_en: "When a business fails financially", def_pt: "Quando um negócio fracassa financeiramente" },
            { en: "to branch out", pt: "diversificar", def_en: "To expand into new areas", def_pt: "Expandir para novas áreas" },
            { en: "stakeholder", pt: "parte interessada", def_en: "A person with interest in a business", def_pt: "Uma pessoa com interesse em um negócio" },
            { en: "to cut back on", pt: "reduzir/cortar", def_en: "To reduce spending or resources", def_pt: "Reduzir gastos ou recursos" },
            { en: "ROI (return on investment)", pt: "retorno sobre investimento", def_en: "The gain relative to the cost of an investment", def_pt: "O ganho relativo ao custo de um investimento" },
            { en: "to come up with", pt: "ter uma ideia/criar", def_en: "To think of or produce an idea", def_pt: "Pensar em ou produzir uma ideia" },
            { en: "to carry out", pt: "executar/realizar", def_en: "To complete or accomplish a plan", def_pt: "Completar ou realizar um plano" },
            { en: "turnover", pt: "faturamento", def_en: "Total revenue of a business", def_pt: "Receita total de um negócio" },
            { en: "to draw up", pt: "elaborar/redigir", def_en: "To prepare a document or plan", def_pt: "Preparar um documento ou plano" },
            { en: "to look into", pt: "investigar/analisar", def_en: "To research or examine something", def_pt: "Pesquisar ou examinar algo" },
            { en: "bottom line", pt: "resultado final", def_en: "The final profit or loss", def_pt: "O lucro ou prejuízo final" },
            { en: "to lay off", pt: "demitir", def_en: "To dismiss employees due to downsizing", def_pt: "Dispensar funcionários por corte de pessoal" },
            { en: "to buy out", pt: "adquirir/comprar", def_en: "To purchase someone's share in a business", def_pt: "Comprar a parte de alguém em um negócio" },
            { en: "overheads", pt: "custos fixos", def_en: "Ongoing business expenses not tied to production", def_pt: "Despesas contínuas não ligadas à produção" },
            { en: "to fall through", pt: "fracassar/não se concretizar", def_en: "When a deal or plan fails", def_pt: "Quando um acordo ou plano falha" }
        ];

        const prompts = {
            en: [
                "Describe a time you had to pitch an idea. What strategies did you use to be persuasive?",
                "What are the biggest challenges a startup faces when trying to scale up?",
                "If you were given venture capital, what business would you set up and why?",
                "Discuss the pros and cons of branching out into a new market.",
                "How can a company cut back on overheads without laying off employees?",
                "What does a healthy cash flow look like, and why is it important?",
                "Have you ever seen a deal fall through? What happened?",
                "What factors should an entrepreneur look into before launching a product?",
                "How do you calculate ROI, and why does it matter to stakeholders?",
                "Tell me about a business that took off unexpectedly. What contributed to its success?"
            ],
            pt: [
                "Descreva uma ocasião em que você precisou apresentar uma proposta. Que estratégias usou para ser persuasivo?",
                "Quais são os maiores desafios que uma empresa iniciante enfrenta ao tentar escalar?",
                "Se você recebesse capital de risco, que negócio montaria e por quê?",
                "Discuta os prós e contras de diversificar para um novo mercado.",
                "Como uma empresa pode reduzir custos fixos sem demitir funcionários?",
                "Como é um fluxo de caixa saudável e por que ele é importante?",
                "Você já viu um acordo fracassar? O que aconteceu?",
                "Que fatores um empreendedor deve investigar antes de lançar um produto?",
                "Como se calcula o retorno sobre investimento e por que isso importa para as partes interessadas?",
                "Fale sobre um negócio que decolou inesperadamente. O que contribuiu para seu sucesso?"
            ]
        };

        let lang = 'en';
        let currentPromptIdx = 0;
        let exerciseSet = [];

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('tab-active'); b.classList.add('text-gray-500'); });
                btn.classList.add('tab-active'); btn.classList.remove('text-gray-500');
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
                document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
            });
        });

        // Language toggle
        document.getElementById('lang-toggle').addEventListener('click', () => {
            lang = lang === 'en' ? 'pt' : 'en';
            document.getElementById('lang-label').textContent = lang === 'en' ? 'Switch to PT' : 'Switch to EN';
            renderVocab();
            renderPrompt();
            generateExercises();
        });

        // Render vocab
        function renderVocab() {
            const grid = document.getElementById('vocab-grid');
            grid.innerHTML = '';
            vocab.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 rounded-lg p-3 card-enter';
                card.style.animationDelay = (i * 20) + 'ms';
                card.innerHTML = `<p class="font-semibold text-teal-800">${lang === 'en' ? item.en : item.pt}</p><p class="text-sm text-gray-500 mt-1">${lang === 'en' ? item.pt : item.en}</p><p class="text-xs text-gray-400 mt-1">${lang === 'en' ? item.def_en : item.def_pt}</p>`;
                grid.appendChild(card);
            });
        }

        // Exercises
        function generateExercises() {
            const area = document.getElementById('exercise-area');
            area.innerHTML = '';
            document.getElementById('score-display').textContent = '';
            const shuffled = [...vocab].sort(() => Math.random() - 0.5).slice(0, 5);
            exerciseSet = shuffled;
            shuffled.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white border border-gray-200 rounded-lg p-4';
                const sentence = lang === 'en' ? item.def_en : item.def_pt;
                const answer = lang === 'en' ? item.en : item.pt;
                div.innerHTML = `<p class="text-gray-700 mb-2"><span class="font-medium text-teal-700">${i+1}.</span> ${sentence}</p><p class="text-xs text-gray-400 mb-2">Translation hint: <em>${lang === 'en' ? item.pt : item.en}</em></p><input type="text" data-answer="${answer}" class="exercise-input w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-teal-500" placeholder="Type the term..."><p class="feedback text-sm mt-1"></p>`;
                area.appendChild(div);
            });
        }

        document.getElementById('check-btn').addEventListener('click', (e) => {
            e.preventDefault();
            const inputs = document.querySelectorAll('.exercise-input');
            let correct = 0;
            inputs.forEach(input => {
                const answer = input.dataset.answer.toLowerCase().trim();
                const value = input.value.toLowerCase().trim();
                const fb = input.nextElementSibling;
                if (value === answer) { fb.textContent = '✓ Correct!'; fb.className = 'feedback text-sm mt-1 text-green-600 font-medium'; correct++; }
                else { fb.textContent = `✗ Answer: ${input.dataset.answer}`; fb.className = 'feedback text-sm mt-1 text-red-600'; }
            });
            document.getElementById('score-display').textContent = `Score: ${correct}/${inputs.length}`;
        });

        document.getElementById('new-exercise-btn').addEventListener('click', generateExercises);

        // Conversation
        function renderPrompt() {
            const list = prompts[lang];
            currentPromptIdx = currentPromptIdx % list.length;
            const card = document.getElementById('prompt-card');
            card.classList.remove('card-enter');
            void card.offsetWidth;
            card.classList.add('card-enter');
            document.getElementById('prompt-text').textContent = list[currentPromptIdx];
        }

        document.getElementById('next-prompt-btn').addEventListener('click', () => {
            currentPromptIdx = (currentPromptIdx + 1) % prompts[lang].length;
            renderPrompt();
        });

        // Init
        renderVocab();
        renderPrompt();
        generateExercises();
        lucide.createIcons();
    </script>
 </body>
</html>
