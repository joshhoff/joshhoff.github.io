<!doctype html>
<html lang="en">
 <head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C1 Connecting Words Practice</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Fraunces:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Fraunces', serif; }
        .tab-active { border-bottom: 3px solid #1e3a5f; color: #1e3a5f; font-weight: 700; }
        .family-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .family-content.open { max-height: 600px; }
        .correct { background: #d1fae5 !important; border-color: #10b981 !important; }
        .incorrect { background: #fee2e2 !important; border-color: #ef4444 !important; }
    </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="min-h-screen w-full">
  <header class="relative overflow-hidden"><img data-template-id="hero-image" class="canva-image w-full h-48 object-cover opacity-40" loading="lazy">
   <div class="absolute inset-0 flex items-center justify-center">
    <h1 data-template-id="page-title" class="canva-text text-center drop-shadow-lg"></h1>
   </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-6">
   <nav class="flex gap-6 border-b border-gray-200 mb-6" role="tablist"><button class="tab-btn tab-active pb-2 px-1" data-tab="families" role="tab" aria-selected="true"> <span data-template-id="tab-families" class="canva-text"></span> </button> <button class="tab-btn pb-2 px-1" data-tab="written" role="tab" aria-selected="false"> <span data-template-id="tab-written" class="canva-text"></span> </button> <button class="tab-btn pb-2 px-1" data-tab="conversation" role="tab" aria-selected="false"> <span data-template-id="tab-conversation" class="canva-text"></span> </button>
   </nav><!-- Word Families -->
   <section id="panel-families" role="tabpanel">
    <p data-template-id="families-intro" class="canva-text mb-4"></p>
    <div id="families-container" class="space-y-3"></div>
   </section><!-- Written Practice -->
   <section id="panel-written" class="hidden" role="tabpanel">
    <p data-template-id="written-intro" class="canva-text mb-4"></p>
    <div id="exercises-container" class="space-y-4"></div><button id="check-btn" class="mt-6 px-6 py-2 rounded-lg font-semibold transition" data-template-id="check-button"></button>
    <div id="score-display" class="mt-3 font-semibold hidden"></div>
   </section><!-- Conversation Prompts -->
   <section id="panel-conversation" class="hidden" role="tabpanel">
    <p data-template-id="convo-intro" class="canva-text mb-4"></p>
    <div id="convo-container" class="space-y-4"></div>
   </section>
  </main>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        const wordFamilies = [
            { name: "Addition & Emphasis", words: ["furthermore", "moreover", "in addition", "what is more", "not only… but also", "on top of that", "besides"] },
            { name: "Contrast & Concession", words: ["nevertheless", "nonetheless", "notwithstanding", "whereas", "albeit", "even so", "be that as it may"] },
            { name: "Cause & Effect", words: ["consequently", "as a result", "thereby", "hence", "thus", "owing to", "on account of"] },
            { name: "Condition & Supposition", words: ["provided that", "on condition that", "assuming that", "were it not for", "supposing", "unless"] },
            { name: "Time & Sequence", words: ["subsequently", "henceforth", "in the meantime", "prior to", "no sooner… than", "by the time"] },
            { name: "Purpose & Result", words: ["so as to", "with a view to", "in order that", "lest", "for the purpose of", "to that end"] }
        ];

        const exercises = [
            { sentence: "The project was delayed; ___, the budget had to be revised.", answer: "consequently", options: ["consequently", "albeit", "provided that"] },
            { sentence: "___ the rain, the event proceeded as planned.", answer: "Notwithstanding", options: ["Notwithstanding", "Hence", "Subsequently"] },
            { sentence: "She studied intensely ___ pass the C1 exam on her first attempt.", answer: "so as to", options: ["so as to", "lest", "whereas"] },
            { sentence: "The report was thorough; ___, it failed to address cost concerns.", answer: "nevertheless", options: ["nevertheless", "thereby", "furthermore"] },
            { sentence: "___ we secure funding, the initiative will launch in September.", answer: "Provided that", options: ["Provided that", "Owing to", "Moreover"] },
            { sentence: "He completed the internship and ___ gained valuable experience.", answer: "thereby", options: ["thereby", "albeit", "lest"] }
        ];

        const conversations = [
            { prompt: "Discuss a time when a plan didn't work out but something positive came from it.", connectors: ["nevertheless", "even so", "as a result", "in the meantime"] },
            { prompt: "Debate whether remote work is more productive than office work.", connectors: ["whereas", "moreover", "on the other hand", "not only… but also"] },
            { prompt: "Explain a complex process at work or in your studies, step by step.", connectors: ["subsequently", "prior to", "thereby", "to that end"] },
            { prompt: "Argue for or against a controversial policy, addressing counterarguments.", connectors: ["albeit", "notwithstanding", "furthermore", "be that as it may"] }
        ];

        // Build families
        const familiesEl = document.getElementById('families-container');
        wordFamilies.forEach((fam, i) => {
            const div = document.createElement('div');
            div.className = 'border border-gray-200 rounded-lg overflow-hidden';
            div.innerHTML = `
                <button class="w-full flex justify-between items-center p-4 text-left font-semibold text-lg hover:bg-gray-50 transition" aria-expanded="false">
                    <span>${fam.name}</span><i data-lucide="chevron-down" style="width:20px;height:20px"></i>
                </button>
                <div class="family-content px-4 pb-0">
                    <div class="flex flex-wrap gap-2 pb-4">${fam.words.map(w => `<span class="inline-block px-3 py-1 rounded-full text-sm" style="background:#e8f0fe;color:#1e3a5f">${w}</span>`).join('')}</div>
                </div>`;
            div.querySelector('button').addEventListener('click', function() {
                const content = this.nextElementSibling;
                const open = content.classList.toggle('open');
                this.setAttribute('aria-expanded', open);
            });
            familiesEl.appendChild(div);
        });

        // Build exercises
        const exEl = document.getElementById('exercises-container');
        exercises.forEach((ex, i) => {
            const parts = ex.sentence.split('___');
            const div = document.createElement('div');
            div.className = 'p-4 bg-white rounded-lg border border-gray-200';
            const shuffled = [...ex.options].sort(() => Math.random() - 0.5);
            div.innerHTML = `<p class="text-gray-800">${parts[0]}<select class="ex-select mx-1 px-2 py-1 border border-gray-300 rounded" data-answer="${ex.answer}"><option value="">…</option>${shuffled.map(o => `<option value="${o}">${o}</option>`).join('')}</select>${parts[1]}</p>`;
            exEl.appendChild(div);
        });

        document.getElementById('check-btn').addEventListener('click', () => {
            let correct = 0;
            document.querySelectorAll('.ex-select').forEach(sel => {
                sel.classList.remove('correct', 'incorrect');
                if (sel.value === sel.dataset.answer) { sel.classList.add('correct'); correct++; }
                else { sel.classList.add('incorrect'); }
            });
            const scoreEl = document.getElementById('score-display');
            scoreEl.textContent = `Score: ${correct}/${exercises.length}`;
            scoreEl.classList.remove('hidden');
        });

        // Build conversation prompts
        const convoEl = document.getElementById('convo-container');
        conversations.forEach((c, i) => {
            const div = document.createElement('div');
            div.className = 'p-5 bg-white rounded-lg border border-gray-200';
            div.innerHTML = `
                <p class="text-gray-800 font-medium mb-3">${c.prompt}</p>
                <button class="text-sm font-semibold flex items-center gap-1" style="color:#1e3a5f" onclick="this.nextElementSibling.classList.toggle('hidden');"><i data-lucide="lightbulb" style="width:16px;height:16px"></i> Show suggested connectors</button>
                <div class="hidden mt-2 flex flex-wrap gap-2">${c.connectors.map(w => `<span class="inline-block px-3 py-1 rounded-full text-sm" style="background:#fef3c7;color:#92400e">${w}</span>`).join('')}</div>`;
            convoEl.appendChild(div);
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('tab-active'); b.setAttribute('aria-selected', 'false'); });
                btn.classList.add('tab-active');
                btn.setAttribute('aria-selected', 'true');
                document.querySelectorAll('[role="tabpanel"]').forEach(p => p.classList.add('hidden'));
                document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
            });
        });

        lucide.createIcons();
    </script>

</html>
