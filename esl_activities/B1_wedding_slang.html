<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESL Flashcard Practice</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    .card-container { perspective: 1200px; }
    .card-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      backface-visibility: hidden;
      position: absolute;
      inset: 0;
      border-radius: 1.25rem;
    }
    .card-back { transform: rotateY(180deg); }
    .progress-dot {
      transition: all 0.3s ease;
    }
    .progress-dot.active {
      transform: scale(1.4);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-slide-up { animation: slideUp 0.5s ease forwards; }
    .shake {
      animation: shake 0.5s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .btn-nav:active { transform: scale(0.92); }
    .score-pop { animation: scorePop 0.4s ease; }
    @keyframes scorePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); font-family: 'Nunito', sans-serif;"><!-- Header -->
   <header class="text-center pt-6 pb-2 px-4">
    <h1 id="appTitle" style="font-family: 'DM Serif Display', serif; color: #e2b04a; font-size: 28px;" class="tracking-wide">ESL Flashcard Practice</h1>
    <p style="color: #8892b0; font-size: 14px;" class="mt-1">Tap the card to reveal the meaning</p>
   </header><!-- Score -->
   <div class="flex justify-center gap-6 mt-2 mb-4">
    <div class="flex items-center gap-2" style="color: #64ffda;"><i data-lucide="check-circle" style="width:18px;height:18px;"></i> <span id="knownCount" class="font-bold text-lg">0</span>
    </div>
    <div class="flex items-center gap-2" style="color: #8892b0;"><span id="cardPosition" class="font-semibold text-sm">1 / 9</span>
    </div>
    <div class="flex items-center gap-2" style="color: #ff6b6b;"><i data-lucide="rotate-ccw" style="width:18px;height:18px;"></i> <span id="reviewCount" class="font-bold text-lg">0</span>
    </div>
   </div><!-- Card Area -->
   <main class="flex justify-center px-4">
    <div class="card-container w-full" style="max-width: 420px; height: 320px;">
     <div id="cardInner" class="card-inner w-full h-full cursor-pointer" onclick="flipCard()"><!-- Front -->
      <div class="card-front flex flex-col items-center justify-center p-8" style="background: linear-gradient(145deg, #1e2a4a, #253a5e); border: 2px solid #e2b04a30; box-shadow: 0 20px 60px rgba(0,0,0,0.4);">
       <div style="color: #e2b04a; font-size: 13px; letter-spacing: 2px;" class="uppercase font-bold mb-4">
        Word
       </div>
       <div id="wordFront" style="font-family: 'DM Serif Display', serif; color: #e6f1ff; font-size: 36px;" class="text-center leading-tight"></div>
       <div style="color: #4a5568; font-size: 12px;" class="mt-6 flex items-center gap-1"><i data-lucide="pointer" style="width:14px;height:14px;"></i> tap to flip
       </div>
      </div><!-- Back -->
      <div class="card-back flex flex-col items-start justify-center p-8 overflow-y-auto" style="background: linear-gradient(145deg, #2a1a3e, #1e2a4a); border: 2px solid #64ffda30; box-shadow: 0 20px 60px rgba(0,0,0,0.4);">
       <div style="color: #64ffda; font-size: 13px; letter-spacing: 2px;" class="uppercase font-bold mb-2">
        Definition
       </div>
       <div id="definition" style="color: #ccd6f6; font-size: 17px;" class="leading-relaxed mb-3"></div>
       <div style="color: #e2b04a; font-size: 13px; letter-spacing: 2px;" class="uppercase font-bold mb-2 mt-1">
        Example
       </div>
       <div id="example" style="color: #8892b0; font-size: 15px; font-style: italic;" class="leading-relaxed"></div>
      </div>
     </div>
    </div>
   </main><!-- Action Buttons -->
   <div id="actionButtons" class="flex justify-center gap-4 mt-6 px-4" style="display:none;"><button onclick="markCard('review')" class="btn-nav flex items-center gap-2 px-6 py-3 rounded-xl font-bold text-sm transition-all" style="background: #ff6b6b20; color: #ff6b6b; border: 1.5px solid #ff6b6b40;"> <i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i> Study Again </button> <button onclick="markCard('known')" class="btn-nav flex items-center gap-2 px-6 py-3 rounded-xl font-bold text-sm transition-all" style="background: #64ffda20; color: #64ffda; border: 1.5px solid #64ffda40;"> <i data-lucide="check" style="width:16px;height:16px;"></i> Got It! </button>
   </div><!-- Nav Buttons (when not flipped) -->
   <div id="navButtons" class="flex justify-center gap-4 mt-6 px-4"><button onclick="prevCard()" class="btn-nav px-5 py-3 rounded-xl font-bold text-sm transition-all" style="background: #ffffff08; color: #8892b0; border: 1.5px solid #ffffff10;"> <i data-lucide="chevron-left" style="width:20px;height:20px;"></i> </button> <button onclick="shuffleCards()" class="btn-nav px-5 py-3 rounded-xl font-bold text-sm transition-all flex items-center gap-2" style="background: #ffffff08; color: #8892b0; border: 1.5px solid #ffffff10;"> <i data-lucide="shuffle" style="width:16px;height:16px;"></i> Shuffle </button> <button onclick="nextCard()" class="btn-nav px-5 py-3 rounded-xl font-bold text-sm transition-all" style="background: #ffffff08; color: #8892b0; border: 1.5px solid #ffffff10;"> <i data-lucide="chevron-right" style="width:20px;height:20px;"></i> </button>
   </div><!-- Progress Dots -->
   <div id="progressDots" class="flex justify-center gap-2 mt-6 pb-6 flex-wrap px-4"></div><!-- Completion Screen -->
   <div id="completionScreen" style="display:none;" class="text-center px-6 py-10">
    <div style="font-size:60px;" class="mb-4">
     🎉
    </div>
    <h2 style="font-family:'DM Serif Display',serif; color:#e2b04a; font-size:28px;">Great Job!</h2>
    <p style="color:#8892b0;" class="mt-2 text-sm">You've reviewed all the cards</p>
    <div class="flex justify-center gap-8 mt-6">
     <div class="text-center">
      <div id="finalKnown" style="color:#64ffda; font-size:32px;" class="font-extrabold">
       0
      </div>
      <div style="color:#8892b0; font-size:12px;">
       Mastered
      </div>
     </div>
     <div class="text-center">
      <div id="finalReview" style="color:#ff6b6b; font-size:32px;" class="font-extrabold">
       0
      </div>
      <div style="color:#8892b0; font-size:12px;">
       To Review
      </div>
     </div>
    </div><button onclick="resetAll()" class="mt-8 px-8 py-3 rounded-xl font-bold transition-all" style="background:#e2b04a; color:#1a1a2e;"> Start Over </button>
   </div>
  </div>
  <script>
    const flashcards = [
      { word: "Elopement", definition: "The act of secretly running away to get married, usually without the knowledge or approval of family and friends.", example: "\"They decided on an elopement in Vegas instead of a big wedding.\"" },
      { word: "Blowout", definition: "A lavish, extravagant party or celebration. Can also mean a decisive, one-sided victory.", example: "\"Her 30th birthday blowout lasted until 3 AM!\"" },
      { word: "Bash", definition: "A large, lively party or celebration (informal).", example: "\"We're throwing a bash for the end of the semester — everyone's invited.\"" },
      { word: "On track", definition: "Making progress as expected; going according to plan.", example: "\"Don't worry, the project is on track to be finished by Friday.\"" },
      { word: "Decompress", definition: "To relax and relieve stress or tension after a period of hard work or pressure.", example: "\"After finals, I just need a weekend to decompress.\"" },
      { word: "Haunt", definition: "To continually appear in one's thoughts or memories, often in a disturbing way. Also: a place frequently visited.", example: "\"That embarrassing moment still haunts me to this day.\"" },
      { word: "Splurge", definition: "To spend a lot of money on something, especially as a treat or indulgence.", example: "\"I decided to splurge on a fancy dinner for our anniversary.\"" },
      { word: "Brooch", definition: "A decorative pin or clip worn on clothing, often made of precious metal and jewels.", example: "\"My grandmother left me a beautiful antique brooch.\"" },
      { word: "Fist pump", definition: "A gesture of triumph or excitement where a clenched fist is thrust into the air.", example: "\"He did a fist pump when he heard he got the job!\"" }
    ];

    let cards = [...flashcards];
    let currentIndex = 0;
    let isFlipped = false;
    let known = 0;
    let review = 0;
    let cardStatus = {};

    const defaultConfig = {
      app_title: "ESL Flashcard Practice",
      background_color: "#1a1a2e",
      surface_color: "#1e2a4a",
      text_color: "#e6f1ff",
      primary_action: "#e2b04a",
      secondary_action: "#64ffda",
      font_family: "DM Serif Display",
      font_size: 16
    };

    function renderCard() {
      const card = cards[currentIndex];
      document.getElementById('wordFront').textContent = card.word;
      document.getElementById('definition').textContent = card.definition;
      document.getElementById('example').textContent = card.example;
      document.getElementById('cardPosition').textContent = `${currentIndex + 1} / ${cards.length}`;
      document.getElementById('cardInner').classList.remove('flipped');
      isFlipped = false;
      document.getElementById('actionButtons').style.display = 'none';
      document.getElementById('navButtons').style.display = 'flex';
      renderDots();
    }

    function renderDots() {
      const container = document.getElementById('progressDots');
      container.innerHTML = '';
      cards.forEach((c, i) => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot rounded-full';
        const status = cardStatus[c.word];
        let bg = '#ffffff15';
        if (status === 'known') bg = '#64ffda';
        else if (status === 'review') bg = '#ff6b6b';
        if (i === currentIndex) dot.classList.add('active');
        dot.style.cssText = `width:10px;height:10px;background:${bg};cursor:pointer;`;
        dot.onclick = () => { currentIndex = i; renderCard(); };
        container.appendChild(dot);
      });
    }

    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
      document.getElementById('actionButtons').style.display = isFlipped ? 'flex' : 'none';
      document.getElementById('navButtons').style.display = isFlipped ? 'none' : 'flex';
      lucide.createIcons();
    }

    function markCard(status) {
      const word = cards[currentIndex].word;
      const prev = cardStatus[word];
      if (prev === 'known') known--;
      if (prev === 'review') review--;
      cardStatus[word] = status;
      if (status === 'known') known++;
      else review++;

      document.getElementById('knownCount').textContent = known;
      document.getElementById('knownCount').classList.add('score-pop');
      document.getElementById('reviewCount').textContent = review;
      document.getElementById('reviewCount').classList.add('score-pop');
      setTimeout(() => {
        document.getElementById('knownCount').classList.remove('score-pop');
        document.getElementById('reviewCount').classList.remove('score-pop');
      }, 400);

      if (known + review === cards.length) {
        setTimeout(showCompletion, 400);
        return;
      }

      if (currentIndex < cards.length - 1) {
        currentIndex++;
        renderCard();
      } else {
        // find next unmarked
        const next = cards.findIndex(c => !cardStatus[c.word]);
        if (next !== -1) { currentIndex = next; renderCard(); }
        else showCompletion();
      }
    }

    function showCompletion() {
      document.querySelector('main').style.display = 'none';
      document.getElementById('actionButtons').style.display = 'none';
      document.getElementById('navButtons').style.display = 'none';
      document.getElementById('progressDots').style.display = 'none';
      document.getElementById('completionScreen').style.display = 'block';
      document.getElementById('finalKnown').textContent = known;
      document.getElementById('finalReview').textContent = review;
    }

    function resetAll() {
      known = 0; review = 0; currentIndex = 0; cardStatus = {};
      document.getElementById('knownCount').textContent = 0;
      document.getElementById('reviewCount').textContent = 0;
      document.querySelector('main').style.display = 'flex';
      document.getElementById('navButtons').style.display = 'flex';
      document.getElementById('progressDots').style.display = 'flex';
      document.getElementById('completionScreen').style.display = 'none';
      renderCard();
    }

    function prevCard() {
      if (currentIndex > 0) { currentIndex--; renderCard(); }
    }
    function nextCard() {
      if (currentIndex < cards.length - 1) { currentIndex++; renderCard(); }
    }
    function shuffleCards() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    // Element SDK
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        const title = config.app_title || defaultConfig.app_title;
        const font = config.font_family || defaultConfig.font_family;
        const bg = config.background_color || defaultConfig.background_color;
        const surface = config.surface_color || defaultConfig.surface_color;
        const text = config.text_color || defaultConfig.text_color;
        const primary = config.primary_action || defaultConfig.primary_action;
        const secondary = config.secondary_action || defaultConfig.secondary_action;
        const baseSize = config.font_size || defaultConfig.font_size;

        document.getElementById('appTitle').textContent = title;
        document.getElementById('appTitle').style.fontFamily = `${font}, serif`;
        document.getElementById('appTitle').style.color = primary;
        document.getElementById('appTitle').style.fontSize = `${baseSize * 1.75}px`;

        document.getElementById('app').style.background = `linear-gradient(135deg, ${bg} 0%, ${surface} 100%)`;

        document.getElementById('wordFront').style.fontFamily = `${font}, serif`;
        document.getElementById('wordFront').style.color = text;
        document.getElementById('wordFront').style.fontSize = `${baseSize * 2.25}px`;

        document.getElementById('definition').style.fontSize = `${baseSize * 1.06}px`;
        document.getElementById('example').style.fontSize = `${baseSize * 0.94}px`;

        const front = document.querySelector('.card-front');
        if (front) { front.style.background = `linear-gradient(145deg, ${surface}, ${bg})`; front.style.borderColor = primary + '30'; }
        const back = document.querySelector('.card-back');
        if (back) { back.style.borderColor = secondary + '30'; }

        document.querySelectorAll('.card-front [style*="letter-spacing"]').forEach(el => el.style.color = primary);
        document.querySelectorAll('.card-back [style*="color: #64ffda"]').forEach(el => el.style.color = secondary);

        const knownEl = document.getElementById('knownCount');
        if (knownEl) knownEl.parentElement.style.color = secondary;
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => config.primary_action || defaultConfig.primary_action, set: (v) => { config.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); } },
          { get: () => config.secondary_action || defaultConfig.secondary_action, set: (v) => { config.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
      }),
      mapToEditPanelValues: (config) => new Map([
        ["app_title", config.app_title || defaultConfig.app_title]
      ])
    });

    renderCard();
    lucide.createIcons();
  </script>

</html>
