<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESL Speaking Practice</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    .card-glow { transition: all 0.3s ease; }
    .card-glow:hover { transform: translateY(-2px); }

    .vocab-chip { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 20px; 
      margin: 3px; 
      font-size: 0.85rem;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .vocab-chip:hover { transform: scale(1.05); }

    .prompt-bubble {
      position: relative;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      animation: fadeSlide 0.3s ease forwards;
      opacity: 0;
    }
    .prompt-bubble:nth-child(1) { animation-delay: 0.1s; }
    .prompt-bubble:nth-child(2) { animation-delay: 0.2s; }
    .prompt-bubble:nth-child(3) { animation-delay: 0.3s; }
    .prompt-bubble:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .section-tab {
      padding: 8px 16px;
      border-radius: 24px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      border: 2px solid transparent;
    }

    .polish-hint {
      font-style: italic;
      opacity: 0.8;
      font-size: 0.82rem;
    }

    .question-card {
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .question-card:hover { transform: translateY(-1px); }

    .expand-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .expand-content.open {
      max-height: 2000px;
    }

    .tip-box {
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .progress-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      transition: all 0.3s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .recording-pulse { animation: pulse 1.2s infinite; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background: #0f1729;">
   <!-- Header -->
   <header class="px-6 py-5 flex items-center justify-between" style="background: linear-gradient(135deg, #0f1729 0%, #1a2744 100%);">
    <div class="flex items-center gap-3">
     <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: #e85d4a;">
      <i data-lucide="mic" style="width:20px;height:20px;color:#fff;"></i>
     </div>
     <div>
      <h1 id="main-title" class="text-xl font-bold" style="color: #f0f4fc;">ESL Speaking Practice</h1>
      <p class="text-xs" style="color: #7b8db5;">Ćwiczenia mówienia po angielsku</p>
     </div>
    </div>
    <div class="flex items-center gap-2">
     <span id="encouragement" class="text-sm hidden sm:inline" style="color: #e85d4a;">You're doing great!</span>
     <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: #1e3054;">
      <span style="font-size: 18px;">🇵🇱</span>
     </div>
    </div>
   </header><!-- Section Tabs -->
   <div class="px-6 py-4 flex gap-2 overflow-x-auto" style="scrollbar-width: none;">
    <button class="section-tab" data-section="work" onclick="switchSection('work')" style="background: #e85d4a; color: #fff;"> <span class="flex items-center gap-1"><i data-lucide="briefcase" style="width:14px;height:14px;"></i> Work &amp; Education</span> </button> <button class="section-tab" data-section="community" onclick="switchSection('community')" style="background: #1e3054; color: #7b8db5;"> <span class="flex items-center gap-1"><i data-lucide="map-pin" style="width:14px;height:14px;"></i> Community</span> </button> <button class="section-tab" data-section="opinion" onclick="switchSection('opinion')" style="background: #1e3054; color: #7b8db5;"> <span class="flex items-center gap-1"><i data-lucide="message-circle" style="width:14px;height:14px;"></i> Opinion</span> </button> <button class="section-tab" data-section="leisure" onclick="switchSection('leisure')" style="background: #1e3054; color: #7b8db5;"> <span class="flex items-center gap-1"><i data-lucide="music" style="width:14px;height:14px;"></i> Leisure</span> </button> <button class="section-tab" data-section="health" onclick="switchSection('health')" style="background: #1e3054; color: #7b8db5;"> <span class="flex items-center gap-1"><i data-lucide="heart" style="width:14px;height:14px;"></i> Health</span> </button> <button class="section-tab" data-section="travel" onclick="switchSection('travel')" style="background: #1e3054; color: #7b8db5;"> <span class="flex items-center gap-1"><i data-lucide="globe" style="width:14px;height:14px;"></i> Travel</span> </button>
   </div><!-- Progress -->
   <div class="px-6 pb-3 flex items-center gap-2">
    <span class="text-xs" style="color: #7b8db5;">Progress:</span>
    <div class="flex gap-1" id="progress-dots"></div><span class="text-xs ml-auto" style="color: #7b8db5;" id="progress-text">0/7 practised</span>
   </div><!-- Questions Container -->
   <main class="px-6 pb-8" id="questions-container"></main>
  </div>
  <script>
const DATA = {
  work: {
    title: "Work & Education",
    icon: "briefcase",
    questions: [
      {
        id: "q1",
        question: "What is your job, or what would you like to do in the future?",
        polish: "Jaki jest Twój zawód, lub co chciałbyś/chciałabyś robić w przyszłości?",
        vocab: [
          { en: "currently", pl: "obecnie" },
          { en: "employed / unemployed", pl: "zatrudniony / bezrobotny" },
          { en: "experience", pl: "doświadczenie" },
          { en: "qualifications", pl: "kwalifikacje" },
          { en: "career", pl: "kariera" },
          { en: "ambition", pl: "ambicja" },
          { en: "training", pl: "szkolenie" },
          { en: "full-time / part-time", pl: "pełny / niepełny etat" }
        ],
        prompts: [
          "Start: \"I currently work as a... / At the moment, I am looking for work.\"",
          "Add detail: \"I have been doing this for... / My responsibilities include...\"",
          "Future: \"In the future, I would like to... / My goal is to...\"",
          "Reason: \"I chose this because... / I'm interested in this field because...\""
        ],
        tips: [
          "Use present simple for your current job: \"I work as...\"",
          "Use 'would like to' for future plans: \"I would like to become...\"",
          "Polish speakers often forget articles — remember: 'a teacher', 'an engineer'"
        ]
      },
      {
        id: "q2",
        question: "Tell me about your experience learning English.",
        polish: "Opowiedz o swoim doświadczeniu w nauce angielskiego.",
        vocab: [
          { en: "challenging", pl: "trudny/wymagający" },
          { en: "improve", pl: "poprawić" },
          { en: "fluent / fluency", pl: "biegły / biegłość" },
          { en: "pronunciation", pl: "wymowa" },
          { en: "grammar", pl: "gramatyka" },
          { en: "confidence", pl: "pewność siebie" },
          { en: "practice", pl: "ćwiczyć" },
          { en: "progress", pl: "postęp" }
        ],
        prompts: [
          "Start: \"I started learning English when... / I have been learning English for...\"",
          "Difficulty: \"The most challenging thing for me is... / I find ... difficult.\"",
          "Methods: \"I practice by... / I learn through...\"",
          "Progress: \"I have improved my... / I feel more confident about...\""
        ],
        tips: [
          "Use present perfect for ongoing experience: \"I have been studying...\"",
          "Common Polish error: 'I learn English since 3 years' → 'I have been learning English for 3 years'",
          "Use comparatives to show progress: 'better than before', 'more confident now'"
        ]
      }
    ]
  },
  community: {
    title: "Local Community & Environment",
    icon: "map-pin",
    questions: [
      {
        id: "q3",
        question: "Tell me about your local area (shops, transport, facilities).",
        polish: "Opowiedz o swojej okolicy (sklepy, transport, udogodnienia).",
        vocab: [
          { en: "neighbourhood", pl: "dzielnica/okolica" },
          { en: "convenient", pl: "wygodny" },
          { en: "facilities", pl: "udogodnienia" },
          { en: "public transport", pl: "transport publiczny" },
          { en: "supermarket", pl: "supermarket" },
          { en: "community centre", pl: "centrum społeczności" },
          { en: "residential area", pl: "dzielnica mieszkaniowa" },
          { en: "within walking distance", pl: "w zasięgu spaceru" }
        ],
        prompts: [
          "Start: \"I live in... / My local area is...\"",
          "Describe: \"There are several... / We have a good selection of...\"",
          "Transport: \"The transport links are... / You can easily get to...\"",
          "Opinion: \"What I like most about my area is... / It could be improved by...\""
        ],
        tips: [
          "Use 'there is/are' to describe what exists: 'There are two supermarkets nearby'",
          "Polish word order differs — in English: Subject + Verb + Object",
          "Use adjectives before nouns: 'a busy high street' not 'a high street busy'"
        ]
      },
      {
        id: "q4",
        question: "What are some problems in your community?",
        polish: "Jakie są problemy w Twojej społeczności?",
        vocab: [
          { en: "issue / problem", pl: "problem/kwestia" },
          { en: "antisocial behaviour", pl: "zachowanie aspołeczne" },
          { en: "litter / rubbish", pl: "śmieci" },
          { en: "parking", pl: "parkowanie" },
          { en: "overcrowded", pl: "zatłoczony" },
          { en: "lack of", pl: "brak" },
          { en: "solution", pl: "rozwiązanie" },
          { en: "council", pl: "rada miasta" }
        ],
        prompts: [
          "Start: \"One of the main problems in my area is...\"",
          "Explain: \"This is a problem because... / It affects people by...\"",
          "Example: \"For example,... / I have noticed that...\"",
          "Solution: \"I think this could be solved by... / The council should...\""
        ],
        tips: [
          "Use 'there is a lack of...' instead of translating 'brak' directly",
          "Give specific examples to support your points",
          "Use modal verbs for suggestions: 'should', 'could', 'might'"
        ]
      }
    ]
  },
  opinion: {
    title: "Opinion Topics",
    icon: "message-circle",
    questions: [
      {
        id: "q5",
        question: "Should schools allow students to use mobile phones?",
        polish: "Czy szkoły powinny pozwalać uczniom na używanie telefonów komórkowych?",
        vocab: [
          { en: "distraction", pl: "rozproszenie" },
          { en: "educational tool", pl: "narzędzie edukacyjne" },
          { en: "ban / prohibit", pl: "zakazać" },
          { en: "responsibility", pl: "odpowiedzialność" },
          { en: "cyberbullying", pl: "cyberprzemoc" },
          { en: "concentration", pl: "koncentracja" },
          { en: "advantage / disadvantage", pl: "zaleta / wada" },
          { en: "on the other hand", pl: "z drugiej strony" }
        ],
        prompts: [
          "State opinion: \"In my opinion,... / I believe that...\"",
          "Argument for: \"One advantage is that... / Phones can be useful because...\"",
          "Argument against: \"However,... / On the other hand,...\"",
          "Conclude: \"Overall, I think... / To sum up,...\""
        ],
        tips: [
          "Structure: Opinion → For → Against → Conclusion",
          "Use linking words: 'however', 'furthermore', 'in addition', 'nevertheless'",
          "Avoid 'I think that is good/bad' — be specific about WHY"
        ]
      },
      {
        id: "q6",
        question: "How has technology changed how we communicate?",
        polish: "Jak technologia zmieniła sposób, w jaki się komunikujemy?",
        vocab: [
          { en: "social media", pl: "media społecznościowe" },
          { en: "instant messaging", pl: "wiadomości błyskawiczne" },
          { en: "face-to-face", pl: "twarzą w twarz" },
          { en: "connect / connection", pl: "łączyć / połączenie" },
          { en: "impact", pl: "wpływ" },
          { en: "generation", pl: "pokolenie" },
          { en: "compared to", pl: "w porównaniu z" },
          { en: "significantly", pl: "znacząco" }
        ],
        prompts: [
          "Start: \"Technology has significantly changed... / In recent years,...\"",
          "Positive: \"One benefit is that... / It has made it easier to...\"",
          "Negative: \"However, some people argue that... / A disadvantage is...\"",
          "Personal: \"In my experience,... / Personally, I prefer...\""
        ],
        tips: [
          "Use present perfect for changes: 'Technology HAS changed...'",
          "Compare past and present: 'In the past... but now...'",
          "Polish speakers: watch out for 'the' — 'the technology' (specific) vs 'technology' (general)"
        ]
      },
      {
        id: "q7",
        question: "Discuss the benefits of public transport versus driving.",
        polish: "Omów korzyści z transportu publicznego w porównaniu z jazdą samochodem.",
        vocab: [
          { en: "environment / environmental", pl: "środowisko / środowiskowy" },
          { en: "pollution / emissions", pl: "zanieczyszczenie / emisje" },
          { en: "cost-effective", pl: "opłacalny" },
          { en: "congestion / traffic", pl: "zatłoczenie / ruch uliczny" },
          { en: "reliable / unreliable", pl: "niezawodny / zawodny" },
          { en: "convenience", pl: "wygoda" },
          { en: "carbon footprint", pl: "ślad węglowy" },
          { en: "commute", pl: "dojazd do pracy" }
        ],
        prompts: [
          "Start: \"There are several arguments for and against...\"",
          "Public transport: \"One key benefit of public transport is...\"",
          "Driving: \"On the other hand, driving offers...\"",
          "Conclude: \"In conclusion, I believe that... / It depends on...\""
        ],
        tips: [
          "Use comparison structures: 'more convenient than', 'less expensive than', 'as reliable as'",
          "Support opinions with reasons: 'because', 'since', 'as a result'",
          "Polish speakers: 'transport' is uncountable in English — no 'transports'"
        ]
      }
    ]
  },
  leisure: {
    title: "Leisure & Entertainment",
    icon: "music",
    questions: [
      {
        id: "q8",
        question: "What do you like to do in your free time?",
        polish: "Co lubisz robić w wolnym czasie?",
        vocab: [
          { en: "hobby", pl: "hobby" },
          { en: "pastime", pl: "rozrywka" },
          { en: "relax / relaxing", pl: "odprężyć się / uspokajający" },
          { en: "outdoor activities", pl: "aktywności na świeżym powietrzu" },
          { en: "indoor activities", pl: "aktywności w pomieszczeniu" },
          { en: "exercise", pl: "ćwiczenie" },
          { en: "creative", pl: "kreatywny" },
          { en: "social", pl: "towarzyski" }
        ],
        prompts: [
          "Start: \"In my free time, I enjoy... / I like to...\"",
          "Explain: \"It helps me to... / I find it...\"",
          "Frequency: \"I do this... times a week / when I have time\"",
          "Why: \"I choose this hobby because... / It makes me feel...\""
        ],
        tips: [
          "Use 'I enjoy + -ing' or 'I like + -ing': 'I enjoy reading', 'I like swimming'",
          "Be specific: Instead of 'I like sports', say 'I play tennis' or 'I go cycling'",
          "Common Polish error: 'I like to do' is better than 'I like doing' in most cases"
        ]
      },
      {
        id: "q9",
        question: "What type of films or TV programmes do you prefer and why?",
        polish: "Jakie filmy lub programy telewizyjne wolisz i dlaczego?",
        vocab: [
          { en: "genre", pl: "gatunek" },
          { en: "comedy", pl: "komedia" },
          { en: "drama", pl: "dramat" },
          { en: "thriller", pl: "thriller" },
          { en: "entertaining", pl: "zabawny/rozrywkowy" },
          { en: "gripping", pl: "wciągający" },
          { en: "character", pl: "postać" },
          { en: "plot", pl: "fabuła" }
        ],
        prompts: [
          "Start: \"I prefer... films / TV shows because...\"",
          "Explain: \"I find them... / They make me feel...\"",
          "Example: \"My favourite is... / I recently watched...\"",
          "Reason: \"What I like about this genre is... / It appeals to me because...\""
        ],
        tips: [
          "Use 'prefer' + noun: 'I prefer comedies' or 'I prefer to watch comedies'",
          "Describe feelings: 'gripping', 'entertaining', 'boring', 'moving', 'funny'",
          "Polish speakers: Remember plural forms — 'genres', 'films', 'programmes'"
        ]
      },
      {
        id: "q10",
        question: "Is it important to take holidays and why?",
        polish: "Czy ważne jest branie urlopu i dlaczego?",
        vocab: [
          { en: "holiday", pl: "urlop/wakacje" },
          { en: "break", pl: "przerwa" },
          { en: "stress", pl: "stres" },
          { en: "relieve", pl: "ulżyć/złagodzić" },
          { en: "recharge", pl: "naładować baterie" },
          { en: "rejuvenate", pl: "odmłodzić" },
          { en: "essential", pl: "niezbędny" },
          { en: "mental health", pl: "zdrowie psychiczne" }
        ],
        prompts: [
          "Opinion: \"In my opinion, holidays are... / I believe taking holidays is...\"",
          "Benefits: \"One reason is that... / Holidays help us to...\"",
          "Personal: \"For me personally,... / When I take a break, I feel...\"",
          "Conclusion: \"That's why I think... / Overall, I would say...\""
        ],
        tips: [
          "Use 'are important' not 'is important' — holidays is plural",
          "Support with reasons: 'because', 'as', 'since'",
          "Use present simple for general statements: 'Holidays are essential for well-being'"
        ]
      }
    ]
  },
  health: {
    title: "Health & Wellbeing",
    icon: "heart",
    questions: [
      {
        id: "q11",
        question: "What do you do to stay healthy and fit?",
        polish: "Co robisz, aby być zdrowym i w formie?",
        vocab: [
          { en: "exercise / workout", pl: "ćwiczenie / trening" },
          { en: "diet / nutrition", pl: "dieta / odżywianie" },
          { en: "balanced meal", pl: "zbilansowany posiłek" },
          { en: "fitness", pl: "kondycja fizyczna" },
          { en: "gym", pl: "siłownia" },
          { en: "sport", pl: "sport" },
          { en: "sleep", pl: "sen" },
          { en: "healthy lifestyle", pl: "zdrowy tryb życia" }
        ],
        prompts: [
          "Start: \"To stay healthy, I... / My approach to fitness involves...\"",
          "Activity: \"I exercise by... / I practice...\"",
          "Diet: \"I try to eat... / My diet includes...\"",
          "Results: \"This helps me feel... / I notice that I...\""
        ],
        tips: [
          "Use frequency adverbs: 'regularly', 'usually', 'often', 'sometimes', 'rarely'",
          "Use present simple for habits: 'I go to the gym three times a week'",
          "Polish speakers: 'fit' and 'health' are different — 'healthy' (adjective), 'health' (noun)"
        ]
      },
      {
        id: "q12",
        question: "Do you think young people today are healthier or less healthy than previous generations?",
        polish: "Czy uważasz, że młodzi ludzie dziś są zdrowsi czy mniej zdrowsi niż poprzednie pokolenia?",
        vocab: [
          { en: "sedentary", pl: "osiadły/mało aktywny" },
          { en: "obesity", pl: "otyłość" },
          { en: "aware", pl: "świadomy" },
          { en: "screen time", pl: "czas przed ekranem" },
          { en: "physical activity", pl: "aktywność fizyczna" },
          { en: "mental health", pl: "zdrowie psychiczne" },
          { en: "pressure / stress", pl: "presja / stres" },
          { en: "generation", pl: "pokolenie" }
        ],
        prompts: [
          "Opinion: \"I think young people today are... / In my opinion,...\"",
          "Positive aspect: \"On the positive side,... / They benefit from...\"",
          "Negative aspect: \"However,... / On the other hand,...\"",
          "Conclusion: \"So I believe that... / Overall, I would say...\""
        ],
        tips: [
          "Use comparatives: 'healthier than', 'less active than', 'more aware than'",
          "Support with examples: 'For instance...', 'For example...', 'Such as...'",
          "Use 'I think' + adjective: 'I think young people are more stressed' not 'I think that young people have more stress'"
        ]
      },
      {
        id: "q13",
        question: "What is your biggest health concern in modern life?",
        polish: "Jaki jest Twój największy problem zdrowotny w nowoczesnym życiu?",
        vocab: [
          { en: "concern", pl: "obawa/troska" },
          { en: "pollution", pl: "zanieczyszczenie" },
          { en: "obesity", pl: "otyłość" },
          { en: "stress-related", pl: "związany ze stresem" },
          { en: "anxiety", pl: "lęk" },
          { en: "sleep deprivation", pl: "niedobór snu" },
          { en: "inactivity", pl: "bezruch" },
          { en: "processed food", pl: "żywność przetworzona" }
        ],
        prompts: [
          "Start: \"My biggest health concern is... / I am most worried about...\"",
          "Explain: \"This concerns me because... / The problem is that...\"",
          "Impact: \"It affects people by... / The consequences include...\"",
          "Solution: \"I think we should... / The solution might be...\""
        ],
        tips: [
          "Use 'I am concerned about' or 'I am worried about' with nouns",
          "Use 'this affects / influences' to explain impact",
          "Present specific concerns rather than vague ones"
        ]
      }
    ]
  },
  travel: {
    title: "Travel & Culture",
    icon: "globe",
    questions: [
      {
        id: "q14",
        question: "Tell me about a memorable trip or holiday you have taken.",
        polish: "Opowiedz o niezapomnianych podróżach lub wakacjach, które odbyłeś/odbyłaś.",
        vocab: [
          { en: "destination", pl: "cel podróży" },
          { en: "memorable", pl: "niezapomniany" },
          { en: "experience", pl: "doświadczenie" },
          { en: "culture", pl: "kultura" },
          { en: "attraction", pl: "atrakcja" },

let activeSection = 'work';
let practised = new Set();
let expandedCard = null;

const defaultConfig = {
  app_title: "ESL Speaking Practice",
  encouragement_text: "You're doing great!",
  background_color: "#0f1729",
  surface_color: "#162039",
  text_color: "#f0f4fc",
  accent_color: "#e85d4a",
  muted_color: "#7b8db5",
  font_family: "Outfit",
  font_size: 16
};

function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const accent = config.accent_color || defaultConfig.accent_color;
  const muted = config.muted_color || defaultConfig.muted_color;
  const font = config.font_family || defaultConfig.font_family;
  const size = config.font_size || defaultConfig.font_size;

  const app = document.getElementById('app');
  app.style.background = bg;
  app.style.fontFamily = `${font}, Outfit, sans-serif`;
  app.style.fontSize = `${size}px`;

  document.getElementById('main-title').textContent = config.app_title || defaultConfig.app_title;
  document.getElementById('main-title').style.color = text;
  document.getElementById('encouragement').textContent = config.encouragement_text || defaultConfig.encouragement_text;
  document.getElementById('encouragement').style.color = accent;

  // Update header
  const header = document.querySelector('header');
  header.style.background = `linear-gradient(135deg, ${bg} 0%, ${surface} 100%)`;

  // Update tabs
  document.querySelectorAll('.section-tab').forEach(tab => {
    const isActive = tab.dataset.section === activeSection;
    tab.style.background = isActive ? accent : surface;
    tab.style.color = isActive ? '#fff' : muted;
  });

  // Update progress
  document.getElementById('progress-text').style.color = muted;

  // Re-render questions
  renderQuestions(config);
}

function renderQuestions(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const accent = config.accent_color || defaultConfig.accent_color;
  const muted = config.muted_color || defaultConfig.muted_color;

  const container = document.getElementById('questions-container');
  const section = DATA[activeSection];
  
  container.innerHTML = section.questions.map(q => {
    const isOpen = expandedCard === q.id;
    const isDone = practised.has(q.id);
    return `
      <div class="question-card" style="background: ${surface}; border-color: ${isOpen ? accent : 'transparent'};" onclick="toggleCard('${q.id}')">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              ${isDone ? `<span style="color: #4ade80;"><i data-lucide="check-circle" style="width:18px;height:18px;"></i></span>` : `<span style="color: ${muted};"><i data-lucide="circle" style="width:18px;height:18px;"></i></span>`}
              <span class="text-xs font-medium px-2 py-0.5 rounded-full" style="background: ${accent}22; color: ${accent};">Question</span>
            </div>
            <h3 class="font-semibold text-lg mt-2" style="color: ${text};">${q.question}</h3>
            <p class="polish-hint mt-1" style="color: ${muted};">🇵🇱 ${q.polish}</p>
          </div>
          <i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" style="width:20px;height:20px;color:${muted};margin-top:8px;flex-shrink:0;"></i>
        </div>

        <div class="expand-content ${isOpen ? 'open' : ''}" onclick="event.stopPropagation();">
          <!-- Vocabulary -->
          <div class="mt-5">
            <h4 class="text-sm font-semibold mb-2 flex items-center gap-1" style="color: ${accent};">
              <i data-lucide="book-open" style="width:14px;height:14px;"></i> Key Vocabulary / Słownictwo
            </h4>
            <div class="flex flex-wrap">
              ${q.vocab.map(v => `<span class="vocab-chip" style="background: ${accent}18; color: ${text}; border: 1px solid ${accent}33;" title="${v.pl}"><strong>${v.en}</strong> <span style="color:${muted};font-size:0.78rem;">— ${v.pl}</span></span>`).join('')}
            </div>
          </div>

          <!-- Speaking Prompts -->
          <div class="mt-5">
            <h4 class="text-sm font-semibold mb-2 flex items-center gap-1" style="color: ${accent};">
              <i data-lucide="message-square" style="width:14px;height:14px;"></i> Speaking Prompts / Podpowiedzi
            </h4>
            ${q.prompts.map(p => `<div class="prompt-bubble" style="background: ${bg}; color: ${text}; border-left: 3px solid ${accent};">${p}</div>`).join('')}
          </div>

          <!-- Tips -->
          <div class="tip-box" style="background: ${accent}12; border: 1px solid ${accent}30;">
            <h4 class="text-sm font-semibold mb-2 flex items-center gap-1" style="color: ${accent};">
              <i data-lucide="lightbulb" style="width:14px;height:14px;"></i> Tips for Polish Speakers / Wskazówki
            </h4>
            <ul style="color: ${text}; font-size: 0.88rem; padding-left: 16px; margin: 0;">
              ${q.tips.map(t => `<li style="margin-bottom: 6px;">${t}</li>`).join('')}
            </ul>
          </div>

          <!-- Practice Button -->
          <button onclick="event.stopPropagation(); markPractised('${q.id}');" class="mt-4 w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all" style="background: ${isDone ? '#4ade8033' : accent}; color: ${isDone ? '#4ade80' : '#fff'};">
            ${isDone ? '<i data-lucide="check" style="width:16px;height:16px;"></i> Practised! / Przećwiczono!' : '<i data-lucide="mic" style="width:16px;height:16px;"></i> Mark as Practised / Oznacz jako przećwiczone'}
          </button>
        </div>
      </div>
    `;
  }).join('');

  lucide.createIcons();
  updateProgress();
}

function switchSection(section) {
  activeSection = section;
  expandedCard = null;
  applyConfig(window.elementSdk?.config || defaultConfig);
}

function toggleCard(id) {
  expandedCard = expandedCard === id ? null : id;
  applyConfig(window.elementSdk?.config || defaultConfig);
}

function markPractised(id) {
  practised.add(id);
  applyConfig(window.elementSdk?.config || defaultConfig);
}

function updateProgress() {
  const total = Object.values(DATA).reduce((sum, s) => sum + s.questions.length, 0);
  const done = practised.size;
  const dotsContainer = document.getElementById('progress-dots');
  const allIds = Object.values(DATA).flatMap(s => s.questions.map(q => q.id));
  
  const accent = (window.elementSdk?.config || defaultConfig).accent_color || defaultConfig.accent_color;
  const muted = (window.elementSdk?.config || defaultConfig).muted_color || defaultConfig.muted_color;
  
  dotsContainer.innerHTML = allIds.map(id => 
    `<div class="progress-dot" style="background: ${practised.has(id) ? '#4ade80' : muted + '44'};"></div>`
  ).join('');
  document.getElementById('progress-text').textContent = `${done}/${total} practised`;
}

// SDK Init
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
      { get: () => config.muted_color || defaultConfig.muted_color, set: (v) => { config.muted_color = v; window.elementSdk.setConfig({ muted_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["app_title", config.app_title || defaultConfig.app_title],
    ["encouragement_text", config.encouragement_text || defaultConfig.encouragement_text]
  ])
});

// Initial render
applyConfig(defaultConfig);
</script>
