  <script src="/_sdk/6f16dc4ffc0cf3fe.editing_sdk.js" integrity="sha512-XcGkt+MVg9QK/rlrq9umdkP9LzshVjIu+vaITjWOSFti+dqk5aHBHkCCQ/IXnnUyJtw0F+lYzvT7m4EfPrBrjg=="></script>
  <script>
    const answers = [
      { id: "answer-1", accepted: ["blow out"] },
      { id: "answer-2", accepted: ["wrap"] },
      { id: "answer-3", accepted: ["throw"] },
      { id: "answer-4", accepted: ["make a wish"] }
    ];

    const feedback = document.getElementById("feedback");
    const form = document.getElementById("writing-form");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      let score = 0;

      answers.forEach(function (item) {
        const input = document.getElementById(item.id);
        const value = input.value.trim().toLowerCase().replace(/\s+/g, " ");
        const correct = item.accepted.includes(value);

        input.classList.remove("is-correct", "is-incorrect");
        input.classList.add(correct ? "is-correct" : "is-incorrect");
        input.setAttribute("aria-invalid", String(!correct));
        if (correct) score++;
      });

      if (score === answers.length) {
        feedback.textContent = "Excellent! You got all 4 answers right.";
        feedback.style.color = "#27775e";
      } else {
        feedback.textContent = "You got " + score + " out of 4. Check the highlighted answers and try again.";
        feedback.style.color = "#b73a2d";
      }
    });

    document.getElementById("reset-button").addEventListener("click", function () {
      form.reset();
      feedback.textContent = "";
      answers.forEach(function (item) {
        const input = document.getElementById(item.id);
        input.classList.remove("is-correct", "is-incorrect");
        input.removeAttribute("aria-invalid");
      });
      document.getElementById("answer-1").focus();
    });

    document.querySelectorAll(".prompt-card").forEach(function (card) {
      card.addEventListener("click", function () {
        const wasActive = card.classList.contains("is-active");
        document.querySelectorAll(".prompt-card").forEach(function (item) {
          item.classList.remove("is-active");
          item.setAttribute("aria-pressed", "false");
        });
        if (!wasActive) {
          card.classList.add("is-active");
          card.setAttribute("aria-pressed", "true");
        }
      });
    });

    lucide.createIcons();
  </script>
