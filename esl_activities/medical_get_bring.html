  <script>
    const completedItems = new Set();
    const answers = {
      "writing-1":"get over", "writing-2":"get through", "writing-3":"bring up",
      "writing-4":"bring round", "writing-5":"look after", "writing-6":"come down",
      "writing-7":"rule out", "writing-8":"follow up", "writing-9":"carry out",
      "writing-10":"put off", "writing-11":"come off", "writing-12":"step down"
    };

    function updateScore() {
      document.getElementById("score-value").textContent = completedItems.size + " / 22";
    }

    function showFeedback(question, correct) {
      document.querySelector('[data-feedback="' + question + '-correct"]').classList.toggle("is-visible", correct);
      document.querySelector('[data-feedback="' + question + '-try"]').classList.toggle("is-visible", !correct);
    }

    document.querySelectorAll(".choice-button").forEach(function(button) {
      button.addEventListener("click", function() {
        const question = button.dataset.question;
        const card = document.querySelector('[data-question="' + question + '"]');
        card.querySelectorAll(".choice-button").forEach(function(choice) {
          choice.classList.remove("is-selected");
          choice.setAttribute("aria-pressed", "false");
        });
        button.classList.add("is-selected");
        button.setAttribute("aria-pressed", "true");
        const isCorrect = button.dataset.correct === "true";
        showFeedback(question, isCorrect);
        if (isCorrect) completedItems.add(question); else completedItems.delete(question);
        updateScore();
      });
    });

    document.getElementById("writing-form").addEventListener("submit", function(event) { event.preventDefault(); });

    document.getElementById("check-writing").addEventListener("click", function() {
      let allCorrect = true;
      Object.keys(answers).forEach(function(id) {
        const input = document.getElementById(id);
        const isCorrect = input.value.trim().toLowerCase() === answers[id];
        input.classList.remove("is-correct", "is-incorrect");
        input.classList.add(isCorrect ? "is-correct" : "is-incorrect");
        if (isCorrect) completedItems.add(id); else { completedItems.delete(id); allCorrect = false; }
      });
      document.getElementById("writing-success").classList.toggle("is-visible", allCorrect);
      document.getElementById("writing-review").classList.toggle("is-visible", !allCorrect);
      updateScore();
    });

    document.getElementById("restart-button").addEventListener("click", function() {
      completedItems.clear();
      document.querySelectorAll(".choice-button").forEach(function(button) {
        button.classList.remove("is-selected");
        button.setAttribute("aria-pressed", "false");
      });
      document.querySelectorAll(".feedback").forEach(function(feedback) { feedback.classList.remove("is-visible"); });
      Object.keys(answers).forEach(function(id) {
        const input = document.getElementById(id);
        input.value = "";
        input.classList.remove("is-correct", "is-incorrect");
      });
      updateScore();
      document.getElementById("writing-1").focus();
    });

    lucide.createIcons();
  </script>
