  <script src="/_sdk/c3c8758f0a2727e0.editing_sdk.js" integrity="sha512-dyaCX4172SqnJJDw8FNGinvlT71y2EFM1ID83T2DJ7G455DOCPKL4zf8kbl1l0WewivrfD9Ggsxm/8sCD8GAJA=="></script>
  <script>
const exercises = [
    { type: 'fill', category: 'Phrasal verbs', prompt: 'I need to ___ over this cold before Monday.', answer: 'get', hint: 'get over = recover from' },
    { type: 'fill', category: 'Phrasal verbs', prompt: 'How do you ___ on with your new colleagues?', answer: 'get', hint: 'get on with = have a relationship with' },
    { type: 'fill', category: 'Phrasal verbs', prompt: 'She finally ___ round to fixing the leak.', answer: 'got', hint: 'get round to = find time to do' },
    { type: 'fill', category: 'Passive (get + past participle)', prompt: 'He ___ fired after the incident.', answer: 'got', hint: 'got fired = was fired' },
    { type: 'fill', category: 'Passive (get + past participle)', prompt: 'They ___ married in a tiny chapel.', answer: 'got', hint: 'got married = were married' },
    { type: 'fill', category: 'Change of state', prompt: "It's ___ dark — we should head home.", answer: 'getting', hint: 'getting + adjective = becoming' },
    { type: 'fill', category: 'Change of state', prompt: "Don't ___ upset — it's not worth it.", answer: 'get', hint: 'get + adjective = become' },
    { type: 'fill', category: 'Causative', prompt: 'I need to ___ my car serviced.', answer: 'get', hint: 'get something done = arrange for it' },
    { type: 'fill', category: 'Causative', prompt: 'She ___ him to agree by being persistent.', answer: 'got', hint: 'get someone to do = persuade' },
    { type: 'fill', category: 'Idioms', prompt: "Let's ___ down to business.", answer: 'get', hint: 'get down to = start seriously' },
    { type: 'fill', category: 'Idioms', prompt: "I can't ___ my head around this grammar rule.", answer: 'get', hint: 'get your head around = understand' },
    { type: 'fill', category: 'Phrasal verbs', prompt: 'We need to ___ rid of these old files.', answer: 'get', hint: 'get rid of = dispose of' },
];

const prompts = [
    { text: "Describe a time you had to get over a disappointment. What helped you recover?", cat: "Get over — recovery" },
    { text: "How do you get on with people who have very different opinions from yours?", cat: "Get on with — relationships" },
    { text: "Is there something you've been meaning to get round to but keep postponing? Why?", cat: "Get round to — procrastination" },
    { text: "Have you ever got lost in a foreign city? What happened?", cat: "Get + past participle" },
    { text: "Do you think it's getting harder to find a good work-life balance? Why?", cat: "Getting + adjective — change" },
    { text: "What's something you need to get done this week? How will you manage it?", cat: "Causative get" },
    { text: "Describe a concept that took you a long time to get your head around.", cat: "Idiom — understanding" },
    { text: "How do you get away from stress? Do you have any rituals?", cat: "Get away — escape" },
    { text: "Tell me about a time you got someone to change their mind. How did you do it?", cat: "Get someone to do — persuasion" },
    { text: "What gets on your nerves about modern technology?", cat: "Get on one's nerves — annoyance" },
];

let answered = 0, correct = 0, currentPrompt = 0;

function buildExercises() {
    const container = document.getElementById('exercises-container');
    container.innerHTML = '';
    exercises.forEach((ex, i) => {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-xl p-5 shadow-sm border border-gray-100';
        div.innerHTML = `
            <span class="text-xs font-medium text-teal-600 bg-teal-50 px-2 py-0.5 rounded">${ex.category}</span>
            <p class="mt-3 text-gray-800 text-lg">${ex.prompt.replace('___', `<input type="text" id="input-${i}" class="border-b-2 border-teal-300 outline-none w-24 text-center font-medium mx-1 bg-transparent" autocomplete="off">`)}</p>
            <div class="mt-3 flex items-center gap-3 flex-wrap">
                <button onclick="checkAnswer(${i})" class="text-sm px-4 py-1.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700 transition">Check</button>
                <button onclick="showHint(${i})" class="text-sm px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 transition">Show hint</button>
                <span id="hint-${i}" class="text-sm text-gray-500 italic hidden">${ex.hint}</span>
                <span id="feedback-${i}" class="text-sm font-medium hidden"></span>
            </div>
        `;
        container.appendChild(div);
    });
    updateScore();
}

function checkAnswer(i) {
    const input = document.getElementById(`input-${i}`);
    const feedback = document.getElementById(`feedback-${i}`);
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    if (val === exercises[i].answer) {
        input.classList.add('correct');
        feedback.textContent = '✓ Correct!';
        feedback.className = 'text-sm font-medium text-green-600';
        if (!input.dataset.answered) { answered++; correct++; input.dataset.answered = '1'; }
    } else {
        input.classList.add('incorrect');
        feedback.textContent = `✗ Answer: "${exercises[i].answer}"`;
        feedback.className = 'text-sm font-medium text-red-600';
        if (!input.dataset.answered) { answered++; input.dataset.answered = '1'; }
    }
    feedback.classList.remove('hidden');
    updateScore();
}

function showHint(i) { document.getElementById(`hint-${i}`).classList.remove('hidden'); }
function updateScore() { document.getElementById('score-display').textContent = `${correct} / ${answered}`; }
function resetExercises() { answered = 0; correct = 0; buildExercises(); }

function switchTab(tab) {
    document.getElementById('section-written').classList.toggle('hidden', tab !== 'written');
    document.getElementById('section-convo').classList.toggle('hidden', tab !== 'convo');
    document.getElementById('section-guide').classList.toggle('hidden', tab !== 'guide');
    document.getElementById('tab-written').classList.toggle('tab-active', tab === 'written');
    document.getElementById('tab-written').classList.toggle('text-gray-500', tab !== 'written');
    document.getElementById('tab-convo').classList.toggle('tab-active', tab === 'convo');
    document.getElementById('tab-convo').classList.toggle('text-gray-500', tab !== 'convo');
    document.getElementById('tab-guide').classList.toggle('tab-active', tab === 'guide');
    document.getElementById('tab-guide').classList.toggle('text-gray-500', tab !== 'guide');
}

function showPrompt() {
    document.getElementById('prompt-text').textContent = prompts[currentPrompt].text;
    document.getElementById('prompt-category').textContent = prompts[currentPrompt].cat;
}
function nextPrompt() { currentPrompt = (currentPrompt + 1) % prompts.length; showPrompt(); }
function prevPrompt() { currentPrompt = (currentPrompt - 1 + prompts.length) % prompts.length; showPrompt(); }

buildExercises();
showPrompt();
lucide.createIcons();
</script>
